name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cards:
    name: Lint, check, and build cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agentic-studying-loop (asl)
        run: pip install git+https://github.com/yungselm/agentic-studying-loop

      - name: Install Rust (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint cards (ids, duplicates, self-contained)
        run: asl lint -q --skip size,literal cards/core cards/neetcode additional_cards/_example

      - name: Literal check (non-blocking until the known flags are triaged)
        continue-on-error: true
        run: asl lint -q --skip size cards/core cards/neetcode

      - name: Check cards (clippy + cargo test on every solution)
        run: asl check cards/core cards/neetcode additional_cards/_example

      - name: Build .apkg
        run: asl build cards/core cards/neetcode -o output/CodeCards.apkg

      - name: Upload CodeCards.apkg
        uses: actions/upload-artifact@v4
        with:
          name: CodeCards
          path: output/CodeCards.apkg
