name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cards:
    name: Lint, check, and build cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Rust (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint cards (self-contained, no cross-references)
        # Non-blocking for now: the current card set has some known/reviewable
        # flags not yet triaged into lint_cards.py's ALLOW list. Remove
        # continue-on-error once the backlog is clean.
        continue-on-error: true
        run: python lint_cards.py

      - name: Check cards (clippy + cargo test on every solution)
        run: python check_cards.py

      - name: Build .apkg
        run: python build.py

      - name: Upload CodeCards.apkg
        uses: actions/upload-artifact@v4
        with:
          name: CodeCards
          path: output/CodeCards.apkg
