  solution: |
    use std::collections::HashMap;

    #[derive(Default, Debug, PartialEq)]
    struct TeamScores {
        goals_scored: u8,
        goals_conceded: u8,
    }

    fn build_scores_table(results: &str) -> HashMap<&str, TeamScores> {
        let mut scores: HashMap<&str, TeamScores> = HashMap::new();
        for line in results.lines() {
            let mut parts = line.split(',');
            let team_1 = parts.next().unwrap();
            let team_2 = parts.next().unwrap();
            let score_1: u8 = parts.next().unwrap().parse().unwrap();
            let score_2: u8 = parts.next().unwrap().parse().unwrap();

            let e1 = scores.entry(team_1).or_default();
            e1.goals_scored += score_1;
            e1.goals_conceded += score_2;

            let e2 = scores.entry(team_2).or_default();
            e2.goals_scored += score_2;
            e2.goals_conceded += score_1;
        }
        scores
    }
  notes: |
    `entry(team).or_default()` inserts a zeroed `TeamScores` the first time a team is
    seen (needs `TeamScores: Default`), then returns `&mut TeamScores` so you can add
    onto its fields. This "look up, inserting a default, then mutate" is the core
    accumulation idiom.
  source: "Rustlings hashmaps3 · std Entry::or_default"
  tags: [rust, hashmap, rustlings]
  tests: |
    let t = build_scores_table("England,France,4,2\nFrance,Italy,3,1");
    let eng = t.get("England").unwrap();
    assert_eq!((eng.goals_scored, eng.goals_conceded), (4, 2));
    let fr = t.get("France").unwrap();
    assert_eq!((fr.goals_scored, fr.goals_conceded), (5, 5));

- type: concept
  question: |
    On a `HashMap<String, V>`, when can you pass a `&str` directly and when do you
    still need `.to_string()`?
  answer: |
    **Reads (`get`, `contains_key`, `remove`) accept a borrowed `&str`
    directly; writes that store a new key (`insert`, `entry`) need an owned
    `String`.**

    READS take a BORROWED key, so pass `&str` with no allocation: `get`, `get_mut`,
    `contains_key`, and `remove` are generic over `&Q where String: Borrow<Q>`, and
    `String: Borrow<str>` — so `map.get("foo")` or `map.contains_key(name)` just
    work (no `.to_string()`).
    WRITES that store a NEW key take it BY VALUE (`K = String`), so you must own it:
    `insert(k, v)` and `entry(k)` need a `String` — hence `key.to_string()` (or
    `key.to_owned()` / `String::from(key)`).
    Rule of thumb: looking something UP -> `&str` is fine; putting a new key IN ->
    you allocate the owned `String`. clippy's `unnecessary_to_owned` flags a
    needless `.to_string()` on the lookup side, but can't remove the required one on
    `insert` / `entry`.
  source: "std collections::HashMap; std::borrow::Borrow"
  tags: [rust, hashmap, borrow, concept]
