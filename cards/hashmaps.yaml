- instruction: |
    Write `keys_sorted(m: &HashMap<String, i32>) -> Vec<String>`: the keys,
    sorted (since HashMap order is undefined).
  starter: |
    use std::collections::HashMap;

    fn keys_sorted(m: &HashMap<String, i32>) -> Vec<String> {

    }
  solution: |
    use std::collections::HashMap;

    fn keys_sorted(m: &HashMap<String, i32>) -> Vec<String> {
        let mut ks: Vec<String> = m.keys().cloned().collect();
        ks.sort();
        ks
    }
  notes: |
    HashMap iteration order is unspecified; collect and `sort` for deterministic
    output (or use a `BTreeMap`).
  source: "std HashMap::keys"
  tags: [rust, hashmap]
  tests: |
    let mut m = HashMap::new();
    m.insert("b".to_string(), 1);
    m.insert("a".to_string(), 2);
    assert_eq!(keys_sorted(&m), vec!["a".to_string(), "b".to_string()]);

- instruction: |
    Write `double_values(m: &mut HashMap<String, i32>)` doubling every value
    in place.
  starter: |
    use std::collections::HashMap;

    fn double_values(m: &mut HashMap<String, i32>) {

    }
  solution: |
    use std::collections::HashMap;

    fn double_values(m: &mut HashMap<String, i32>) {
        for v in m.values_mut() {
            *v *= 2;
        }
    }
  notes: |
    `values_mut()` yields `&mut V` for each value.
  source: "std HashMap::values_mut"
  tags: [rust, hashmap]
  tests: |
    let mut m = HashMap::new();
    m.insert("a".to_string(), 2);
    m.insert("b".to_string(), 3);
    double_values(&mut m);
    assert_eq!(m["a"], 4);
    assert_eq!(m["b"], 6);

- instruction: |
    Write `index_by_len(words: &[&str]) -> HashMap<usize, String>` mapping each
    length to a word of that length (later wins). Build it with `collect`.
  starter: |
    use std::collections::HashMap;

    fn index_by_len(words: &[&str]) -> HashMap<usize, String> {

    }
  solution: |
    use std::collections::HashMap;

    fn index_by_len(words: &[&str]) -> HashMap<usize, String> {
        words.iter().map(|w| (w.len(), w.to_string())).collect()
    }
  notes: |
    An iterator of `(K, V)` tuples collects straight into a `HashMap`; duplicate
    keys keep the last value.
  source: "std FromIterator for HashMap"
  tags: [rust, hashmap]
  tests: |
    let m = index_by_len(&["a", "bb", "cc"]);
    assert_eq!(m.get(&1), Some(&"a".to_string()));
    assert_eq!(m.get(&2), Some(&"cc".to_string()));

- instruction: |
    Write `count_with_default(s: &str) -> HashMap<char, i32>` returning how many
    times each character appears in `s`, using the entry API's `or_default()`.
    Example: "aab" -> {'a': 2, 'b': 1}.
  starter: |
    use std::collections::HashMap;

    fn count_with_default(s: &str) -> HashMap<char, i32> {

    }
  solution: |
    use std::collections::HashMap;

    fn count_with_default(s: &str) -> HashMap<char, i32> {
        let mut m: HashMap<char, i32> = HashMap::new();
        for c in s.chars() {
            *m.entry(c).or_default() += 1;
        }
        m
    }
  notes: |
    `or_default()` inserts `V::default()` when absent — 0 for integers. Needs
    `V: Default`.
  source: "std Entry::or_default"
  tags: [rust, hashmap, entry]
  tests: |
    let counts = count_with_default("aab");
    assert_eq!(counts.get(&'a'), Some(&2));
    assert_eq!(counts.get(&'b'), Some(&1));

- instruction: |
    Write `bump(m: &mut HashMap<String, i32>, key: &str)`: increment the value,
    or insert 1 if absent, using `and_modify` + `or_insert`.
  starter: |
    use std::collections::HashMap;

    fn bump(m: &mut HashMap<String, i32>, key: &str) {

    }
  solution: |
    use std::collections::HashMap;

    fn bump(m: &mut HashMap<String, i32>, key: &str) {
        m.entry(key.to_string()).and_modify(|v| *v += 1).or_insert(1);
    }
  notes: |
    `and_modify(f)` runs `f` on an existing value; `or_insert(d)` supplies the
    value when the key is new. Together: "update or initialize".
  source: "std Entry::and_modify"
  tags: [rust, hashmap, entry]
  tests: |
    let mut m = HashMap::new();
    bump(&mut m, "a");
    bump(&mut m, "a");
    bump(&mut m, "b");
    assert_eq!(m["a"], 2);
    assert_eq!(m["b"], 1);

