  starter: |
    use std::collections::HashSet;

    fn add_new(set: &mut HashSet<i32>, x: i32) -> bool {

    }
  solution: |
    use std::collections::HashSet;

    fn add_new(set: &mut HashSet<i32>, x: i32) -> bool {
