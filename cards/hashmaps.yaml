- instruction: |
    Write `merge(into: &mut HashMap<String, i32>, other: HashMap<String, i32>)`
    folding `other` into `into` (other's values win on conflict).
  starter: |
    use std::collections::HashMap;

    fn merge(into: &mut HashMap<String, i32>, other: HashMap<String, i32>) {

    }
  solution: |
    use std::collections::HashMap;

    fn merge(into: &mut HashMap<String, i32>, other: HashMap<String, i32>) {
        into.extend(other);
    }
  notes: |
    A HashMap is `IntoIterator` of `(K, V)`, so `extend` inserts each pair,
    overwriting existing keys.
  source: "std HashMap::extend"
  tags: [rust, hashmap]

- instruction: |
    Write `unique(v: &[i32]) -> HashSet<i32>` collecting the distinct values.
  starter: |
    use std::collections::HashSet;

    fn unique(v: &[i32]) -> HashSet<i32> {

    }
  solution: |
    use std::collections::HashSet;

    fn unique(v: &[i32]) -> HashSet<i32> {
        v.iter().copied().collect()
    }
  notes: |
    A `HashSet` stores unique values with O(1) average membership. Collecting an
    iterator dedups automatically.
  source: "std FromIterator for HashSet"
  tags: [rust, hashset]

- instruction: |
    Write `add_new(set: &mut HashSet<i32>, x: i32) -> bool` returning whether the
