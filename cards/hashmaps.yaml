- instruction: |
    Write `common(a: &HashSet<i32>, b: &HashSet<i32>) -> Vec<i32>` returning the
    values present in both.
  starter: |
    use std::collections::HashSet;

    fn common(a: &HashSet<i32>, b: &HashSet<i32>) -> Vec<i32> {

    }
  solution: |
    use std::collections::HashSet;

    fn common(a: &HashSet<i32>, b: &HashSet<i32>) -> Vec<i32> {
        a.intersection(b).copied().collect()
    }
  notes: |
    `intersection`, `union`, `difference`, and `symmetric_difference` all return
    iterators of `&T`.
  source: "std HashSet::intersection"
  tags: [rust, hashset]

- instruction: |
    Write `count_unique(v: &[i32]) -> usize`: number of distinct values, via a
    `HashSet`.
  starter: |
    use std::collections::HashSet;

    fn count_unique(v: &[i32]) -> usize {

    }
  solution: |
    use std::collections::HashSet;

    fn count_unique(v: &[i32]) -> usize {
        v.iter().collect::<HashSet<_>>().len()
    }
  notes: |
    Collecting `&i32`s into a `HashSet<&i32>` then `len()` counts distinct values
