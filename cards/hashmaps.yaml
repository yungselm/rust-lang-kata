- instruction: |
    Write `most_common(s: &str) -> Option<char>`: the most frequent character
    (None if empty). Count with a HashMap, then pick the max.
  starter: |
    use std::collections::HashMap;

    fn most_common(s: &str) -> Option<char> {

    }
  solution: |
    use std::collections::HashMap;

    fn most_common(s: &str) -> Option<char> {
        let mut m: HashMap<char, usize> = HashMap::new();
        for c in s.chars() {
            *m.entry(c).or_insert(0) += 1;
        }
        m.into_iter().max_by_key(|&(_, count)| count).map(|(c, _)| c)
    }
  notes: |
    `into_iter()` consumes the map into `(char, usize)` pairs; `max_by_key` finds
    the largest count; `map` keeps just the char.
  source: "std Iterator::max_by_key"
  tags: [rust, hashmap, iterators]
  tests: |
    assert_eq!(most_common("aab"), Some('a'));
    assert_eq!(most_common(""), None);

