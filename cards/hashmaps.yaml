- instruction: |
    Write `first_seen(m: &mut HashMap<char, Vec<usize>>, c: char, idx: usize)`
    recording `idx` under `c`; when `c` is new, pre-size the Vec with
    `Vec::with_capacity(4)` via `or_insert_with` (a non-default initializer,
    so `or_default()` wouldn't fit).
  starter: |
    use std::collections::HashMap;

    fn first_seen(m: &mut HashMap<char, Vec<usize>>, c: char, idx: usize) {

    }
  solution: |
    use std::collections::HashMap;

    fn first_seen(m: &mut HashMap<char, Vec<usize>>, c: char, idx: usize) {
        m.entry(c).or_insert_with(|| Vec::with_capacity(4)).push(idx);
    }
  notes: |
    `or_insert_with(f)` calls `f` only when the key is absent — the right tool
    when the default ISN'T simply `Default::default()` (here, a pre-sized
    Vec). Reach for `or_default()` instead when the default really is the
    type's `Default`.
  source: "std Entry::or_insert_with"
  tags: [rust, hashmap, entry]
  tests: |
    let mut m = HashMap::new();
    first_seen(&mut m, 'a', 0);
    first_seen(&mut m, 'a', 5);
    first_seen(&mut m, 'b', 2);
    assert_eq!(m[&'a'], vec![0, 5]);
    assert_eq!(m[&'b'], vec![2]);

- instruction: |
    Write `all_and_only_a(a: &HashSet<i32>, b: &HashSet<i32>) -> (Vec<i32>, Vec<i32>)`
    returning (sorted union, sorted values only in `a`), using `union` and
    `difference`.
  starter: |
    use std::collections::HashSet;

    fn all_and_only_a(a: &HashSet<i32>, b: &HashSet<i32>) -> (Vec<i32>, Vec<i32>) {

    }
  solution: |
    use std::collections::HashSet;

    fn all_and_only_a(a: &HashSet<i32>, b: &HashSet<i32>) -> (Vec<i32>, Vec<i32>) {
        let mut all: Vec<i32> = a.union(b).copied().collect();
        all.sort();
        let mut only_a: Vec<i32> = a.difference(b).copied().collect();
        only_a.sort();
        (all, only_a)
    }
  notes: |
    `union` yields every value in EITHER set (no duplicates); `difference`
    yields values in `a` but NOT in `b` (order matters — swap the receiver and
    argument for the reverse). Sort before comparing, since set iteration
    order is unspecified.
  source: "std HashSet::union / HashSet::difference"
  tags: [rust, hashset]
  tests: |
    let a: HashSet<i32> = [1, 2, 3].into_iter().collect();
    let b: HashSet<i32> = [2, 3, 4].into_iter().collect();
    let (all, only_a) = all_and_only_a(&a, &b);
    assert_eq!(all, vec![1, 2, 3, 4]);
    assert_eq!(only_a, vec![1]);

# --- concept cards ---
- type: concept
  question: |
    What problem does the `entry` API solve, and what are its main methods?
  answer: |
    **The `entry` API avoids looking a key up twice for "insert if missing /
    update if present" — one lookup instead of two.**

    `map.entry(k)` returns a handle; then `.or_insert(d)`, `.or_insert_with(f)`,
    `.or_default()`, or `.and_modify(f)` operate with a single lookup. Idiomatic
    for counters and grouping.
  source: "book §8.3 / std HashMap::entry"
  tags: [rust, hashmap, concept]

- type: concept
  question: |
    Why can you call `map.get("x")` when the keys are `String`?
  answer: |
    **Because `get` is generic over a borrowed key form via `Borrow`, and
    `String: Borrow<str>`, so a `&str` works directly.**

    `get<Q>(&self, k: &Q) where K: Borrow<Q>, Q: Hash + Eq` — no allocating a
    `String` just to look something up.
  source: "std HashMap::get"
  tags: [rust, hashmap, concept]

- type: concept
  question: |
    Is HashMap (and HashSet) iteration order stable or predictable?
  answer: |
    **No — HashMap/HashSet iteration order is unspecified and randomized per
    run (HashDoS resistance), so never rely on it.**

    For ordered output, collect into a Vec and sort, or use a
    `BTreeMap`/`BTreeSet` (sorted, O(log n)).
  source: "std HashMap"
  tags: [rust, hashmap, concept]

- type: concept
  question: |
    Difference between `entry(k).or_insert(v)` and `or_insert_with(f)` /
    `or_default()`?
  answer: |
    **`or_insert(v)` is eager (the value is always built), while
    `or_insert_with(f)` is lazy (`f` runs only when the key is absent).**

    Use `or_insert_with` when the default allocates or is costly.
    `or_default()` is shorthand for `or_insert_with(Default::default)`, which
    clippy prefers for an empty `Vec`, `0`, and similar defaults.
  source: "std Entry (or_insert / or_insert_with / or_default)"
  tags: [rust, hashmap, concept]

