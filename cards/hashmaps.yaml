# HashMap & HashSet operations — insert/get, the entry API, iteration, sets.
- instruction: |
    Write `build() -> HashMap<String, i32>` inserting "a" -> 1 and "b" -> 2.
  starter: |
    use std::collections::HashMap;

    fn build() -> HashMap<String, i32> {

    }
  solution: |
    use std::collections::HashMap;

    fn build() -> HashMap<String, i32> {
        let mut m = HashMap::new();
        m.insert("a".to_string(), 1);
        m.insert("b".to_string(), 2);
        m
    }
  notes: |
    `insert(k, v)` adds or overwrites, returning the OLD value as `Option<V>`.
  source: "std HashMap::insert"
  tags: [rust, hashmap]

- instruction: |
    Write `lookup(m: &HashMap<String, i32>, key: &str) -> Option<i32>` returning
    a copy of the value if present.
  starter: |
    use std::collections::HashMap;

    fn lookup(m: &HashMap<String, i32>, key: &str) -> Option<i32> {

    }
  solution: |
    use std::collections::HashMap;

    fn lookup(m: &HashMap<String, i32>, key: &str) -> Option<i32> {
        m.get(key).copied()
    }
  notes: |
    `get` returns `Option<&V>`. You can pass a `&str` even though keys are
    `String`, because `String: Borrow<str>`.
  source: "std HashMap::get"
  tags: [rust, hashmap]

- instruction: |
    Write `has_key(m: &HashMap<String, i32>, key: &str) -> bool`.
  starter: |
    use std::collections::HashMap;

    fn has_key(m: &HashMap<String, i32>, key: &str) -> bool {

    }
  solution: |
    use std::collections::HashMap;

    fn has_key(m: &HashMap<String, i32>, key: &str) -> bool {
        m.contains_key(key)
    }
  source: "std HashMap::contains_key"
  tags: [rust, hashmap]

- instruction: |
    Write `char_counts(s: &str) -> HashMap<char, usize>` counting each character
    using the `entry` API.
  starter: |
    use std::collections::HashMap;

    fn char_counts(s: &str) -> HashMap<char, usize> {

    }
  solution: |
    use std::collections::HashMap;

    fn char_counts(s: &str) -> HashMap<char, usize> {
        let mut m = HashMap::new();
        for c in s.chars() {
            *m.entry(c).or_insert(0) += 1;
        }
        m
    }
  notes: |
    `entry(k).or_insert(0)` returns a `&mut V` to the existing or newly inserted
    value — one lookup for the classic counter idiom.
  source: "std HashMap::entry"
  tags: [rust, hashmap, entry]

- instruction: |
    Write `group_by_len(words: &[&str]) -> HashMap<usize, Vec<String>>` grouping
    words by their length.
  starter: |
    use std::collections::HashMap;

    fn group_by_len(words: &[&str]) -> HashMap<usize, Vec<String>> {

    }
  solution: |
    use std::collections::HashMap;

    fn group_by_len(words: &[&str]) -> HashMap<usize, Vec<String>> {
        let mut m: HashMap<usize, Vec<String>> = HashMap::new();
        for w in words {
            m.entry(w.len()).or_default().push(w.to_string());
        }
        m
    }
  notes: |
    `or_default()` inserts an empty `Vec` when the key is new, then we push into
    the returned `&mut Vec`. (clippy prefers `or_default()` over
    `or_insert_with(Vec::new)`.)
  source: "std Entry::or_default"
  tags: [rust, hashmap, entry]

- instruction: |
    Write `add_to(m: &mut HashMap<String, i32>, key: &str, delta: i32)` adding
    `delta` to an existing value (do nothing if absent). Use `get_mut`.
  starter: |
    use std::collections::HashMap;

    fn add_to(m: &mut HashMap<String, i32>, key: &str, delta: i32) {

    }
  solution: |
    use std::collections::HashMap;

    fn add_to(m: &mut HashMap<String, i32>, key: &str, delta: i32) {
        if let Some(v) = m.get_mut(key) {
            *v += delta;
        }
    }
  notes: |
    `get_mut` returns `Option<&mut V>` to edit a value in place.
  source: "std HashMap::get_mut"
  tags: [rust, hashmap]

- instruction: |
    Write `take(m: &mut HashMap<String, i32>, key: &str) -> Option<i32>` removing
    and returning a value.
  starter: |
    use std::collections::HashMap;

    fn take(m: &mut HashMap<String, i32>, key: &str) -> Option<i32> {

    }
  solution: |
    use std::collections::HashMap;

    fn take(m: &mut HashMap<String, i32>, key: &str) -> Option<i32> {
        m.remove(key)
    }
  notes: |
    `remove` returns the value as `Option<V>` (None if the key was absent).
  source: "std HashMap::remove"
  tags: [rust, hashmap]

- instruction: |
    Write `total(m: &HashMap<String, i32>) -> i32` summing all values.
  starter: |
    use std::collections::HashMap;

    fn total(m: &HashMap<String, i32>) -> i32 {

    }
  solution: |
    use std::collections::HashMap;

    fn total(m: &HashMap<String, i32>) -> i32 {
        m.values().sum()
    }
  notes: |
    `values()` iterates `&V`; `keys()` iterates `&K`; `iter()` iterates
    `(&K, &V)`.
  source: "std HashMap::values"
  tags: [rust, hashmap]

- instruction: |
    Write `keys_sorted(m: &HashMap<String, i32>) -> Vec<String>`: the keys,
    sorted (since HashMap order is undefined).
  starter: |
    use std::collections::HashMap;

    fn keys_sorted(m: &HashMap<String, i32>) -> Vec<String> {

    }
  solution: |
    use std::collections::HashMap;

    fn keys_sorted(m: &HashMap<String, i32>) -> Vec<String> {
        let mut ks: Vec<String> = m.keys().cloned().collect();
        ks.sort();
        ks
    }
  notes: |
    HashMap iteration order is unspecified; collect and `sort` for deterministic
    output (or use a `BTreeMap`).
  source: "std HashMap::keys"
  tags: [rust, hashmap]

- instruction: |
    Write `double_values(m: &mut HashMap<String, i32>)` doubling every value
    in place.
  starter: |
    use std::collections::HashMap;

    fn double_values(m: &mut HashMap<String, i32>) {

    }
  solution: |
    use std::collections::HashMap;

    fn double_values(m: &mut HashMap<String, i32>) {
        for v in m.values_mut() {
            *v *= 2;
        }
    }
  notes: |
    `values_mut()` yields `&mut V` for each value.
  source: "std HashMap::values_mut"
  tags: [rust, hashmap]

- instruction: |
    Write `index_by_len(words: &[&str]) -> HashMap<usize, String>` mapping each
    length to a word of that length (later wins). Build it with `collect`.
  starter: |
    use std::collections::HashMap;

    fn index_by_len(words: &[&str]) -> HashMap<usize, String> {

    }
  solution: |
    use std::collections::HashMap;

    fn index_by_len(words: &[&str]) -> HashMap<usize, String> {
        words.iter().map(|w| (w.len(), w.to_string())).collect()
    }
  notes: |
    An iterator of `(K, V)` tuples collects straight into a `HashMap`; duplicate
    keys keep the last value.
  source: "std FromIterator for HashMap"
  tags: [rust, hashmap]

- instruction: |
    Write `count_with_default(s: &str) -> HashMap<char, i32>` returning how many
    times each character appears in `s`, using the entry API's `or_default()`.
    Example: "aab" -> {'a': 2, 'b': 1}.
  starter: |
    use std::collections::HashMap;

    fn count_with_default(s: &str) -> HashMap<char, i32> {

    }
  solution: |
    use std::collections::HashMap;

    fn count_with_default(s: &str) -> HashMap<char, i32> {
        let mut m: HashMap<char, i32> = HashMap::new();
        for c in s.chars() {
            *m.entry(c).or_default() += 1;
        }
        m
    }
  notes: |
    `or_default()` inserts `V::default()` when absent — 0 for integers. Needs
    `V: Default`.
  source: "std Entry::or_default"
  tags: [rust, hashmap, entry]

- instruction: |
    Write `bump(m: &mut HashMap<String, i32>, key: &str)`: increment the value,
    or insert 1 if absent, using `and_modify` + `or_insert`.
  starter: |
    use std::collections::HashMap;

    fn bump(m: &mut HashMap<String, i32>, key: &str) {

    }
  solution: |
    use std::collections::HashMap;

    fn bump(m: &mut HashMap<String, i32>, key: &str) {
        m.entry(key.to_string()).and_modify(|v| *v += 1).or_insert(1);
    }
  notes: |
    `and_modify(f)` runs `f` on an existing value; `or_insert(d)` supplies the
    value when the key is new. Together: "update or initialize".
  source: "std Entry::and_modify"
  tags: [rust, hashmap, entry]

- instruction: |
    Write `score(m: &HashMap<String, i32>, key: &str) -> i32` returning the
    value or 0 if missing.
  starter: |
    use std::collections::HashMap;

    fn score(m: &HashMap<String, i32>, key: &str) -> i32 {

    }
  solution: |
    use std::collections::HashMap;

    fn score(m: &HashMap<String, i32>, key: &str) -> i32 {
        m.get(key).copied().unwrap_or(0)
    }
  source: "std HashMap::get"
  tags: [rust, hashmap]

- instruction: |
    Write `distinct_count(m: &HashMap<String, i32>) -> usize` returning how many
