  tags: [rust, hashset]

- instruction: |
    Write `most_common(s: &str) -> Option<char>`: the most frequent character
    (None if empty). Count with a HashMap, then pick the max.
  starter: |
    use std::collections::HashMap;

    fn most_common(s: &str) -> Option<char> {

    }
  solution: |
    use std::collections::HashMap;

    fn most_common(s: &str) -> Option<char> {
        let mut m: HashMap<char, usize> = HashMap::new();
        for c in s.chars() {
            *m.entry(c).or_insert(0) += 1;
        }
        m.into_iter().max_by_key(|&(_, count)| count).map(|(c, _)| c)
    }
  notes: |
    `into_iter()` consumes the map into `(char, usize)` pairs; `max_by_key` finds
    the largest count; `map` keeps just the char.
  source: "std Iterator::max_by_key"
  tags: [rust, hashmap, iterators]

# --- concept cards ---
- type: concept
  question: |
    What problem does the `entry` API solve, and what are its main methods?
  answer: |
    It avoids looking a key up twice for "insert if missing / update if present".
    `map.entry(k)` returns a handle; then `.or_insert(d)`, `.or_insert_with(f)`,
    `.or_default()`, or `.and_modify(f)` operate with a single lookup. Idiomatic
    for counters and grouping.
  source: "book §8.3 / std HashMap::entry"
  tags: [rust, hashmap, concept]

- type: concept
  question: |
    Why can you call `map.get("x")` when the keys are `String`?
  answer: |
    `get` is generic over a borrowed key form: `get<Q>(&self, k: &Q) where
    K: Borrow<Q>, Q: Hash + Eq`. Since `String: Borrow<str>`, a `&str` works — no
    allocating a `String` just to look something up.
  source: "std HashMap::get"
  tags: [rust, hashmap, concept]

- type: concept
  question: |
    Is HashMap (and HashSet) iteration order stable or predictable?
  answer: |
    No — unspecified and randomized per run (HashDoS resistance), so never rely
    on it. For ordered output, collect into a Vec and sort, or use a
    `BTreeMap`/`BTreeSet` (sorted, O(log n)).
  source: "std HashMap"
  tags: [rust, hashmap, concept]

- type: concept
  question: |
    Difference between `entry(k).or_insert(v)` and `or_insert_with(f)` /
    `or_default()`?
  answer: |
    `or_insert(v)` takes an already-built value, evaluated even if unused (eager).
    `or_insert_with(f)` calls `f` only when the key is absent (lazy) — use it when
    the default allocates or is costly. `or_default()` is shorthand for
    `or_insert_with(Default::default)`, which clippy prefers for an empty `Vec`,
    `0`, and similar defaults.
  source: "std Entry (or_insert / or_insert_with / or_default)"
  tags: [rust, hashmap, concept]

- instruction: |
    Each line of `results` is "team1,team2,goals1,goals2". Write
    `build_scores_table(results: &str) -> HashMap<&str, TeamScores>` accumulating, for
    every team across all lines, its total goals_scored and goals_conceded. The
    `TeamScores` struct (derives `Default`) is given.
  starter: |
    use std::collections::HashMap;

    #[derive(Default, Debug, PartialEq)]
    struct TeamScores {
        goals_scored: u8,
        goals_conceded: u8,
    }

    fn build_scores_table(results: &str) -> HashMap<&str, TeamScores> {
        let mut scores: HashMap<&str, TeamScores> = HashMap::new();
        for line in results.lines() {
            let mut parts = line.split(',');
            let team_1 = parts.next().unwrap();
            let team_2 = parts.next().unwrap();
            let score_1: u8 = parts.next().unwrap().parse().unwrap();
            let score_2: u8 = parts.next().unwrap().parse().unwrap();

            // TODO: add score_1 / score_2 onto team_1 and team_2 using
            // scores.entry(team).or_default() -> &mut TeamScores, then += fields

        }
        scores
    }
  solution: |
    use std::collections::HashMap;

    #[derive(Default, Debug, PartialEq)]
    struct TeamScores {
        goals_scored: u8,
        goals_conceded: u8,
    }

    fn build_scores_table(results: &str) -> HashMap<&str, TeamScores> {
        let mut scores: HashMap<&str, TeamScores> = HashMap::new();
        for line in results.lines() {
            let mut parts = line.split(',');
            let team_1 = parts.next().unwrap();
            let team_2 = parts.next().unwrap();
            let score_1: u8 = parts.next().unwrap().parse().unwrap();
            let score_2: u8 = parts.next().unwrap().parse().unwrap();

            let e1 = scores.entry(team_1).or_default();
            e1.goals_scored += score_1;
            e1.goals_conceded += score_2;

            let e2 = scores.entry(team_2).or_default();
            e2.goals_scored += score_2;
            e2.goals_conceded += score_1;
        }
        scores
    }
  notes: |
    `entry(team).or_default()` inserts a zeroed `TeamScores` the first time a team is
    seen (needs `TeamScores: Default`), then returns `&mut TeamScores` so you can add
    onto its fields. This "look up, inserting a default, then mutate" is the core
    accumulation idiom.
  source: "Rustlings hashmaps3 · std Entry::or_default"
  tags: [rust, hashmap, rustlings]
  tests: |
    let t = build_scores_table("England,France,4,2\nFrance,Italy,3,1");
    let eng = t.get("England").unwrap();
    assert_eq!((eng.goals_scored, eng.goals_conceded), (4, 2));
    let fr = t.get("France").unwrap();
    assert_eq!((fr.goals_scored, fr.goals_conceded), (5, 5));

- type: concept
  question: |
    On a `HashMap<String, V>`, when can you pass a `&str` directly and when do you
    still need `.to_string()`?
  answer: |
    READS take a BORROWED key, so pass `&str` with no allocation: `get`, `get_mut`,
    `contains_key`, and `remove` are generic over `&Q where String: Borrow<Q>`, and
    `String: Borrow<str>` — so `map.get("foo")` or `map.contains_key(name)` just
    work (no `.to_string()`).
    WRITES that store a NEW key take it BY VALUE (`K = String`), so you must own it:
    `insert(k, v)` and `entry(k)` need a `String` — hence `key.to_string()` (or
    `key.to_owned()` / `String::from(key)`).
    Rule of thumb: looking something UP -> `&str` is fine; putting a new key IN ->
    you allocate the owned `String`. clippy's `unnecessary_to_owned` flags a
    needless `.to_string()` on the lookup side, but can't remove the required one on
    `insert` / `entry`.
  source: "std collections::HashMap; std::borrow::Borrow"
  tags: [rust, hashmap, borrow, concept]
