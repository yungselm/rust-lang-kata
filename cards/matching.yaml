- instruction: |
    Write `http_text(code: u32) -> &'static str` mapping a status code to text:
    200 -> "OK", 404 -> "Not Found", 500 -> "Server Error", anything else ->
    "Unknown". Example: http_text(404) -> "Not Found".
  starter: |
    fn http_text(code: u32) -> &'static str {

    }
  solution: |
    fn http_text(code: u32) -> &'static str {
        match code {
            200 => "OK",
            404 => "Not Found",
            500 => "Server Error",
            _ => "Unknown",
        }
    }
  notes: |
    `match` is an expression: every arm yields the same type and the whole thing
    is the function's value — no need to bind it to a variable first (clippy's
    `let_and_return`).
  source: "book §6.2 (match is an expression)"
  tags: [rust, matching]
  tests: |
    assert_eq!(http_text(200), "OK");
    assert_eq!(http_text(404), "Not Found");
    assert_eq!(http_text(500), "Server Error");
    assert_eq!(http_text(418), "Unknown");

- instruction: |
    Write `flatten_opt(x: Option<Option<i32>>) -> i32`: the inner value or 0,
