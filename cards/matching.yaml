# Pattern matching — match, if let/while let/let else, guards, bindings,
# destructuring. Solutions are clippy-clean.
- instruction: |
    Given `enum Shape { Circle(f64), Rect(f64, f64) }`, write `area(s: Shape) -> f64`
    using `match` to compute each shape's area.
  starter: |
    enum Shape {
        Circle(f64),
        Rect(f64, f64),
    }

    fn area(s: Shape) -> f64 {

    }
  solution: |
    enum Shape {
        Circle(f64),
        Rect(f64, f64),
    }

    fn area(s: Shape) -> f64 {
        match s {
            Shape::Circle(r) => std::f64::consts::PI * r * r,
            Shape::Rect(w, h) => w * h,
        }
    }
  notes: |
    Each arm destructures the variant's payload. `match` is exhaustive — every
    variant must be covered.
  source: "book §6.2 (match)"
  tags: [rust, matching, enums]
  tests: |
    assert!((area(Shape::Circle(1.0)) - std::f64::consts::PI).abs() < 1e-9);
    assert!((area(Shape::Rect(2.0, 3.0)) - 6.0).abs() < 1e-9);
    assert!((area(Shape::Rect(0.0, 5.0)) - 0.0).abs() < 1e-9);

- instruction: |
    Write `describe(x: Option<i32>) -> String`: "got N" for `Some(n)`,
    "nothing" for `None`.
  starter: |
    fn describe(x: Option<i32>) -> String {

    }
  solution: |
    fn describe(x: Option<i32>) -> String {
        match x {
            Some(n) => format!("got {n}"),
            None => "nothing".to_string(),
        }
    }
  notes: |
    `Option` is an enum (`Some`/`None`). Inline `{n}` capture works on Rust 2021.
  source: "book §6.2 (Option in match)"
  tags: [rust, matching, option]
  tests: |
    assert_eq!(describe(Some(5)), "got 5");
    assert_eq!(describe(Some(-3)), "got -3");
    assert_eq!(describe(None), "nothing");

- instruction: |
    Write `status(r: Result<i32, String>) -> String`: "ok: N" or "err: E".
  starter: |
    fn status(r: Result<i32, String>) -> String {

    }
  solution: |
    fn status(r: Result<i32, String>) -> String {
        match r {
            Ok(n) => format!("ok: {n}"),
            Err(e) => format!("err: {e}"),
        }
