- instruction: |
    Given `enum Temp { C(f64), F(f64) }`, write `is_freezing(t: Temp) -> bool`
    (<= 0C or <= 32F).
  starter: |
    enum Temp {
        C(f64),
        F(f64),
    }

    fn is_freezing(t: Temp) -> bool {

    }
  solution: |
    enum Temp {
        C(f64),
        F(f64),
    }

    fn is_freezing(t: Temp) -> bool {
        match t {
            Temp::C(c) => c <= 0.0,
            Temp::F(f) => f <= 32.0,
        }
    }
  source: "book §6.2 (match on enum)"
  tags: [rust, matching, enums]
  tests: |
    assert!(is_freezing(Temp::C(0.0)));
    assert!(!is_freezing(Temp::C(0.1)));
    assert!(is_freezing(Temp::F(32.0)));
    assert!(!is_freezing(Temp::F(33.0)));

- instruction: |
    Write `max_pair(p: &(i32, i32)) -> i32` returning the larger element, matching
    on the reference and dereferencing the binding.
  starter: |
    fn max_pair(p: &(i32, i32)) -> i32 {

    }
  solution: |
    fn max_pair(p: &(i32, i32)) -> i32 {
        match p {
            (a, b) if a >= b => *a,
            (_, b) => *b,
        }
    }
  notes: |
    Matching `&(i32, i32)` binds `a`, `b` as `&i32` (ergonomics); the guard
    compares them and `*a` copies out the `i32`.
  source: "book §19.3 (binding modes)"
  tags: [rust, matching, ergonomics]
  tests: |
    assert_eq!(max_pair(&(1, 2)), 2);
    assert_eq!(max_pair(&(5, 3)), 5);
    assert_eq!(max_pair(&(4, 4)), 4);
    assert_eq!(max_pair(&(-1, -9)), -1);

- type: concept
  question: |
    In a pattern, what's the difference between `_` and `..`, and can a pattern
    use both?
  answer: |
    `_` ignores exactly ONE field or element — you need one per skipped
    position. `..` ignores ANY NUMBER of remaining fields/elements in a single
    marker, and may appear at most once per pattern. Yes, they combine freely:
    `(a, _, c)` skips exactly the 3-tuple's middle; `[first, ..]` skips
    everything after `first` regardless of length; `Point { x, .. }` skips
    every other field no matter how many exist.
  code: |
    let t = (1, 2, 3);
    let (a, _, c) = t; // `_` skips exactly one element
    assert_eq!((a, c), (1, 3));
    let v: &[i32] = &[1, 2, 3, 4, 5];
    if let [first, ..] = v {
        assert_eq!(*first, 1); // `..` skips any number of trailing elements
    }
  source: "book §19.3 (ignoring parts of a value)"
  tags: [rust, matching, concept]

- instruction: |
    Write `classify_die(n: u32) -> String` for a 6-sided die: n @ (1 | 2) ->
    "low: N", n @ (5 | 6) -> "high: N", else "mid: N". Combine an or-pattern
    WITH an `@` binding in one arm (unlike `is_vowel`'s plain or-pattern).
  starter: |
    fn classify_die(n: u32) -> String {

    }
  solution: |
    fn classify_die(n: u32) -> String {
        match n {
            n @ (1 | 2) => format!("low: {n}"),
            n @ (5 | 6) => format!("high: {n}"),
            n => format!("mid: {n}"),
        }
    }
  notes: |
    `n @ (1 | 2)` matches EITHER literal and binds whichever matched to `n` in
    one arm — an or-pattern and an `@` binding together, one level up from
    `is_vowel`'s plain (non-binding) or-pattern.
  source: "book §19.3 (@ bindings + or-patterns)"
  tags: [rust, matching, or-patterns, bindings]
  tests: |
    assert_eq!(classify_die(1), "low: 1");
    assert_eq!(classify_die(2), "low: 2");
    assert_eq!(classify_die(5), "high: 5");
    assert_eq!(classify_die(6), "high: 6");
    assert_eq!(classify_die(3), "mid: 3");
    assert_eq!(classify_die(4), "mid: 4");

- instruction: |
    Given `struct Wrapper { id: u32, payload: Option<Event> }` (reusing the
    `Event` enum: `Click { x, y }` / `Key(char)`), write
    `click_coords(w: Wrapper) -> Option<(i32, i32)>` returning the click
    coordinates only when the payload is a `Click` — in ONE nested pattern,
    no nested `match`.
  starter: |
    enum Event {
        Click { x: i32, y: i32 },
        Key(char),
    }

    struct Wrapper {
        id: u32,
        payload: Option<Event>,
    }

    fn click_coords(w: Wrapper) -> Option<(i32, i32)> {

    }
  solution: |
    enum Event {
        Click { x: i32, y: i32 },
        Key(char),
    }

    struct Wrapper {
        id: u32,
        payload: Option<Event>,
    }

    fn click_coords(w: Wrapper) -> Option<(i32, i32)> {
        match w {
            Wrapper { payload: Some(Event::Click { x, y }), .. } => Some((x, y)),
            _ => None,
        }
    }
  notes: |
    Patterns nest through several layers at once: struct field -> `Option` ->
    enum variant -> its named fields, all in a single arm. The trailing `..`
    drops the unused `id` field. This is how you avoid a `match` nested inside
    another `match`.
  source: "book §19.3 (nested patterns)"
  tags: [rust, matching, nested, structs, enums]
  tests: |
    let w = Wrapper { id: 1, payload: Some(Event::Click { x: 3, y: 4 }) };
    assert_eq!(click_coords(w), Some((3, 4)));
    let w2 = Wrapper { id: 2, payload: Some(Event::Key('a')) };
    assert_eq!(click_coords(w2), None);
    let w3 = Wrapper { id: 3, payload: None };
    assert_eq!(click_coords(w3), None);

# --- concept cards ---
- type: concept
  question: |
    When should you prefer `if let` over a full `match`?
  answer: |
    When you only care about ONE pattern and want to ignore the rest.
    `if let Some(x) = opt { ... } else { ... }` is shorthand for a `match` with
    one real arm plus `_`. For two-plus meaningful cases, use `match`.
  source: "book §6.3"
  tags: [rust, matching, concept]

- type: concept
  question: |
    Why does Rust force `match` to be exhaustive?
  answer: |
    So every possible value is handled. Add an enum variant and every
    non-exhaustive match fails to compile, pointing you at code to update. Use
    `_` (or a catch-all binding like `other`) for an intentional fallback.
  source: "book §6.2"
  tags: [rust, matching, concept]

- type: concept
  question: |
    Difference between a refutable and an irrefutable pattern, and where is each
    allowed?
  answer: |
    Irrefutable patterns always match (e.g. `let (a, b) = pair;`) and are
    required by `let` and function params. Refutable patterns can fail (e.g.
    `Some(x)`) and are used in `match`, `if let`, `while let`. A refutable
    pattern in a plain `let` is an error — use `let else`.
  source: "book §19.2 (refutability)"
  tags: [rust, matching, concept]

- type: concept
  question: |
    What are "default binding modes" (match ergonomics)?
  answer: |
    When you match a reference against a non-reference pattern, the bindings
    automatically become references — so `match &opt { Some(x) => ... }` gives
    `x: &T` without writing `ref`. It removes manual `ref`/`&` noise when matching
    through borrows.
  source: "book §19.3 (default binding modes)"
  tags: [rust, matching, concept]

- instruction: |
    A `Message` enum (a struct variant `Resize { width, height }`, a tuple variant
    `Move(Point)`, `Echo(String)`, `ChangeColor(u8, u8, u8)`, and unit `Quit`) plus a
    `State` are given. Write `State::process(&mut self, message: Message)` that, via a
    single `match`, updates the matching field(s): Resize sets width/height, Move sets
    position, Echo sets message, ChangeColor sets color, Quit sets quit = true.
  starter: |
    #[derive(Default)]
    struct Point {
        x: u64,
        y: u64,
    }

    enum Message {
        Resize { width: u64, height: u64 },
        Move(Point),
        Echo(String),
        ChangeColor(u8, u8, u8),
        Quit,
