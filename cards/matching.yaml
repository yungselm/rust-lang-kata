  source: "book §9.2 (Result)"
  tags: [rust, matching, results]
  tests: |
    assert_eq!(status(Ok(42)), "ok: 42");
    assert_eq!(status(Ok(-1)), "ok: -1");
    assert_eq!(status(Err("boom".to_string())), "err: boom");

- instruction: |
    Write `double_or_zero(x: Option<i32>) -> i32` using `if let`/`else`:
    double the inner value, or 0 if none.
  starter: |
    fn double_or_zero(x: Option<i32>) -> i32 {

    }
  solution: |
    fn double_or_zero(x: Option<i32>) -> i32 {
        if let Some(n) = x {
            n * 2
        } else {
            0
        }
    }
  notes: |
    `if let` handles one pattern and ignores the rest — shorthand for a `match`
    with a single arm plus `_`.
  source: "book §6.3 (if let)"
  tags: [rust, matching, if-let]
  tests: |
    assert_eq!(double_or_zero(Some(4)), 8);
    assert_eq!(double_or_zero(Some(-3)), -6);
    assert_eq!(double_or_zero(None), 0);

- instruction: |
    Write `drain_sum(v: &mut Vec<i32>) -> i32` using `while let` to pop every
    element and sum them (the Vec ends up empty).
  starter: |
    fn drain_sum(v: &mut Vec<i32>) -> i32 {

    }
  solution: |
    fn drain_sum(v: &mut Vec<i32>) -> i32 {
        let mut total = 0;
        while let Some(x) = v.pop() {
            total += x;
        }
        total
    }
  notes: |
    `while let` loops while the pattern matches; `pop()` yields `Some` until the
    Vec is empty, then `None` ends it. (`&mut Vec` is right here — `pop` mutates
    the length.)
  source: "book §19.1 (while let)"
  tags: [rust, matching, while-let]
  tests: |
    let mut v = vec![1, 2, 3];
    assert_eq!(drain_sum(&mut v), 6);
    assert!(v.is_empty());
    let mut empty: Vec<i32> = Vec::new();
    assert_eq!(drain_sum(&mut empty), 0);

- instruction: |
    Write `parse_or_zero(s: &str) -> i32` using `let ... else` to return 0 early
    on a parse failure, otherwise return the parsed number.
  starter: |
    fn parse_or_zero(s: &str) -> i32 {

    }
  solution: |
    fn parse_or_zero(s: &str) -> i32 {
        let Ok(n) = s.parse::<i32>() else {
            return 0;
        };
        n
    }
  notes: |
    `let else` (Rust 1.65+) binds on the happy path and forces the `else` block
    to diverge (return/break/panic), keeping `n` in scope afterward.
  source: "book §6.3 (let else)"
  tags: [rust, matching, let-else]
  tests: |
    assert_eq!(parse_or_zero("42"), 42);
    assert_eq!(parse_or_zero("-7"), -7);
    assert_eq!(parse_or_zero("abc"), 0);
    assert_eq!(parse_or_zero(""), 0);

- instruction: |
    Write `sign(n: i32) -> &'static str` using a match GUARD for the positive
    case: "positive", "zero", or "negative".
  starter: |
    fn sign(n: i32) -> &'static str {

    }
  solution: |
    fn sign(n: i32) -> &'static str {
        match n {
            x if x > 0 => "positive",
            0 => "zero",
            _ => "negative",
        }
    }
  notes: |
    A guard (`if cond`) adds a runtime condition to an arm. Guards don't count
    toward exhaustiveness, so you still need a catch-all.
  source: "book §19.3 (match guards)"
  tags: [rust, matching, guards]
  tests: |
    assert_eq!(sign(5), "positive");
    assert_eq!(sign(0), "zero");
    assert_eq!(sign(-2), "negative");

- instruction: |
    Write `classify(n: i32) -> String` using an `@` binding: for 0..=9 return
    "single digit: N", otherwise "big: N".
  starter: |
    fn classify(n: i32) -> String {

    }
  solution: |
    fn classify(n: i32) -> String {
        match n {
            small @ 0..=9 => format!("single digit: {small}"),
            other => format!("big: {other}"),
        }
    }
  notes: |
    `name @ pattern` tests the pattern AND binds the matched value to `name`.
  source: "book §19.3 (@ bindings)"
  tags: [rust, matching, bindings]
  tests: |
    assert_eq!(classify(0), "single digit: 0");
    assert_eq!(classify(9), "single digit: 9");
    assert_eq!(classify(10), "big: 10");
    assert_eq!(classify(-1), "big: -1");

- instruction: |
    Write `is_vowel(c: char) -> bool` testing membership of a small set, using an
    or-pattern.
  starter: |
    fn is_vowel(c: char) -> bool {

    }
  solution: |
    fn is_vowel(c: char) -> bool {
        matches!(c, 'a' | 'e' | 'i' | 'o' | 'u')
    }
  notes: |
    `matches!(value, pattern)` is the idiomatic way to turn a pattern into a
    bool — clippy rewrites a `match ... => true / _ => false` into this. The `|`
    is an or-pattern.
  source: "std matches! macro"
  tags: [rust, matching, or-patterns]
  tests: |
    assert!(is_vowel('a'));
    assert!(is_vowel('u'));
    assert!(!is_vowel('z'));
    assert!(!is_vowel('A'));

- instruction: |
    Write `grade(score: u32) -> char` using inclusive RANGE patterns:
    90..=100 -> 'A', 80..=89 -> 'B', 70..=79 -> 'C', else 'F'.
  starter: |
    fn grade(score: u32) -> char {

    }
  solution: |
    fn grade(score: u32) -> char {
        match score {
            90..=100 => 'A',
            80..=89 => 'B',
            70..=79 => 'C',
            _ => 'F',
        }
    }
  notes: |
    `a..=b` is an inclusive range pattern (only `..=`, not `..`, is allowed in
    patterns for integers/chars).
  source: "book §19.3 (range patterns)"
  tags: [rust, matching, ranges]
  tests: |
    assert_eq!(grade(90), 'A');
    assert_eq!(grade(89), 'B');
    assert_eq!(grade(70), 'C');
    assert_eq!(grade(69), 'F');

- instruction: |
    Write `quadrant(p: (i32, i32)) -> u8`: 1 if both coords > 0, 2 if x<0 & y>0,
    0 for the origin, else 9. Use tuple patterns + guards.
  starter: |
    fn quadrant(p: (i32, i32)) -> u8 {

    }
  solution: |
    fn quadrant(p: (i32, i32)) -> u8 {
        match p {
            (0, 0) => 0,
            (x, y) if x > 0 && y > 0 => 1,
            (x, y) if x < 0 && y > 0 => 2,
            _ => 9,
        }
    }
  source: "book §19.3 (tuple patterns)"
  tags: [rust, matching, tuples, guards]
  tests: |
    assert_eq!(quadrant((0, 0)), 0);
    assert_eq!(quadrant((3, 4)), 1);
    assert_eq!(quadrant((-3, 4)), 2);
    assert_eq!(quadrant((3, -4)), 9);

- instruction: |
    Given `struct Point { x: i32, y: i32 }`, write `on_axis(p: Point) -> bool`:
    true if the point lies on either axis. Destructure with `..` for the rest.
  starter: |
    struct Point {
        x: i32,
        y: i32,
    }

    fn on_axis(p: Point) -> bool {

    }
  solution: |
    struct Point {
        x: i32,
        y: i32,
    }

    fn on_axis(p: Point) -> bool {
        matches!(p, Point { x: 0, .. } | Point { y: 0, .. })
    }
  notes: |
    `matches!` with struct patterns: `..` ignores the remaining fields, and the
    or-pattern `|` covers either axis. (clippy prefers this over match->bool.)
  source: "book §19.3 (struct patterns)"
  tags: [rust, matching, structs]
  tests: |
    assert!(on_axis(Point { x: 0, y: 5 }));
    assert!(on_axis(Point { x: 3, y: 0 }));
    assert!(on_axis(Point { x: 0, y: 0 }));
    assert!(!on_axis(Point { x: 2, y: 3 }));

- instruction: |
    Given `enum Event { Click { x: i32, y: i32 }, Key(char) }`, write
    `describe(e: Event) -> String`: a `Click` becomes "click at X,Y" and a
    `Key(c)` becomes "key C".
    Example: Event::Key('a') -> "key a"; Event::Click { x: 1, y: 2 } -> "click at 1,2".
  starter: |
    enum Event {
        Click { x: i32, y: i32 },
        Key(char),
    }

    fn describe(e: Event) -> String {

    }
  solution: |
    enum Event {
        Click { x: i32, y: i32 },
        Key(char),
    }

    fn describe(e: Event) -> String {
        match e {
            Event::Click { x, y } => format!("click at {x},{y}"),
            Event::Key(c) => format!("key {c}"),
        }
    }
  notes: |
    Struct variants destructure with `{ field, .. }`; tuple variants with `(..)`.
  source: "book §19.3 (enum variants)"
  tags: [rust, matching, enums]
  tests: |
    assert_eq!(describe(Event::Click { x: 1, y: 2 }), "click at 1,2");
    assert_eq!(describe(Event::Key('a')), "key a");
    assert_eq!(describe(Event::Click { x: -5, y: 0 }), "click at -5,0");

- instruction: |
    Write `describe_slice(v: &[i32]) -> String` using SLICE patterns: "empty",
    "one: X", or "first F, last L".
  starter: |
    fn describe_slice(v: &[i32]) -> String {

    }
  solution: |
    fn describe_slice(v: &[i32]) -> String {
        match v {
            [] => "empty".to_string(),
            [x] => format!("one: {x}"),
            [first, .., last] => format!("first {first}, last {last}"),
        }
    }
  notes: |
    Slice patterns match by length; `..` is a "rest" matching any number of
    middle elements. These arms cover lengths 0, 1, and >= 2 — exhaustive.
  source: "book §19.3 (slice patterns)"
  tags: [rust, matching, slices]
  tests: |
    assert_eq!(describe_slice(&[]), "empty");
    assert_eq!(describe_slice(&[7]), "one: 7");
    assert_eq!(describe_slice(&[1, 2]), "first 1, last 2");
    assert_eq!(describe_slice(&[3, 9, 9, 5]), "first 3, last 5");

- instruction: |
    Write `first_char(s: &Option<String>) -> Option<char>`: the first char of
    the inner string if present. Rely on match ergonomics (no `ref`).
  starter: |
    fn first_char(s: &Option<String>) -> Option<char> {

    }
  solution: |
    fn first_char(s: &Option<String>) -> Option<char> {
        match s {
            Some(text) => text.chars().next(),
            None => None,
        }
    }
  notes: |
    Matching `&Option<String>` against `Some(text)` binds `text: &String`
    automatically (default binding modes), so you don't move out of the borrow.
  source: "book §19.3 (binding modes)"
  tags: [rust, matching, ergonomics]
  tests: |
    assert_eq!(first_char(&Some("hello".to_string())), Some('h'));
    assert_eq!(first_char(&Some(String::new())), None);
    assert_eq!(first_char(&None), None);

