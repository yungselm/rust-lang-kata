# Data structures & complexity — recall cards (no formal DS&A background assumed).
- type: concept
  question: |
    What does Big-O notation describe?
  answer: |
    An asymptotic upper bound on how an algorithm's cost (time or space) grows
    as the input size n grows — ignoring constant factors and lower-order terms.
    It captures scaling/worst-case shape, not exact runtime in seconds.
  source: "CS fundamentals (asymptotic analysis)"
  tags: [bigo, concept]

- type: concept
  question: |
    Order these from slowest-growing to fastest-growing:
    O(n), O(1), O(n^2), O(log n), O(n log n).
  answer: |
    O(1) < O(log n) < O(n) < O(n log n) < O(n^2).
    (Constant, logarithmic, linear, linearithmic, quadratic.)
  source: "CS fundamentals (asymptotic analysis)"
  tags: [bigo, concept]

- type: concept
  question: |
    `Vec<T>`: complexity of indexing `v[i]`, `push`, and `pop` (from the end)?
  answer: |
    `v[i]`: O(1) (contiguous memory).
    `push`: amortized O(1).
    `pop` (end): O(1).
  source: "std Vec (complexity docs)"
  tags: [vec, bigo, concept]

- type: concept
  question: |
    `Vec<T>`: complexity of `insert(i, x)` or `remove(i)` at an arbitrary index?
  answer: |
    O(n): every element after index i must shift over by one. Only inserting or
    removing at the END is O(1) (amortized).
  source: "std Vec::insert / Vec::remove"
  tags: [vec, bigo, concept]

- type: concept
  question: |
    `Vec<T>`: complexity of checking whether it contains a value (unsorted)?
  answer: |
    O(n) — a linear scan. If you need fast membership tests, use a `HashSet`
    (O(1) avg) or sort and `binary_search` (O(log n)).
  source: "std slice::contains"
  tags: [vec, bigo, concept]

- type: concept
  question: |
    Why is `Vec::push` "amortized O(1)" rather than O(1)?
  answer: |
    When capacity is full, the Vec allocates a larger buffer (typically 2x) and
    moves all elements — that single push is O(n). But because capacity doubles,
    those expensive pushes are rare; averaged over many pushes the cost per push
    is constant. That averaging is "amortized".
  source: "std Vec (growth strategy)"
  tags: [vec, bigo, concept]

- type: concept
  question: |
    `HashMap<K, V>`: average and worst-case complexity of get / insert / remove,
    and what must `K` implement?
  answer: |
    Average O(1); worst case O(n) (pathological hash collisions). Keys must
    implement `Hash + Eq`.
  source: "std HashMap (complexity docs)"
  tags: [hashmap, bigo, concept]

- type: concept
  question: |
    `BTreeMap<K, V>`: complexity of get / insert / remove, and what does it give
    you that `HashMap` doesn't?
  answer: |
    O(log n) for get / insert / remove. Keys are kept sorted, enabling ordered
    iteration and range queries (`map.range(a..b)`). Keys must implement `Ord`.
  source: "std BTreeMap (complexity docs)"
  tags: [btreemap, bigo, concept]

- type: concept
  question: |
    `HashSet` vs `BTreeSet`: membership-test complexity and ordering?
  answer: |
    `HashSet`: O(1) average membership, no ordering.
    `BTreeSet`: O(log n) membership, elements kept sorted (supports ranges).
  source: "std HashSet / BTreeSet"
  tags: [set, bigo, concept]

- type: concept
  question: |
    What is `VecDeque`, and which operations does it make O(1) that `Vec` does
    not?
  answer: |
    A double-ended queue backed by a ring buffer. `push_front`/`pop_front` AND
    `push_back`/`pop_back` are all O(1). On a `Vec`, front operations are O(n).
    Indexing is still O(1).
  source: "std VecDeque"
  tags: [vecdeque, bigo, concept]

- type: concept
  question: |
    What is the default growable sequence in Rust, and when would you prefer
    `VecDeque` or `LinkedList`?
  answer: |
    Default to `Vec` — contiguous, cache-friendly, O(1) index and back-ops.
    Prefer `VecDeque` when you need fast insertion/removal at BOTH ends (queues).
    `LinkedList` is almost never worth it in practice (poor cache locality).
  source: "std collections (choosing a collection)"
  tags: [vec, vecdeque, concept]

- type: concept
  question: |
    Difference between `[T; N]` (array) and `Vec<T>`?
  answer: |
    `[T; N]`: fixed length known at compile time, stored inline (often on the
    stack), no allocation. `Vec<T>`: growable, heap-allocated, stores a pointer,
    length, and capacity. Use an array when the size is fixed and known.
  source: "Rust Book §3.2 (arrays) / std Vec"
  tags: [array, vec, concept]

- type: concept
  question: |
    `slice::binary_search`: complexity, precondition, and return value?
  answer: |
    O(log n). The slice MUST be sorted. Returns `Result<usize, usize>`:
    `Ok(index)` if found, or `Err(insertion_index)` where the value would be
    inserted to keep order.
  code: |
    let v = [1, 3, 5, 7];
    assert_eq!(v.binary_search(&5), Ok(2));
    assert_eq!(v.binary_search(&4), Err(2)); // would insert at index 2
  source: "std slice::binary_search"
  tags: [search, bigo, concept]

- type: concept
  question: |
    Linear search vs binary search — complexity and the tradeoff?
  answer: |
    Linear: O(n), works on ANY (unsorted) data. Binary: O(log n) but requires
    SORTED data. Sorting first costs O(n log n), so binary search pays off when
    you search the same data many times.
  source: "CS fundamentals (search algorithms)"
  tags: [search, bigo, concept]

- type: concept
  question: |
    Complexity of `slice::sort` vs `slice::sort_unstable`, and when to use each?
  answer: |
    Both O(n log n). `sort` is stable (preserves the relative order of equal
    elements) and allocates scratch space. `sort_unstable` is usually faster and
    in-place but may reorder equal elements. Prefer `sort_unstable` unless you
    need stability.
  source: "std slice::sort / sort_unstable"
  tags: [sort, bigo, concept]

- type: concept
  question: |
    `Vec`: difference between `len()` and `capacity()`, and why use
    `Vec::with_capacity(n)`?
  answer: |
    `len()` = number of elements currently stored; `capacity()` = slots
    allocated (>= len). `with_capacity(n)` pre-allocates so a known number of
    pushes won't trigger repeated O(n) reallocations.
  source: "std Vec::with_capacity"
  tags: [vec, concept]

- type: concept
  question: |
    Difference between time complexity and space complexity?
  answer: |
    Time: how runtime scales with input size n. Space: how much EXTRA memory
    (beyond the input) scales with n. Example: deduping with a `HashSet` is O(n)
    time but also O(n) extra space.
  source: "CS fundamentals (complexity analysis)"
  tags: [bigo, concept]

- type: concept
  question: |
    How do you use a `Vec` as a stack (LIFO), and what are the operations' costs?
  answer: |
    `push(x)` to add and `pop()` to remove — both operate on the END, which is
    the "top". `push` is amortized O(1), `pop` is O(1).
  source: "std Vec (as a stack)"
  tags: [stack, vec, concept]

- type: concept
  question: |
    How do you implement an efficient FIFO queue in Rust?
  answer: |
    Use `VecDeque`: `push_back` to enqueue, `pop_front` to dequeue — both O(1).
    Using a `Vec` with `remove(0)` to dequeue would be O(n) each time.
  source: "std VecDeque (as a queue)"
  tags: [queue, vecdeque, concept]

- type: concept
  question: |
    Both array traversal and linked-list traversal are "O(n)". Why is a `Vec`
    usually much faster in practice?
  answer: |
    Constant factors and memory layout, which Big-O hides. A `Vec` is contiguous,
    so the CPU cache prefetches the next elements (few cache misses). A linked
    list scatters nodes across the heap, causing a cache miss per hop.
  source: "CS fundamentals (cache locality)"
  tags: [bigo, vec, concept]

- type: concept
  question: |
    What must a type implement to be used as a `HashMap`/`HashSet` key, versus a
    `BTreeMap`/`BTreeSet` key?
  answer: |
    Hash-based (`HashMap`/`HashSet`): `Hash + Eq`. Tree-based
    (`BTreeMap`/`BTreeSet`): `Ord`. Keys that are "equal" must hash equally
    (hash) or compare consistently (Ord).
  source: "std collections (key bounds)"
  tags: [hashmap, btreemap, concept]

- type: concept
  question: |
    Contains Duplicate: a HashSet solution is O(n), while sort_unstable +
    windows(2) is O(n log n). Why does the "worse" sorting version often run
    FASTER on LeetCode/NeetCode inputs?
  answer: |
    Big-O ignores constants, but CPUs don't. On the small inputs these platforms
    use, the constant factors dominate:
    - Sorting i32s with sort_unstable is sequential memory access, no allocation,
      no hashing -> great cache locality and branch prediction. Comparing two
      adjacent integers is extremely cheap.
    - A HashSet pays a real cost per element: hash the value, probe the table,
      chase pointer-like (scattered) memory, and occasionally resize/rehash.
    So the linear-but-heavy hash work loses to the n log n-but-light sort until n
    gets large. The crossover is implementation/hardware dependent (roughly: sort
    wins for thousands, hashing wins for millions).
  source: "NeetCode Contains Duplicate (interview performance notes)"
  tags: [sort, performance, bigo, concept]

- type: concept
  question: |
    If sorting often wins on small inputs, when should you still reach for the
    hashing solution (and what would an interviewer expect)?
  answer: |
    Reach for hashing when:
    - n can grow large — O(n) eventually beats O(n log n) no matter the constants.
    - You can early-exit (e.g. Contains Duplicate returns the instant a repeat is
      inserted, often before scanning everything).
    - You must NOT mutate or reorder the input, or you need the elements' original
      positions.
    - A faster hasher (ahash / FxHash) is available, which shrinks hashing's
      constant and lowers the crossover point.
    In an interview, the HashSet O(n) answer is the expected "optimal" one — state
    it first, then note that an in-place sort can be faster in practice on small n.
    In production, pick by measuring, not by Big-O alone.
  source: "NeetCode Contains Duplicate (interview performance notes)"
  tags: [sort, performance, bigo, concept]

- type: concept
  question: |
    For "count the characters" problems (anagram, frequency), how do you choose
    the counting structure in Rust, fastest first?
  answer: |
    - Small, KNOWN alphabet (e.g. lowercase a-z): a fixed array `[i32; 26]` indexed
      by `(b - b'a') as usize`. O(1) lookups, no hashing, no allocation -- usually
      the optimal answer.
    - Arbitrary Unicode or an unknown/large key space: `HashMap<char, i32>` --
      correct and flexible, but pays hashing + allocation overhead.
    Rule of thumb: small fixed alphabet -> array; ASCII bytes -> `bytes()`; real
    Unicode -> `chars()`; unknown/large -> `HashMap`. In practice on small/medium
    n the ranking is array > sort_unstable > HashMap, because constant factors beat
    Big-O at those sizes.
  source: "NeetCode anagram-family problems (interview performance notes)"
  tags: [strings, counting, performance, concept]

- type: concept
  question: |
    `BinaryHeap<T>`: complexity of `push`, `pop` (removing the max), and `peek`?
    Is it a min-heap or a max-heap by default?
  answer: |
    `push`: O(log n). `pop`: O(log n) (removes and returns the GREATEST element).
    `peek`: O(1) (looks at the greatest element without removing it).
    Rust's `BinaryHeap` is a MAX-heap by default; for a min-heap, wrap elements in
    `std::cmp::Reverse`, or implement `Ord` inverted.
  code: |
    use std::collections::BinaryHeap;
    use std::cmp::Reverse;
    let mut min_heap = BinaryHeap::new();
    min_heap.push(Reverse(5));
    min_heap.push(Reverse(1));
    assert_eq!(min_heap.pop(), Some(Reverse(1))); // smallest first
  source: "std BinaryHeap (complexity docs)"
  tags: [heap, bigo, concept]

- type: concept
  question: |
    A recursive function calls itself to depth n. What is its SPACE complexity,
    and why — even if it does O(1) work per call?
  answer: |
    O(n): each pending call keeps its own STACK FRAME alive (locals, return
    address) until it returns, so n nested calls hold n frames simultaneously.
    This is why deep unbounded recursion (e.g. over a large unsorted list) can
    overflow the stack even when the per-call work is trivial — an iterative
    loop with an explicit accumulator would do the same job in O(1) space.
    Tail-call optimization would eliminate this in some languages, but Rust does
    NOT guarantee TCO, so a recursive function's stack usage should be assumed
    O(depth).
  source: "CS fundamentals (recursion & call stack)"
  tags: [recursion, bigo, concept]

- type: concept
  question: |
    Cheat sheet: average-case complexity of get/insert/remove (or push/pop) for
    Vec, VecDeque, HashMap, BTreeMap, and BinaryHeap, side by side.
  answer: |
    `Vec`: index O(1), push/pop-back O(1) amortized, insert/remove-middle O(n).
    `VecDeque`: index O(1), push/pop at EITHER end O(1), insert/remove-middle O(n).
    `HashMap`: get/insert/remove O(1) average (O(n) worst case).
    `BTreeMap`: get/insert/remove O(log n), keeps keys sorted.
    `BinaryHeap`: push/pop O(log n), peek (the max) O(1).
    Rule of thumb: need order-preserving fast ends -> VecDeque; need fast
    lookup, don't care about order -> HashMap; need sorted iteration -> BTreeMap;
    need repeated access to the current min/max -> BinaryHeap.
  source: "std collections (side-by-side complexity)"
  tags: [bigo, vec, hashmap, btreemap, heap, vecdeque, concept]
