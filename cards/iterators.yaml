- instruction: |
    Domain: write `step_distances(pts: &[(f64, f64)]) -> Vec<f64>` giving the
    Euclidean distance between each consecutive pair of points (length n-1).
  starter: |
    fn step_distances(pts: &[(f64, f64)]) -> Vec<f64> {

    }
  solution: |
    fn step_distances(pts: &[(f64, f64)]) -> Vec<f64> {
        pts.windows(2)
            .map(|w| ((w[1].0 - w[0].0).powi(2) + (w[1].1 - w[0].1).powi(2)).sqrt())
            .collect()
    }
  notes: |
    `slice::windows(2)` yields overlapping length-2 slices — ideal for spacing
    along a centerline. See `chunks` for non-overlapping groups.
  source: "std slice::windows"
  tags: [rust, iterators, domain]
  tests: |
    let d = step_distances(&[(0.0, 0.0), (3.0, 4.0)]);
    assert_eq!(d.len(), 1);
    assert!((d[0] - 5.0).abs() < 1e-9);
    assert_eq!(step_distances(&[(0.0, 0.0)]), Vec::<f64>::new());

- instruction: |
    Write `sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError>`:
    parse all to i32 (fail on first bad one) then return their sum, using `?`.
  starter: |
    fn sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError> {
        let nums: Vec<i32> = items
            .iter()
            .map(|s| s.parse())
            .collect::<Result<_, _>>()?;
        Ok(nums.iter().sum())
    }
  notes: |
    Collect into `Result<Vec<_>, _>`, then `?` unwraps it or returns the error.
    The `Vec<i32>` binding lets `parse` infer its target.
  source: "std FromIterator for Result"
  tags: [rust, iterators, results]
  tests: |
    assert_eq!(sum_parsed(&["1", "2", "3"]), Ok(6));
    assert!(sum_parsed(&["1", "x"]).is_err());

- instruction: |
    Write `split_pairs(pairs: Vec<(i32, char)>) -> (Vec<i32>, Vec<char>)`
    splitting a Vec of tuples into two parallel Vecs, using `unzip`.
  starter: |
    fn split_pairs(pairs: Vec<(i32, char)>) -> (Vec<i32>, Vec<char>) {

    }
  solution: |
    fn split_pairs(pairs: Vec<(i32, char)>) -> (Vec<i32>, Vec<char>) {
        pairs.into_iter().unzip()
    }
  notes: |
    `unzip()` is the inverse of `zip`: an iterator of `(A, B)` pairs becomes a
    `(Collection<A>, Collection<B>)` in one pass.
  source: "std Iterator::unzip"
  tags: [rust, iterators, unzip]
  tests: |
    let (nums, chars) = split_pairs(vec![(1, 'a'), (2, 'b'), (3, 'c')]);
    assert_eq!(nums, vec![1, 2, 3]);
    assert_eq!(chars, vec!['a', 'b', 'c']);
    let (n2, c2): (Vec<i32>, Vec<char>) = split_pairs(vec![]);
    assert!(n2.is_empty() && c2.is_empty());

- instruction: |
    Write `overall_max(v: &[i32]) -> Option<i32>` returning the maximum via
    `reduce` (not `.max()`), using `i32::max` as the combiner.
  starter: |
    fn overall_max(v: &[i32]) -> Option<i32> {

    }
  solution: |
    fn overall_max(v: &[i32]) -> Option<i32> {
        v.iter().copied().reduce(i32::max)
    }
  notes: |
    `reduce(f)` is `fold` without a separate initial value: it uses the first
    item as the seed, then combines the rest with `f`, returning `None` on an
    empty iterator (unlike `fold`, which always returns something). Prefer the
    built-in `.max()`/`.sum()` when they exist; reach for `reduce` when the
    combining rule is custom.
  source: "std Iterator::reduce"
  tags: [rust, iterators, reduce]
  tests: |
    assert_eq!(overall_max(&[3, 7, 2, 9, 4]), Some(9));
    assert_eq!(overall_max(&[]), None);

- instruction: |
    Write `count_leading_dupes(v: &[i32]) -> usize`: how many times the FIRST
    value repeats consecutively at the start (e.g. [5, 5, 5, 2, 5] -> 3), using
    a `Peekable` iterator with `peek`.
  starter: |
    fn count_leading_dupes(v: &[i32]) -> usize {

    }
  solution: |
    fn count_leading_dupes(v: &[i32]) -> usize {
        let mut it = v.iter().peekable();
        let Some(&first) = it.next() else {
            return 0;
        };
        let mut count = 1;
        while let Some(&&next) = it.peek() {
            if next != first {
                break;
            }
            count += 1;
            it.next();
        }
        count
    }
  notes: |
    `peekable()` wraps an iterator so you can look at the next item with
    `peek()` WITHOUT consuming it — essential when whether you advance depends
    on what's next.
  source: "std Iterator::peekable"
  tags: [rust, iterators, peekable]
  tests: |
    assert_eq!(count_leading_dupes(&[5, 5, 5, 2, 5]), 3);
    assert_eq!(count_leading_dupes(&[1, 2, 3]), 1);
    assert_eq!(count_leading_dupes(&[]), 0);
    assert_eq!(count_leading_dupes(&[7, 7, 7]), 3);

# --- concept cards ---
- type: concept
  question: |
    What do `iter()`, `iter_mut()`, and `into_iter()` each yield, and how do
    they treat the underlying collection?
  answer: |
    **`iter()` yields `&T` (borrows), `iter_mut()` yields `&mut T` (mutably
    borrows), and `into_iter()` yields `T` (consumes the collection).**

    `iter()` -> `&T`: borrows; the collection stays usable.
    `iter_mut()` -> `&mut T`: mutably borrows; edit elements in place.
    `into_iter()` -> `T`: consumes, moving elements out (a `Vec` is gone after).
    On a `&Vec`/slice, `into_iter()` yields `&T` — you can't move out of a borrow.
  code: |
    let v = vec![1, 2, 3];
    let _refs: Vec<&i32> = v.iter().collect();        // borrow
    let mut owned = v.clone();
    for x in owned.iter_mut() { *x += 1; }            // mutate in place
    let _moved: Vec<i32> = v.into_iter().collect();   // consumes v
  source: "book §13.2"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Are iterator adaptors like `map` and `filter` evaluated immediately?
  answer: |
    **No — iterator adaptors are lazy; they do no work until a consumer
    drives them.**

    Adaptors like `map`/`filter` build a description and run nothing until a
    CONSUMER drives them: `collect`, `sum`, `count`, `for`, `fold`, `find`, etc.
    A chain with no consumer does nothing (the compiler warns "unused iterator").
  source: "book §13.2"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Why does `collect()` often need a type annotation or turbofish?
  answer: |
    **Because `collect` is generic over its output type via `FromIterator`,
    so the compiler can't always infer what you want without help.**

    Specify it via the binding type (`let v: Vec<_> = ...`) or turbofish
    (`.collect::<Vec<_>>()`).
  source: "std Iterator::collect"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    What happens when you `collect` an iterator of `Result<T, E>` into
    `Result<Vec<T>, E>` (or `Option`)?
  answer: |
    **It short-circuits: collecting stops at the first `Err` and returns it;
    otherwise it yields `Ok(all_values)`.**

    The same works for `Option<Vec<T>>` (first `None` wins). Ideal for
    "parse/validate all or fail".
  source: "std FromIterator for Result"
  tags: [rust, iterators, concept, results]

