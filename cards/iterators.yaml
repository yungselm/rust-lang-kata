- instruction: |
    Write `running_sum(v: &[i32]) -> Vec<i32>`: the running cumulative total,
    e.g. [1, 2, 3, 4] -> [1, 3, 6, 10].
  starter: |
    fn running_sum(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn running_sum(v: &[i32]) -> Vec<i32> {
        v.iter().scan(0, |acc, &x| {
            *acc += x;
            Some(*acc)
        }).collect()
    }
  notes: |
    `scan` is like `fold` but yields the accumulator at each step. Returning
    `None` would end iteration early.
  source: "std Iterator::scan"
  tags: [rust, iterators]
  tests: |
    assert_eq!(running_sum(&[1, 2, 3, 4]), vec![1, 3, 6, 10]);
    assert_eq!(running_sum(&[]), Vec::<i32>::new());

