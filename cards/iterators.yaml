  source: "std str::chars"
  tags: [rust, iterators]

- instruction: |
    Write `char_positions(s: &str) -> HashMap<char, usize>` mapping each char
    to the index of its LAST occurrence.
  starter: |
    use std::collections::HashMap;

    fn char_positions(s: &str) -> HashMap<char, usize> {

    }
  solution: |
    use std::collections::HashMap;

    fn char_positions(s: &str) -> HashMap<char, usize> {
        s.chars().enumerate().map(|(i, c)| (c, i)).collect()
    }
  notes: |
    An iterator of `(K, V)` tuples collects into a `HashMap`; later duplicate
    keys overwrite earlier ones, recording the last index.
  source: "std FromIterator for HashMap"
  tags: [rust, iterators, hashmap]

- instruction: |
    Write `split_parity(v: &[i32]) -> (Vec<i32>, Vec<i32>)` returning
    (evens, odds).
  starter: |
    fn split_parity(v: &[i32]) -> (Vec<i32>, Vec<i32>) {

    }
  solution: |
    fn split_parity(v: &[i32]) -> (Vec<i32>, Vec<i32>) {
        v.iter().copied().partition(|&x| x % 2 == 0)
    }
  notes: |
    `partition` splits by a predicate: trues first, falses second. The return
    type tells it to build two `Vec<i32>`.
  source: "std Iterator::partition"
  tags: [rust, iterators]

- instruction: |
    Write `running_sum(v: &[i32]) -> Vec<i32>`: the running cumulative total,
    e.g. [1, 2, 3, 4] -> [1, 3, 6, 10].
  starter: |
    fn running_sum(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn running_sum(v: &[i32]) -> Vec<i32> {
        v.iter().scan(0, |acc, &x| {
            *acc += x;
            Some(*acc)
        }).collect()
    }
  notes: |
    `scan` is like `fold` but yields the accumulator at each step. Returning
    `None` would end iteration early.
  source: "std Iterator::scan"
  tags: [rust, iterators]

- instruction: |
    Write `every_other(v: &[i32]) -> Vec<i32>`: copies of elements at indices
    0, 2, 4, ...
  starter: |
    fn every_other(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn every_other(v: &[i32]) -> Vec<i32> {
        v.iter().step_by(2).copied().collect()
    }
  notes: |
    `step_by(n)` yields the first element then every nth after it.
  source: "std Iterator::step_by"
  tags: [rust, iterators]

- instruction: |
    Domain: write `step_distances(pts: &[(f64, f64)]) -> Vec<f64>` giving the
    Euclidean distance between each consecutive pair of points (length n-1).
  starter: |
    fn step_distances(pts: &[(f64, f64)]) -> Vec<f64> {

    }
  solution: |
    fn step_distances(pts: &[(f64, f64)]) -> Vec<f64> {
        pts.windows(2)
            .map(|w| ((w[1].0 - w[0].0).powi(2) + (w[1].1 - w[0].1).powi(2)).sqrt())
            .collect()
    }
  notes: |
    `slice::windows(2)` yields overlapping length-2 slices — ideal for spacing
    along a centerline. See `chunks` for non-overlapping groups.
  source: "std slice::windows"
  tags: [rust, iterators, domain]

- instruction: |
    Write `sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError>`:
    parse all to i32 (fail on first bad one) then return their sum, using `?`.
  starter: |
    fn sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError> {
        let nums: Vec<i32> = items
            .iter()
            .map(|s| s.parse())
            .collect::<Result<_, _>>()?;
        Ok(nums.iter().sum())
    }
  notes: |
    Collect into `Result<Vec<_>, _>`, then `?` unwraps it or returns the error.
    The `Vec<i32>` binding lets `parse` infer its target.
  source: "std FromIterator for Result"
  tags: [rust, iterators, results]

# --- concept cards ---
- type: concept
  question: |
    What do `iter()`, `iter_mut()`, and `into_iter()` each yield, and how do
    they treat the underlying collection?
  answer: |
    `iter()` -> `&T`: borrows; the collection stays usable.
    `iter_mut()` -> `&mut T`: mutably borrows; edit elements in place.
    `into_iter()` -> `T`: consumes, moving elements out (a `Vec` is gone after).
    On a `&Vec`/slice, `into_iter()` yields `&T` — you can't move out of a borrow.
  code: |
    let v = vec![1, 2, 3];
    let _refs: Vec<&i32> = v.iter().collect();        // borrow
    let mut owned = v.clone();
    for x in owned.iter_mut() { *x += 1; }            // mutate in place
    let _moved: Vec<i32> = v.into_iter().collect();   // consumes v
  source: "book §13.2"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Are iterator adaptors like `map` and `filter` evaluated immediately?
  answer: |
    No — they are lazy. Adaptors build a description and do no work until a
    CONSUMER drives them: `collect`, `sum`, `count`, `for`, `fold`, `find`, etc.
    A chain with no consumer does nothing (the compiler warns "unused iterator").
  source: "book §13.2"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Why does `collect()` often need a type annotation or turbofish?
  answer: |
    `collect` is generic over its output via `FromIterator`, so the compiler
    can't always tell what you want. Specify it via the binding type
    (`let v: Vec<_> = ...`) or turbofish (`.collect::<Vec<_>>()`).
  source: "std Iterator::collect"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    What happens when you `collect` an iterator of `Result<T, E>` into
    `Result<Vec<T>, E>` (or `Option`)?
  answer: |
    It short-circuits: stops at the first `Err` and returns it; otherwise yields
    `Ok(all_values)`. The same works for `Option<Vec<T>>` (first `None` wins).
    Ideal for "parse/validate all or fail".
  source: "std FromIterator for Result"
  tags: [rust, iterators, concept, results]

# --- Rustlings iterators4 / iterators5 ---
- instruction: |
    Write `factorial(num: u64) -> u64` using an iterator and NO loop or mutable
    variable. (factorial(0) = 1.)
    Example: factorial(4) -> 24.
  starter: |
    fn factorial(num: u64) -> u64 {

    }
  solution: |
    fn factorial(num: u64) -> u64 {
        (1..=num).product()
    }
  notes: |
    `product()` multiplies the range; the inclusive range `1..=num` is empty for
    num = 0, and the product of an empty iterator is 1 — so 0! falls out correctly.
    (Rustlings writes `(2..=num).product()`, which is equivalent since *1 is a no-op.)
  source: "Rustlings iterators4 · std Iterator::product"
  tags: [rust, iterators, rustlings]
  tests: |
    assert_eq!(factorial(0), 1);
    assert_eq!(factorial(1), 1);
    assert_eq!(factorial(4), 24);
    assert_eq!(factorial(5), 120);

- instruction: |
    Given the `Progress` enum and a `HashMap<String, Progress>`, write
    `count_iterator(map, value) -> usize`: how many values equal `value`. Use
    iterators, no loop.
  starter: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {

    }
  solution: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {
        map.values().filter(|&&v| v == value).count()
    }
  notes: |
    `values()` iterates `&Progress`; `filter` then `count` replaces the imperative
    "loop and increment". `Progress` is `Copy`, so `|&&v|` binds a plain `Progress`.
  source: "Rustlings iterators5 · std Iterator::filter/count"
  tags: [rust, iterators, hashmap, rustlings]
  tests: |
    let mut map = HashMap::new();
    map.insert("a".to_string(), Progress::Complete);
    map.insert("b".to_string(), Progress::Complete);
    map.insert("c".to_string(), Progress::Complete);
    map.insert("d".to_string(), Progress::Some);
    map.insert("e".to_string(), Progress::None);
    map.insert("f".to_string(), Progress::None);
    assert_eq!(count_iterator(&map, Progress::Complete), 3);
    assert_eq!(count_iterator(&map, Progress::Some), 1);
    assert_eq!(count_iterator(&map, Progress::None), 2);

- instruction: |
    Given `count_iterator` (counts matching values in one map), write
    `count_collection_iterator(collection: &[HashMap<String, Progress>], value)
    -> usize` summing the counts across every map. Use iterators, no loop.
  starter: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {
        map.values().filter(|&&v| v == value).count()
    }

    fn count_collection_iterator(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {

    }
  solution: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {
        map.values().filter(|&&v| v == value).count()
    }

    fn count_collection_iterator(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {
        collection.iter().map(|map| count_iterator(map, value)).sum()
    }
  notes: |
    Map each inner map to its count, then `sum()` — an iterator of iterators handled
    by reusing the per-map counter.
  source: "Rustlings iterators5 · std Iterator::map/sum"
  tags: [rust, iterators, hashmap, rustlings]
  tests: |
    let mut a = HashMap::new();
    a.insert("x".to_string(), Progress::Complete);
    a.insert("y".to_string(), Progress::Complete);
    a.insert("z".to_string(), Progress::None);
    let mut b = HashMap::new();
    b.insert("p".to_string(), Progress::Complete);
    b.insert("q".to_string(), Progress::Some);
    let coll = vec![a, b];
    assert_eq!(count_collection_iterator(&coll, Progress::Complete), 3);
    assert_eq!(count_collection_iterator(&coll, Progress::Some), 1);
    assert_eq!(count_collection_iterator(&coll, Progress::None), 1);

- instruction: |
    Write `count_collection_iterator_flat(collection: &[HashMap<String, Progress>],
    value) -> usize` that counts matching values across all maps by FLATTENING the
    maps into one stream of values (`flat_map`), then filtering and counting.
  starter: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_collection_iterator_flat(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {

    }
  solution: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_collection_iterator_flat(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {
        collection
            .iter()
            .flat_map(HashMap::values)
            .filter(|&&v| v == value)
            .count()
    }
  notes: |
    `flat_map(HashMap::values)` turns the slice of maps into one flat stream of
    `&Progress`, so a single filter+count does the whole job — no inner helper.
  source: "Rustlings iterators5 · std Iterator::flat_map"
  tags: [rust, iterators, hashmap, rustlings]
  tests: |
    let mut a = HashMap::new();
    a.insert("x".to_string(), Progress::Complete);
    a.insert("y".to_string(), Progress::None);
    let mut b = HashMap::new();
    b.insert("p".to_string(), Progress::Complete);
    b.insert("q".to_string(), Progress::Complete);
    let coll = vec![a, b];
    assert_eq!(count_collection_iterator_flat(&coll, Progress::Complete), 3);
    assert_eq!(count_collection_iterator_flat(&coll, Progress::None), 1);

- instruction: |
    Write `capitalize_first(input: &str) -> String`: upper-case the first character
    and keep the rest unchanged; an empty string stays "".
    Example: "hello" -> "Hello".
  starter: |
    fn capitalize_first(input: &str) -> String {

    }
  solution: |
    fn capitalize_first(input: &str) -> String {
        let mut chars = input.chars();
        match chars.next() {
            None => String::new(),
            Some(first) => first.to_uppercase().to_string() + chars.as_str(),
        }
    }
  notes: |
    Pull the first `char` off the iterator with `next()`, upper-case it, then append
    the REST via `chars.as_str()` (the still-unconsumed tail of the iterator). `None`
    means the input was empty.
  source: "Rustlings iterators2 · std char::to_uppercase"
  tags: [rust, iterators, strings, rustlings]
  tests: |
    assert_eq!(capitalize_first("hello"), "Hello");
    assert_eq!(capitalize_first(""), "");
    assert_eq!(capitalize_first("a"), "A");

- type: concept
  question: |
    Why does `v.windows(2).map(|&w| w[0] + w[1])` fail with "the size for values
    of type `[i32]` cannot be known at compile time"?
  answer: |
    `windows(2)` yields `&[i32]` — a reference to a slice. The pattern `|&w|` says
    "peel the reference and bind the pointee by value", which would make `w` a bare
    `[i32]`. But `[i32]` is unsized (`!Sized`): its length isn't part of the type,
    so the compiler can't store one in a local or move it. Keep the reference:
    write `|w|` (so `w: &[i32]`) and index through it — `w[0]` auto-derefs to a
    sized `i32` and the arithmetic is fine.
  source: "std slice::windows; std::marker::Sized"
  tags: [rust, iterators, sized, concept]

- type: concept
  question: |
    When can you use the reference-peeling closure pattern `|&x|` (binding the
    value behind the reference), and when does it fail?
  answer: |
    Only when what's behind the reference is `Sized`.
    - `v.iter().map(|&x| ...)` over `&i32`: peeling binds `x: i32`. `i32` is sized,
      so this is fine (and idiomatic).
    - `v.windows(2).map(|&w| ...)` over `&[i32]`: peeling would bind `w: [i32]`, a
      bare slice — unsized -> compile error.
    The deciding factor is SIZEDNESS, not `Copy`: you can only move a pointee out
    by value if its size is known at compile time. A single `i32` qualifies; a
    slice `[i32]` does not.
  source: "std::marker::Sized"
  tags: [rust, iterators, sized, concept]

- type: concept
  question: |
    Safe default when you're unsure whether to peel the reference in a closure
    pattern (`|&x|` vs `|x|`)?
  answer: |
    Don't destructure — write `|w|` (or `|x|`) and reach inside: `w[0]`, `w.0`,
    `*x`, a method call, etc. Indexing, field access, and method calls auto-deref,
    so this works whether the item is a slice or a sized value, and it always
    compiles. Reach for `|&x|` deliberately only when the item is an obvious `&i32`
    / `&T: Copy` and you want the value directly. This single habit makes
    `windows`, `chunks`, and `iter` all correct.
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Does the "you can only peel `&` in a pattern if the pointee is `Sized`" rule
    apply only to `.map()` closures, or more broadly?
  answer: |
    It applies EVERYWHERE a pattern binds a value: `for` loops, `let`, `match`
    arms, function parameters, and closure arguments. A leading `&` in a pattern
    always means "match a reference and move the pointee out by value", which only
    works if that pointee is `Sized`.
    - `for &x in &nums {}` — pointee `i32`, sized -> OK.
    - `for &w in nums.windows(2) {}` — pointee `[i32]`, unsized -> ERROR (use
      `for w in ...` and index).
    - `let &x = &5;` works; `let &s = &v[..];` does not.
    Same rule, same fix everywhere: keep the reference (`w`, `x`) and reach inside.
  source: "std::marker::Sized"
  tags: [rust, iterators, sized, concept]
