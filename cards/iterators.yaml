- instruction: |
    Write `factorial(num: u64) -> u64` using an iterator and NO loop or mutable
    variable. (factorial(0) = 1.)
    Example: factorial(4) -> 24.
  starter: |
    fn factorial(num: u64) -> u64 {

    }
  solution: |
    fn factorial(num: u64) -> u64 {
        (1..=num).product()
    }
  notes: |
    `product()` multiplies the range; the inclusive range `1..=num` is empty for
    num = 0, and the product of an empty iterator is 1 — so 0! falls out correctly.
    (Rustlings writes `(2..=num).product()`, which is equivalent since *1 is a no-op.)
  source: "Rustlings iterators4 · std Iterator::product"
  tags: [rust, iterators, rustlings]
  tests: |
    assert_eq!(factorial(0), 1);
    assert_eq!(factorial(1), 1);
    assert_eq!(factorial(4), 24);
    assert_eq!(factorial(5), 120);

- instruction: |
    Given the `Progress` enum and a `HashMap<String, Progress>`, write
    `count_iterator(map, value) -> usize`: how many values equal `value`. Use
    iterators, no loop.
  starter: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {

    }
  solution: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {
        map.values().filter(|&&v| v == value).count()
    }
  notes: |
    `values()` iterates `&Progress`; `filter` then `count` replaces the imperative
    "loop and increment". `Progress` is `Copy`, so `|&&v|` binds a plain `Progress`.
  source: "Rustlings iterators5 · std Iterator::filter/count"
  tags: [rust, iterators, hashmap, rustlings]
  tests: |
    let mut map = HashMap::new();
    map.insert("a".to_string(), Progress::Complete);
    map.insert("b".to_string(), Progress::Complete);
    map.insert("c".to_string(), Progress::Complete);
    map.insert("d".to_string(), Progress::Some);
    map.insert("e".to_string(), Progress::None);
    map.insert("f".to_string(), Progress::None);
    assert_eq!(count_iterator(&map, Progress::Complete), 3);
    assert_eq!(count_iterator(&map, Progress::Some), 1);
    assert_eq!(count_iterator(&map, Progress::None), 2);

- instruction: |
    Given `count_iterator` (counts matching values in one map), write
    `count_collection_iterator(collection: &[HashMap<String, Progress>], value)
    -> usize` summing the counts across every map. Use iterators, no loop.
  starter: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {
        map.values().filter(|&&v| v == value).count()
    }

    fn count_collection_iterator(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {

    }
  solution: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_iterator(map: &HashMap<String, Progress>, value: Progress) -> usize {
        map.values().filter(|&&v| v == value).count()
    }

    fn count_collection_iterator(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {
        collection.iter().map(|map| count_iterator(map, value)).sum()
    }
  notes: |
    Map each inner map to its count, then `sum()` — an iterator of iterators handled
    by reusing the per-map counter.
  source: "Rustlings iterators5 · std Iterator::map/sum"
  tags: [rust, iterators, hashmap, rustlings]
  tests: |
