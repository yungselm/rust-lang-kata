# Iterators — adaptors and consumers. Solutions are clippy-clean; verify with
# `python check_cards.py cards/iterators.yaml`.
- instruction: |
    Write `double`: take a `Vec<i32>` by value and return a new `Vec<i32>`
    with every element multiplied by 2, using iterator methods.
  starter: |
    fn double(v: Vec<i32>) -> Vec<i32> {

    }
  solution: |
    fn double(v: Vec<i32>) -> Vec<i32> {
        v.into_iter().map(|x| x * 2).collect()
    }
  notes: |
    `into_iter()` consumes the Vec (yields owned `i32`), `map` transforms,
    `collect()` rebuilds. The return type tells `collect` to make a Vec.
  source: "std Iterator::map"
  tags: [rust, iterators]

- instruction: |
    Write `evens(v: &[i32]) -> Vec<i32>` returning copies of the even elements.
  starter: |
    fn evens(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn evens(v: &[i32]) -> Vec<i32> {
        v.iter().copied().filter(|&x| x % 2 == 0).collect()
    }
  notes: |
    Idiom: `copied()` first turns `&i32` into `i32`, so the filter closure binds
    a plain `|&x|` instead of the awkward `|&&x|`.
  source: "std Iterator::filter"
  tags: [rust, iterators]

- instruction: |
    Write `sum_of_squares(v: &[i32]) -> i32` (sum of each element squared).
  starter: |
    fn sum_of_squares(v: &[i32]) -> i32 {

    }
  solution: |
    fn sum_of_squares(v: &[i32]) -> i32 {
        v.iter().map(|&x| x * x).sum()
    }
  notes: |
    `sum()` consumes the iterator; the return type fixes the sum's type.
  source: "std Iterator::sum"
  tags: [rust, iterators]

- instruction: |
    Write `parse_all(items: &[&str]) -> Result<Vec<i32>, std::num::ParseIntError>`:
    parse every string to i32, returning the first error if any fails.
  starter: |
    fn parse_all(items: &[&str]) -> Result<Vec<i32>, std::num::ParseIntError> {

    }
  solution: |
    fn parse_all(items: &[&str]) -> Result<Vec<i32>, std::num::ParseIntError> {
        items.iter().map(|s| s.parse()).collect()
    }
  notes: |
    Collecting `Result`s into `Result<Vec<_>, _>` short-circuits on the first
    `Err`. The return type lets `parse` infer its target without a turbofish.
  source: "std FromIterator for Result"
  tags: [rust, iterators, results]

- instruction: |
    Write `parse_ok(items: &[&str]) -> Vec<i32>`: parse to i32 but silently
    drop any that fail.
  starter: |
    fn parse_ok(items: &[&str]) -> Vec<i32> {

    }
  solution: |
    fn parse_ok(items: &[&str]) -> Vec<i32> {
        items.iter().filter_map(|s| s.parse().ok()).collect()
    }
  notes: |
    `filter_map` keeps only `Some` values; `Result::ok()` turns each
    `Result<i32, _>` into `Option<i32>`. The Vec return type drives inference.
  source: "std Iterator::filter_map"
  tags: [rust, iterators]

- instruction: |
    Write `indexed(v: &[char]) -> Vec<(usize, char)>` pairing each element
    with its index.
  starter: |
    fn indexed(v: &[char]) -> Vec<(usize, char)> {

    }
  solution: |
    fn indexed(v: &[char]) -> Vec<(usize, char)> {
        v.iter().copied().enumerate().collect()
    }
  notes: |
    `copied()` before `enumerate()` gives owned `char`s, so the map closure is a
    clean `|(i, c)|`. (`enumerate` yields `(index, item)`.)
  source: "std Iterator::enumerate"
  tags: [rust, iterators]

- instruction: |
    Write `pair_sums(a: &[i32], b: &[i32]) -> Vec<i32>`: element-wise sums,
    stopping at the shorter length.
  starter: |
    fn pair_sums(a: &[i32], b: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn pair_sums(a: &[i32], b: &[i32]) -> Vec<i32> {
        a.iter().zip(b).map(|(x, y)| x + y).collect()
    }
  notes: |
    `zip` accepts anything `IntoIterator`, so `b` (a slice) needs no `.iter()`.
    It stops when either side ends. `x`/`y` are `&i32`; `x + y` uses the ref
    `Add` impl.
  source: "std Iterator::zip"
  tags: [rust, iterators]

- instruction: |
    Write `poly_eval(coeffs: &[f64], x: f64) -> f64` evaluating a polynomial at
    `x` with Horner's method, using `fold`. `coeffs` is highest-degree first.
  starter: |
    fn poly_eval(coeffs: &[f64], x: f64) -> f64 {

    }
  solution: |
    fn poly_eval(coeffs: &[f64], x: f64) -> f64 {
        coeffs.iter().fold(0.0, |acc, &c| acc * x + c)
    }
  notes: |
    `fold(init, |acc, item| ...)` threads an accumulator through the iterator.
    (A fold that just adds or multiplies should be `sum`/`product` instead —
    clippy will tell you; Horner's `acc * x + c` genuinely needs fold.)
  source: "std Iterator::fold"
  tags: [rust, iterators]

- instruction: |
    Write `longest_len(words: &[&str]) -> usize`: length of the longest word,
    or 0 if empty.
  starter: |
    fn longest_len(words: &[&str]) -> usize {

    }
  solution: |
    fn longest_len(words: &[&str]) -> usize {
        words.iter().map(|s| s.len()).max().unwrap_or(0)
    }
  notes: |
    `max()` returns `Option` (None on empty), so `unwrap_or(0)` supplies the
    default. To compare by a key instead, use `max_by_key`.
  source: "std Iterator::max"
  tags: [rust, iterators]

- instruction: |
    Write `first_negative_index(v: &[i32]) -> Option<usize>`: index of the
    first negative element.
  starter: |
    fn first_negative_index(v: &[i32]) -> Option<usize> {

    }
  solution: |
    fn first_negative_index(v: &[i32]) -> Option<usize> {
        v.iter().position(|&x| x < 0)
    }
  notes: |
    `position` returns the first matching index as `Option`. Use `find` for the
    element itself.
  source: "std Iterator::position"
  tags: [rust, iterators]

- instruction: |
    Write `all_positive(v: &[i32]) -> bool`: true iff every element is > 0.
  starter: |
    fn all_positive(v: &[i32]) -> bool {

    }
  solution: |
    fn all_positive(v: &[i32]) -> bool {
        v.iter().all(|&x| x > 0)
    }
  notes: |
    `all` short-circuits on the first false; `any` on the first true. On an empty
    iterator `all` is true and `any` is false.
  source: "std Iterator::all"
  tags: [rust, iterators]

- instruction: |
    Write `count_vowels(s: &str) -> usize` counting ascii vowels.
  starter: |
    fn count_vowels(s: &str) -> usize {

    }
  solution: |
    fn count_vowels(s: &str) -> usize {
        s.chars().filter(|&c| "aeiou".contains(c)).count()
    }
  notes: |
    `chars()` yields owned `char`, so `|&c|` binds a `char` and `contains(c)`
    takes it directly (a `char` is a valid `str` pattern). `count()` consumes.
  source: "std Iterator::count"
  tags: [rust, iterators]

- instruction: |
    Write `first_three(v: &[i32]) -> Vec<i32>`: copies of up to the first 3.
  starter: |
    fn first_three(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn first_three(v: &[i32]) -> Vec<i32> {
        v.iter().take(3).copied().collect()
    }
  notes: |
    `take(n)` yields at most n items. Its partner `skip(n)` drops the first n.
  source: "std Iterator::take"
  tags: [rust, iterators]

- instruction: |
    Write `leading_positives(v: &[i32]) -> Vec<i32>`: copy elements from the
    start while they stay > 0, stopping at the first non-positive.
  starter: |
    fn leading_positives(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn leading_positives(v: &[i32]) -> Vec<i32> {
        v.iter().copied().take_while(|&x| x > 0).collect()
    }
  notes: |
    `take_while` stops permanently at the first failing element (unlike `filter`,
    which tests every one). Partner: `skip_while`.
  source: "std Iterator::take_while"
  tags: [rust, iterators]

- instruction: |
    Write `concat(a: &[i32], b: &[i32]) -> Vec<i32>` joining the two in order.
  starter: |
    fn concat(a: &[i32], b: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn concat(a: &[i32], b: &[i32]) -> Vec<i32> {
        a.iter().chain(b).copied().collect()
    }
  notes: |
    `chain` runs the first iterator to completion, then the second. `b` is
    `IntoIterator`, so no `.iter()` needed.
  source: "std Iterator::chain"
  tags: [rust, iterators]

- instruction: |
    Write `reversed(v: &[i32]) -> Vec<i32>` (elements in reverse order).
  starter: |
    fn reversed(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn reversed(v: &[i32]) -> Vec<i32> {
        v.iter().rev().copied().collect()
    }
  notes: |
    `rev()` needs a DoubleEndedIterator (slices/Vec qualify).
  source: "std Iterator::rev"
  tags: [rust, iterators]

- instruction: |
    Write `flatten(vv: Vec<Vec<i32>>) -> Vec<i32>` concatenating all inner vecs.
  starter: |
    fn flatten(vv: Vec<Vec<i32>>) -> Vec<i32> {

    }
  solution: |
    fn flatten(vv: Vec<Vec<i32>>) -> Vec<i32> {
        vv.into_iter().flatten().collect()
    }
  notes: |
    `flatten()` turns an iterator-of-iterables into one flat stream.
  source: "std Iterator::flatten"
  tags: [rust, iterators]

- instruction: |
    Write `repeat_each(v: &[i32]) -> Vec<i32>`: each element duplicated, e.g.
    [1, 2] -> [1, 1, 2, 2].
  starter: |
    fn repeat_each(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn repeat_each(v: &[i32]) -> Vec<i32> {
        v.iter().flat_map(|&x| [x, x]).collect()
    }
  notes: |
    `flat_map` maps each item to an iterable and flattens. An array `[x, x]` is
    `IntoIterator` (2021 edition) yielding owned values.
  source: "std Iterator::flat_map"
  tags: [rust, iterators]

- instruction: |
    Write `shout(s: &str) -> String` uppercasing each ascii character.
  starter: |
    fn shout(s: &str) -> String {

    }
  solution: |
    fn shout(s: &str) -> String {
        s.chars().map(|c| c.to_ascii_uppercase()).collect()
    }
  notes: |
    An iterator of `char` collects directly into a `String`.
  source: "std str::chars"
  tags: [rust, iterators]

- instruction: |
    Write `char_positions(s: &str) -> HashMap<char, usize>` mapping each char
    to the index of its LAST occurrence.
  starter: |
    use std::collections::HashMap;

    fn char_positions(s: &str) -> HashMap<char, usize> {

    }
  solution: |
    use std::collections::HashMap;

    fn char_positions(s: &str) -> HashMap<char, usize> {
        s.chars().enumerate().map(|(i, c)| (c, i)).collect()
    }
  notes: |
    An iterator of `(K, V)` tuples collects into a `HashMap`; later duplicate
    keys overwrite earlier ones, recording the last index.
  source: "std FromIterator for HashMap"
  tags: [rust, iterators, hashmap]

- instruction: |
    Write `split_parity(v: &[i32]) -> (Vec<i32>, Vec<i32>)` returning
    (evens, odds).
  starter: |
    fn split_parity(v: &[i32]) -> (Vec<i32>, Vec<i32>) {

    }
  solution: |
    fn split_parity(v: &[i32]) -> (Vec<i32>, Vec<i32>) {
        v.iter().copied().partition(|&x| x % 2 == 0)
    }
  notes: |
    `partition` splits by a predicate: trues first, falses second. The return
    type tells it to build two `Vec<i32>`.
  source: "std Iterator::partition"
  tags: [rust, iterators]

- instruction: |
    Write `running_sum(v: &[i32]) -> Vec<i32>`: the running cumulative total,
    e.g. [1, 2, 3] -> [1, 3, 6].
  starter: |
    fn running_sum(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn running_sum(v: &[i32]) -> Vec<i32> {
        v.iter().scan(0, |acc, &x| {
            *acc += x;
            Some(*acc)
        }).collect()
    }
  notes: |
    `scan` is like `fold` but yields the accumulator at each step. Returning
    `None` would end iteration early.
  source: "std Iterator::scan"
  tags: [rust, iterators]

- instruction: |
    Write `every_other(v: &[i32]) -> Vec<i32>`: copies of elements at indices
    0, 2, 4, ...
  starter: |
    fn every_other(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn every_other(v: &[i32]) -> Vec<i32> {
        v.iter().step_by(2).copied().collect()
    }
  notes: |
    `step_by(n)` yields the first element then every nth after it.
  source: "std Iterator::step_by"
  tags: [rust, iterators]

- instruction: |
    Domain: write `step_distances(pts: &[(f64, f64)]) -> Vec<f64>` giving the
    Euclidean distance between each consecutive pair of points (length n-1).
  starter: |
    fn step_distances(pts: &[(f64, f64)]) -> Vec<f64> {

    }
  solution: |
    fn step_distances(pts: &[(f64, f64)]) -> Vec<f64> {
        pts.windows(2)
            .map(|w| ((w[1].0 - w[0].0).powi(2) + (w[1].1 - w[0].1).powi(2)).sqrt())
            .collect()
    }
  notes: |
    `slice::windows(2)` yields overlapping length-2 slices — ideal for spacing
    along a centerline. See `chunks` for non-overlapping groups.
  source: "std slice::windows"
  tags: [rust, iterators, domain]

- instruction: |
    Write `sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError>`:
    parse all to i32 (fail on first bad one) then return their sum, using `?`.
  starter: |
    fn sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn sum_parsed(items: &[&str]) -> Result<i32, std::num::ParseIntError> {
        let nums: Vec<i32> = items
            .iter()
            .map(|s| s.parse())
            .collect::<Result<_, _>>()?;
        Ok(nums.iter().sum())
    }
  notes: |
    Collect into `Result<Vec<_>, _>`, then `?` unwraps it or returns the error.
    The `Vec<i32>` binding lets `parse` infer its target.
  source: "std FromIterator for Result"
  tags: [rust, iterators, results]

# --- concept cards ---
- type: concept
  question: |
    What do `iter()`, `iter_mut()`, and `into_iter()` each yield, and how do
    they treat the underlying collection?
  answer: |
    `iter()` -> `&T`: borrows; the collection stays usable.
    `iter_mut()` -> `&mut T`: mutably borrows; edit elements in place.
    `into_iter()` -> `T`: consumes, moving elements out (a `Vec` is gone after).
    On a `&Vec`/slice, `into_iter()` yields `&T` — you can't move out of a borrow.
  code: |
    let v = vec![1, 2, 3];
    let _refs: Vec<&i32> = v.iter().collect();        // borrow
    let mut owned = v.clone();
    for x in owned.iter_mut() { *x += 1; }            // mutate in place
    let _moved: Vec<i32> = v.into_iter().collect();   // consumes v
  source: "book §13.1"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Are iterator adaptors like `map` and `filter` evaluated immediately?
  answer: |
    No — they are lazy. Adaptors build a description and do no work until a
    CONSUMER drives them: `collect`, `sum`, `count`, `for`, `fold`, `find`, etc.
    A chain with no consumer does nothing (the compiler warns "unused iterator").
  source: "book §13.2"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Why does `collect()` often need a type annotation or turbofish?
  answer: |
    `collect` is generic over its output via `FromIterator`, so the compiler
    can't always tell what you want. Specify it via the binding type
    (`let v: Vec<_> = ...`) or turbofish (`.collect::<Vec<_>>()`).
  source: "std Iterator::collect"
  tags: [rust, iterators, concept]

- type: concept
  question: |
    What happens when you `collect` an iterator of `Result<T, E>` into
    `Result<Vec<T>, E>` (or `Option`)?
  answer: |
    It short-circuits: stops at the first `Err` and returns it; otherwise yields
    `Ok(all_values)`. The same works for `Option<Vec<T>>` (first `None` wins).
    Ideal for "parse/validate all or fail".
  source: "std FromIterator for Result"
  tags: [rust, iterators, concept, results]
