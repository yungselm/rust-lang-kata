    a.insert("x".to_string(), Progress::Complete);
    a.insert("y".to_string(), Progress::Complete);
    a.insert("z".to_string(), Progress::None);
    let mut b = HashMap::new();
    b.insert("p".to_string(), Progress::Complete);
    b.insert("q".to_string(), Progress::Some);
    let coll = vec![a, b];
    assert_eq!(count_collection_iterator(&coll, Progress::Complete), 3);
    assert_eq!(count_collection_iterator(&coll, Progress::Some), 1);
    assert_eq!(count_collection_iterator(&coll, Progress::None), 1);

- instruction: |
    Write `count_collection_iterator_flat(collection: &[HashMap<String, Progress>],
    value) -> usize` that counts matching values across all maps by FLATTENING the
    maps into one stream of values (`flat_map`), then filtering and counting.
  starter: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_collection_iterator_flat(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {

    }
  solution: |
    use std::collections::HashMap;

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Progress {
        None,
        Some,
        Complete,
    }

    fn count_collection_iterator_flat(
        collection: &[HashMap<String, Progress>],
        value: Progress,
    ) -> usize {
        collection
            .iter()
            .flat_map(HashMap::values)
            .filter(|&&v| v == value)
            .count()
    }
  notes: |
    `flat_map(HashMap::values)` turns the slice of maps into one flat stream of
    `&Progress`, so a single filter+count does the whole job — no inner helper.
  source: "Rustlings iterators5 · std Iterator::flat_map"
  tags: [rust, iterators, hashmap, rustlings]
  tests: |
    let mut a = HashMap::new();
    a.insert("x".to_string(), Progress::Complete);
    a.insert("y".to_string(), Progress::None);
    let mut b = HashMap::new();
    b.insert("p".to_string(), Progress::Complete);
    b.insert("q".to_string(), Progress::Complete);
    let coll = vec![a, b];
    assert_eq!(count_collection_iterator_flat(&coll, Progress::Complete), 3);
    assert_eq!(count_collection_iterator_flat(&coll, Progress::None), 1);

- instruction: |
    Write `capitalize_first(input: &str) -> String`: upper-case the first character
    and keep the rest unchanged; an empty string stays "".
    Example: "hello" -> "Hello".
  starter: |
    fn capitalize_first(input: &str) -> String {

    }
  solution: |
    fn capitalize_first(input: &str) -> String {
        let mut chars = input.chars();
        match chars.next() {
            None => String::new(),
            Some(first) => first.to_uppercase().to_string() + chars.as_str(),
        }
    }
  notes: |
    Pull the first `char` off the iterator with `next()`, upper-case it, then append
    the REST via `chars.as_str()` (the still-unconsumed tail of the iterator). `None`
    means the input was empty.
  source: "Rustlings iterators2 · std char::to_uppercase"
  tags: [rust, iterators, strings, rustlings]
  tests: |
    assert_eq!(capitalize_first("hello"), "Hello");
    assert_eq!(capitalize_first(""), "");
    assert_eq!(capitalize_first("a"), "A");

- type: concept
  question: |
    Why does `v.windows(2).map(|&w| w[0] + w[1])` fail with "the size for values
    of type `[i32]` cannot be known at compile time"?
  answer: |
    **Because `|&w|` tries to bind the pointee of `&[i32]` by value, making
    `w` a bare `[i32]`, which is unsized and can't be stored in a local.**

    `windows(2)` yields `&[i32]` — a reference to a slice. The pattern `|&w|`
    says "peel the reference and bind the pointee by value", which would make
    `w` a bare `[i32]`. But `[i32]` is unsized (`!Sized`): its length isn't
    part of the type, so the compiler can't store one in a local or move it.
    Keep the reference: write `|w|` (so `w: &[i32]`) and index through it —
    `w[0]` auto-derefs to a sized `i32` and the arithmetic is fine.
  source: "std slice::windows; std::marker::Sized"
  tags: [rust, iterators, sized, concept]

- type: concept
  question: |
    When can you use the reference-peeling closure pattern `|&x|` (binding the
    value behind the reference), and when does it fail?
  answer: |
    **You can only use `|&x|` to peel the reference when the pointee is
    `Sized`; over an unsized pointee like `[i32]` it fails to compile.**

    - `v.iter().map(|&x| ...)` over `&i32`: peeling binds `x: i32`. `i32` is sized,
      so this is fine (and idiomatic).
    - `v.windows(2).map(|&w| ...)` over `&[i32]`: peeling would bind `w: [i32]`, a
      bare slice — unsized -> compile error.
    The deciding factor is SIZEDNESS, not `Copy`: you can only move a pointee out
    by value if its size is known at compile time. A single `i32` qualifies; a
    slice `[i32]` does not.
  source: "std::marker::Sized"
  tags: [rust, iterators, sized, concept]

- type: concept
  question: |
    Safe default when you're unsure whether to peel the reference in a closure
    pattern (`|&x|` vs `|x|`)?
  answer: |
    **Don't destructure — write `|w|` (or `|x|`) and reach inside the
    reference (`w[0]`, `w.0`, `*x`, a method call) instead of peeling it.**

    Indexing, field access, and method calls auto-deref, so this works
    whether the item is a slice or a sized value, and it always compiles.
    Reach for `|&x|` deliberately only when the item is an obvious `&i32`
    / `&T: Copy` and you want the value directly. This single habit makes
    `windows`, `chunks`, and `iter` all correct.
  tags: [rust, iterators, concept]

- type: concept
  question: |
    Does the "you can only peel `&` in a pattern if the pointee is `Sized`" rule
    apply only to `.map()` closures, or more broadly?
  answer: |
    **It applies everywhere a pattern binds a value — `for` loops, `let`,
    `match` arms, function parameters, and closures — not just `.map()`.**

    A leading `&` in a pattern always means "match a reference and move the
    pointee out by value", which only works if that pointee is `Sized`.
    - `for &x in &nums {}` — pointee `i32`, sized -> OK.
    - `for &w in nums.windows(2) {}` — pointee `[i32]`, unsized -> ERROR (use
      `for w in ...` and index).
    - `let &x = &5;` works; `let &s = &v[..];` does not.
    Same rule, same fix everywhere: keep the reference (`w`, `x`) and reach inside.
  source: "std::marker::Sized"
  tags: [rust, iterators, sized, concept]
