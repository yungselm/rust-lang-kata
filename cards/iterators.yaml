- instruction: |
    Write `char_positions(s: &str) -> HashMap<char, usize>` mapping each char
    to the index of its LAST occurrence.
  starter: |
    use std::collections::HashMap;

    fn char_positions(s: &str) -> HashMap<char, usize> {

    }
  solution: |
    use std::collections::HashMap;

    fn char_positions(s: &str) -> HashMap<char, usize> {
        s.chars().enumerate().map(|(i, c)| (c, i)).collect()
    }
  notes: |
    An iterator of `(K, V)` tuples collects into a `HashMap`; later duplicate
    keys overwrite earlier ones, recording the last index.
