- instruction: |
    Product of Array Except Self. Write `product_except_self(nums: &[i32]) -> Vec<i32>`
    where output[i] is the product of all elements except nums[i]. No division.
    Example: [1, 2, 3, 4] -> [24, 12, 8, 6].
  starter: |
    fn product_except_self(nums: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn product_except_self(nums: &[i32]) -> Vec<i32> {
        let mut res = vec![1; nums.len()];
        let mut prefix = 1;
        for (r, &n) in res.iter_mut().zip(nums) {
            *r = prefix;
            prefix *= n;
        }
        let mut suffix = 1;
        for (r, &n) in res.iter_mut().rev().zip(nums.iter().rev()) {
            *r *= suffix;
            suffix *= n;
        }
        res
    }
  notes: |
    Two passes: first fill each slot with the product of everything to its LEFT,
    then multiply in the product of everything to its RIGHT (no division).
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Each slot is (product of everything to its <b>left</b>) &times; (product of everything to its <b>right</b>). One left-to-right sweep fills the prefixes, one right-to-left sweep multiplies in the suffixes &mdash; no division.</p>
      <div class="vz-flow"><span class="vz-step">sweep left &rarr; prefix products</span><span class="vz-arr">&rarr;</span><span class="vz-step">sweep right &rarr; &times; suffix products</span><span class="vz-arr">&rarr;</span><span class="vz-step win">each slot = left &times; right</span></div>
    </div>
    ===
    2-3 | Output starts all 1s; 'prefix' will accumulate the product to the left.
    <div class="vz"><div class="vz-lab">nums</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">4</span><span class="vz-ix">3</span></span></div></div><div class="vz"><div class="vz-lab">res (start)</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">3</span></span></div></div>
    ===
    4-7 | Left sweep: res[i] = product of everything to its left -> [1, 1, 2, 6].
    <div class="vz"><div class="vz-lab">after the left sweep</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">6</span><span class="vz-ix">3</span></span></div></div>
    ===
    8-12 | Right sweep: multiply in the product to the right -> [24, 12, 8, 6].
    <div class="vz"><div class="vz-lab">after the right sweep (answer)</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">24</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">12</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">8</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">6</span><span class="vz-ix">3</span></span></div></div>
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    assert_eq!(product_except_self(&[1, 2, 3, 4]), vec![24, 12, 8, 6]);
    assert_eq!(product_except_self(&[-1, 1, 0, -3, 3]), vec![0, 0, 9, 0, 0]);

- instruction: |
    Valid Sudoku. Write `is_valid_sudoku(board: &[[char; 9]; 9]) -> bool`: true if
    no row, column, or 3x3 box contains a duplicate digit '1'..='9' ('.' is empty).
    Only the filled cells are checked; the board need not be solvable.
  starter: |
    fn is_valid_sudoku(board: &[[char; 9]; 9]) -> bool {

    }
  solution: |
    fn is_valid_sudoku(board: &[[char; 9]; 9]) -> bool {
        let mut rows = [[false; 9]; 9];
        let mut cols = [[false; 9]; 9];
        let mut boxes = [[false; 9]; 9];
        for (r, row) in board.iter().enumerate() {
            for (c, &ch) in row.iter().enumerate() {
                if ch == '.' {
                    continue;
                }
                let d = ch as usize - '1' as usize;
                let b = (r / 3) * 3 + c / 3;
                if rows[r][d] || cols[c][d] || boxes[b][d] {
                    return false;
                }
                rows[r][d] = true;
                cols[c][d] = true;
                boxes[b][d] = true;
            }
        }
        true
    }
  notes: |
    Track which digits each row/column/box has seen with 9x9 boolean grids; the
    box index is `(r / 3) * 3 + c / 3`. One pass over the fixed 9x9 grid.
    Time O(rows*cols), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>A digit is illegal only if its <b>row, column, or 3&times;3 box</b> already contains it. Track the digits seen in each row/col/box and reject on the first repeat.</p>
      <div class="vz-flow"><span class="vz-step">each filled cell</span><span class="vz-arr">&rarr;</span><span class="vz-step">seen in row / col / box?</span><span class="vz-arr">&rarr;</span><span class="vz-step win">repeat &rarr; invalid</span></div>
    </div>
    ===
    2-4 | Seen-flags for each row, column, and 3x3 box.
    ===
    5-6 | Scan every cell.
    ===
    7-10 | Skip empty cells.
    ===
    11 | Compute which 3x3 box this cell is in.
    ===
    12-14 | Already seen in its row/col/box? Invalid.
    ===
    15 | Otherwise mark the digit seen in all three.
    ===
    16-21 | No conflicts found.
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    let board = [
        ['5', '3', '.', '.', '7', '.', '.', '.', '.'],
        ['6', '.', '.', '1', '9', '5', '.', '.', '.'],
        ['.', '9', '8', '.', '.', '.', '.', '6', '.'],
        ['8', '.', '.', '.', '6', '.', '.', '.', '3'],
        ['4', '.', '.', '8', '.', '3', '.', '.', '1'],
        ['7', '.', '.', '.', '2', '.', '.', '.', '6'],
        ['.', '6', '.', '.', '.', '.', '2', '8', '.'],
        ['.', '.', '.', '4', '1', '9', '.', '.', '5'],
        ['.', '.', '.', '.', '8', '.', '.', '7', '9'],
    ];
    assert!(is_valid_sudoku(&board));
    let mut bad = board;
    bad[0][0] = '8';
    assert!(!is_valid_sudoku(&bad));

- instruction: |
    Longest Consecutive Sequence. Write `longest_consecutive(nums: &[i32]) -> usize`:
    the length of the longest run of consecutive integers present (any order), in
    O(n).
    Example: [100, 4, 200, 1, 3, 2] -> 4 (the run 1,2,3,4).
  starter: |
    use std::collections::HashSet;

    fn longest_consecutive(nums: &[i32]) -> usize {

    }
  solution: |
    use std::collections::HashSet;

    fn longest_consecutive(nums: &[i32]) -> usize {
        let set: HashSet<i32> = nums.iter().copied().collect();
        let mut best = 0;
        for &n in &set {
            if !set.contains(&(n - 1)) {
                let mut cur = n;
                let mut len = 1;
                while set.contains(&(cur + 1)) {
                    cur += 1;
                    len += 1;
                }
                best = best.max(len);
            }
        }
        best
    }
  notes: |
    Only start counting from a run's smallest element (one with no `n - 1` in the
    set). Each element is visited at most twice despite the inner loop.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Put every value in a set, then only start counting a run from its <b>smallest</b> member (one with no n&minus;1 present) and walk upward. That way each run is measured once, giving O(n).</p>
      <div class="vz-flow"><span class="vz-step">all values in a set</span><span class="vz-arr">&rarr;</span><span class="vz-step">start where n&minus;1 is absent</span><span class="vz-arr">&rarr;</span><span class="vz-step">walk n+1, n+2, &hellip;</span><span class="vz-arr">&rarr;</span><span class="vz-step win">longest run</span></div>
    </div>
    ===
    4 | Put every value in a set for O(1) membership tests.
    <div class="vz"><div class="vz-lab">set</div><div class="vz-row"><span class="vz-lab">set</span><span class="vz-chip">100</span><span class="vz-chip">4</span><span class="vz-chip">200</span><span class="vz-chip">1</span><span class="vz-chip">3</span><span class="vz-chip">2</span></div></div>
    ===
    6-7 | Only start a run at a value whose n-1 is absent (here 1, since 0 is missing).
    <div class="vz"><div class="vz-lab">candidate run-starts</div><div class="vz-row"><span class="vz-lab">values</span><span class="vz-chip">1</span><span class="vz-chip">100</span><span class="vz-chip">200</span></div></div>
    ===
    10-14 | Walk upward 1 -> 2 -> 3 -> 4: the longest run has length 4.
    <div class="vz"><div class="vz-lab">the run</div><div class="vz-row"><span class="vz-lab">consecutive</span><span class="vz-chip win">1</span><span class="vz-chip win">2</span><span class="vz-chip win">3</span><span class="vz-chip win">4</span></div></div>
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    assert_eq!(longest_consecutive(&[100, 4, 200, 1, 3, 2]), 4);
    assert_eq!(longest_consecutive(&[0, 3, 7, 2, 5, 8, 4, 6, 0, 1]), 9);
    assert_eq!(longest_consecutive(&[]), 0);
