# NeetCode 150 — Arrays & Hashing. Original prompts; idiomatic, clippy-clean
# Rust; example tests run by `python check_cards.py`.
- instruction: |
    Contains Duplicate. Write `contains_duplicate(nums: &[i32]) -> bool`:
    return true if any value appears at least twice.
    Example: [1, 2, 3, 1] -> true; [1, 2, 3, 4] -> false.
  starter: |
    use std::collections::HashSet;

    fn contains_duplicate(nums: &[i32]) -> bool {

    }
  solution: |
    use std::collections::HashSet;

    fn contains_duplicate(nums: &[i32]) -> bool {
        let mut seen = HashSet::new();
        for &n in nums {
            if !seen.insert(n) {
                return true;
            }
        }
        false
    }
  notes: |
    `HashSet::insert` returns false if the value was already present, so a single
    pass detects a duplicate.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Have we already seen this number? Walk through once, remembering every value in a <b>set</b>; the first time a value is already present, it's a duplicate.</p>
      <div class="vz-flow"><span class="vz-step">scan the numbers</span><span class="vz-arr">&rarr;</span><span class="vz-step">add each to a 'seen' set</span><span class="vz-arr">&rarr;</span><span class="vz-step win">insert fails &rarr; duplicate</span></div>
    </div>
    ===
    4 | Make an empty set to remember values we've seen.
    ===
    5 | Walk the slice once.
    ===
    6-9 | insert returns false if n was already present -> a duplicate.
    ===
    10-11 | No insert ever failed, so there are no duplicates.
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    assert!(contains_duplicate(&[1, 2, 3, 1]));
    assert!(!contains_duplicate(&[1, 2, 3, 4]));
    assert!(!contains_duplicate(&[]));

- instruction: |
    Valid Anagram. Write `is_anagram(s: &str, t: &str) -> bool`: true if `t` is a
    rearrangement of `s` (same characters with the same counts).
    Example: ("anagram", "nagaram") -> true; ("rat", "car") -> false.
  starter: |
    use std::collections::HashMap;

    fn is_anagram(s: &str, t: &str) -> bool {

    }
  solution: |
    use std::collections::HashMap;

    fn is_anagram(s: &str, t: &str) -> bool {
        if s.len() != t.len() {
            return false;
        }
        let mut count_s: HashMap<u8, i32> = HashMap::new();
        let mut count_t: HashMap<u8, i32> = HashMap::new();
        for (a, b) in s.bytes().zip(t.bytes()) {
            *count_s.entry(a).or_insert(0) += 1;
            *count_t.entry(b).or_insert(0) += 1;
        }
        count_s == count_t
    }
  notes: |
    Count each byte of `s` and of `t`, then compare the two maps. The length check
    is REQUIRED: `zip` stops at the shorter string, so without it ("a","ab") would
    only compare the first byte and wrongly return true. Assumes ASCII/bytes (fine
    for the lowercase-letter inputs). Time O(n), Space O(1) (at most 26 keys).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Anagrams use the <b>same letters the same number of times</b>. Count the letters in each string and check the two tallies are equal.</p>
      <div class="vz-flow"><span class="vz-step">count letters of s</span><span class="vz-arr">&rarr;</span><span class="vz-step">count letters of t</span><span class="vz-arr">&rarr;</span><span class="vz-step win">tallies equal?</span></div>
    </div>
    ===
    4-6 | Different lengths can't be anagrams (also keeps zip honest).
    ===
    7-8 | Two tally maps, one per string.
    ===
    9-12 | Walk both strings together, counting each byte.
    ===
    13-14 | Equal tallies => same letters the same number of times.
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    assert!(is_anagram("anagram", "nagaram"));
    assert!(!is_anagram("rat", "car"));
    assert!(!is_anagram("a", "ab"));

- instruction: |
    Two Sum. Write `two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)>`
    returning the indices of the two numbers that add up to `target`, or None.
    Example: ([2, 7, 11, 15], 9) -> Some((0, 1)).
  starter: |
    use std::collections::HashMap;

    fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> {

    }
  solution: |
    use std::collections::HashMap;

    fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> {
        let mut seen: HashMap<i32, usize> = HashMap::new();
        for (i, &n) in nums.iter().enumerate() {
            if let Some(&j) = seen.get(&(target - n)) {
                return Some((j, i));
            }
            seen.insert(n, i);
        }
        None
    }
  notes: |
    One pass: for each number, check whether its complement was already seen.
    The map stores value -> index, giving O(n) instead of the O(n^2) brute force.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>For each number we need its partner <b>target &minus; n</b>. Remember the numbers we've passed in a map, so finding the partner is an instant lookup instead of a re-scan.</p>
      <div class="vz-flow"><span class="vz-step">for each n</span><span class="vz-arr">&rarr;</span><span class="vz-step">seen target &minus; n? (map)</span><span class="vz-arr">&rarr;</span><span class="vz-step win">yes &rarr; the two indices</span></div>
    </div>
    ===
    4 | A map from value -> the index where we saw it.
    ===
    5 | Scan each number with its index.
    ===
    6-8 | Was the complement target - n already seen? Return both indices.
    ===
    9-10 | Otherwise remember this number and move on.
    ===
    11-12 | No pair summed to target.
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    assert_eq!(two_sum(&[2, 7, 11, 15], 9), Some((0, 1)));
    assert_eq!(two_sum(&[3, 2, 4], 6), Some((1, 2)));
    assert_eq!(two_sum(&[3, 3], 6), Some((0, 1)));
    assert_eq!(two_sum(&[1, 2, 3], 100), None);

- instruction: |
    Group Anagrams. Write `group_anagrams(words: Vec<String>) -> Vec<Vec<String>>`
    grouping words that are anagrams of each other (lowercase a-z). Group order
    doesn't matter.
    Example: ["eat","tea","tan","ate","nat","bat"] -> [["eat","tea","ate"],
    ["tan","nat"], ["bat"]].
  starter: |
    use std::collections::HashMap;

    fn group_anagrams(words: Vec<String>) -> Vec<Vec<String>> {

    }
  solution: |
    use std::collections::HashMap;

    fn group_anagrams(words: Vec<String>) -> Vec<Vec<String>> {
        let mut groups: HashMap<[u8; 26], Vec<String>> = HashMap::new();
        for w in words {
            let mut key = [0u8; 26];
            for b in w.bytes() {
                key[(b - b'a') as usize] += 1;
            }
            groups.entry(key).or_default().push(w);
        }
        groups.into_values().collect()
    }
  notes: |
    The 26-letter count array is identical for anagrams, so it makes a perfect
    hash key without sorting each word. `into_values` consumes the map.
    Time O(n*k), Space O(n*k).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Anagrams share the same <b>letter-count signature</b>. Use that 26-letter signature as a map key and drop each word into its bucket.</p>
      <div class="vz-flow"><span class="vz-step">each word</span><span class="vz-arr">&rarr;</span><span class="vz-step">26-letter count key</span><span class="vz-arr">&rarr;</span><span class="vz-step">bucket by key</span><span class="vz-arr">&rarr;</span><span class="vz-step win">collect the buckets</span></div>
    </div>
    ===
    4 | Map a 26-letter count signature -> all words with it.
    ===
    5 | For each word...
    ===
    6-9 | ...build its letter-count signature.
    ===
    10-11 | Drop the word into the bucket for that signature.
    ===
    12-13 | The buckets are the anagram groups.
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    let mut got = group_anagrams(
        ["eat", "tea", "tan", "ate", "nat", "bat"]
            .iter()
            .map(|s| s.to_string())
            .collect(),
    );
    for g in &mut got {
        g.sort();
    }
    got.sort();
    assert_eq!(
        got,
        vec![
            vec!["ate".to_string(), "eat".to_string(), "tea".to_string()],
            vec!["bat".to_string()],
            vec!["nat".to_string(), "tan".to_string()],
        ]
    );

- instruction: |
    Top K Frequent Elements. Write `top_k_frequent(nums: &[i32], k: usize) -> Vec<i32>`
    returning the `k` most frequent values (any order; assume a clear top-k).
    Example: ([1,1,1,2,2,3], 2) -> [1, 2].
  starter: |
    use std::collections::HashMap;

    fn top_k_frequent(nums: &[i32], k: usize) -> Vec<i32> {

    }
  solution: |
    use std::collections::HashMap;

    fn top_k_frequent(nums: &[i32], k: usize) -> Vec<i32> {
        let mut counts: HashMap<i32, usize> = HashMap::new();
        for &n in nums {
            *counts.entry(n).or_insert(0) += 1;
        }
        let mut pairs: Vec<(i32, usize)> = counts.into_iter().collect();
        pairs.sort_by_key(|&(_, count)| std::cmp::Reverse(count));
        pairs.into_iter().take(k).map(|(n, _)| n).collect()
    }
  notes: |
    Count, then sort by frequency descending. `std::cmp::Reverse` flips the sort
    order without writing a custom comparator. (A bucket sort gives strict O(n).)
    Time O(n log n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Return the <b>k values that occur most often</b>. Count how often each value appears, rank the values by that count, then keep the top k &mdash; the only real work is <b>counting</b> (a hash map) and <b>ranking</b> (a sort).</p>
      <div class="vz-flow"><span class="vz-step">all numbers</span><span class="vz-arr">&rarr;</span><span class="vz-step">count each value</span><span class="vz-arr">&rarr;</span><span class="vz-step">sort by count &darr;</span><span class="vz-arr">&rarr;</span><span class="vz-step win">keep top k</span></div>
    </div>
    ===
    4-7 | Tally each value into a HashMap (entry(n).or_insert(0) += 1) — one pass, O(n).
    <div class="vz">
      <div class="vz-row"><span class="vz-lab">nums</span><span class="vz-cell">1</span><span class="vz-cell">1</span><span class="vz-cell">1</span><span class="vz-cell">2</span><span class="vz-cell">2</span><span class="vz-cell">3</span></div>
      <div class="vz-lab">counts</div>
      <div class="vz-bar"><span class="vz-k">1</span><i style="width:108px"></i><span>3</span></div>
      <div class="vz-bar"><span class="vz-k">2</span><i style="width:72px"></i><span>2</span></div>
      <div class="vz-bar"><span class="vz-k">3</span><i style="width:36px"></i><span>1</span></div>
    </div>
    ===
    8 | Collect the map into a Vec of (value, count); HashMap order is arbitrary.
    <div class="vz">
      <div class="vz-lab">pairs — arbitrary order</div>
      <div class="vz-row"><span class="vz-chip">3 ×1</span><span class="vz-chip">1 ×3</span><span class="vz-chip">2 ×2</span></div>
    </div>
    ===
    9 | Sort by count descending via Reverse(count) — the dominant O(n log n) step.
    <div class="vz">
      <div class="vz-lab">sorted by count, descending</div>
      <div class="vz-row"><span class="vz-chip">1 ×3</span><span class="vz-chip">2 ×2</span><span class="vz-chip">3 ×1</span></div>
    </div>
    ===
    10 | take(k) keeps the top k pairs, then map(|(n, _)| n) drops the counts -> [1, 2].
    <div class="vz">
      <div class="vz-lab">take(2) → values</div>
      <div class="vz-row"><span class="vz-chip win">1</span><span class="vz-chip win">2</span></div>
    </div>
  source: "NeetCode 150 · Arrays & Hashing"
  tags: [rust, neetcode, arrays-hashing]
  tests: |
    let mut got = top_k_frequent(&[1, 1, 1, 2, 2, 3], 2);
    got.sort();
    assert_eq!(got, vec![1, 2]);
    assert_eq!(top_k_frequent(&[7], 1), vec![7]);

- instruction: |
    Encode and Decode Strings. Write `encode(strs: &[String]) -> String` and
    `decode(s: &str) -> Vec<String>` so that decode(encode(v)) == v for any
    strings (which may contain any characters, including '#').
  starter: |
    fn encode(strs: &[String]) -> String {

    }

    fn decode(s: &str) -> Vec<String> {

    }
  solution: |
    fn encode(strs: &[String]) -> String {
        let mut out = String::new();
        for s in strs {
            out.push_str(&s.len().to_string());
            out.push('#');
            out.push_str(s);
        }
        out
    }

    fn decode(s: &str) -> Vec<String> {
        let bytes = s.as_bytes();
        let mut res = Vec::new();
        let mut i = 0;
        while i < bytes.len() {
            let mut j = i;
            while bytes[j] != b'#' {
                j += 1;
            }
            let len: usize = s[i..j].parse().unwrap();
            let start = j + 1;
            res.push(s[start..start + len].to_string());
            i = start + len;
        }
        res
    }
  notes: |
    Length-prefix encoding ("4#neet5#code...") is robust to any delimiter inside
    the payload, because you read exactly `len` bytes rather than splitting.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Make decoding unambiguous by <b>length-prefixing</b> each string ("4#neet&hellip;"). You then read exactly that many bytes, so no character inside the data can be mistaken for a delimiter.</p>
      <div class="vz-flow"><span class="vz-step">each string</span><span class="vz-arr">&rarr;</span><span class="vz-step">write len # string</span><span class="vz-arr">&rarr;</span><span class="vz-step win">decode: read len, take len bytes</span></div>
    </div>
    ===
    1-9 | Encode: each string -> its length, then '#', then its bytes.
    <div class="vz"><div class="vz-lab">encode ["neet", "code"]</div><div class="vz-row"><span class="vz-chip">"neet"</span><span class="vz-chip">"code"</span></div><div class="vz-lab">length-prefixed buffer: len, then # , then the bytes</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch lenc">4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch hash">#</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">n</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">t</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch lenc">4</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch hash">#</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">c</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">o</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">d</span><span class="vz-ix">10</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">11</span></span></div></div>
    ===
    14-19 | Decode pass 1: i starts at 0; scan j forward to the next '#'.
    <div class="vz"><div class="vz-lab">pass 1 &mdash; i at the start, move j to the next #</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">i</span></span><span class="vz-ch lenc">4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">j</span></span><span class="vz-ch hash">#</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">n</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">t</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch lenc">4</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch hash">#</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">c</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">o</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">d</span><span class="vz-ix">10</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">11</span></span></div></div>
    ===
    20-23 | len = digits in s[i..j] = 4; take s[start..start+4] = "neet"; jump i to 6.
    <div class="vz"><div class="vz-lab">pass 1 &mdash; len = 4, take the 4 bytes after # , then i jumps to 6</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch lenc">4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch hash">#</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#4ec96a">s</span></span><span class="vz-ch take">n</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">e</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">e</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">t</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">i</span></span><span class="vz-ch lenc">4</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch hash">#</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">c</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">o</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">d</span><span class="vz-ix">10</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">11</span></span></div><div class="vz-row"><span class="vz-lab">result</span><span class="vz-chip win">"neet"</span></div></div>
    ===
    15-19 | Decode pass 2: now i = 6; scan j to the next '#'.
    <div class="vz"><div class="vz-lab">pass 2 &mdash; now i = 6, move j to the next #</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch lenc">4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch hash">#</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">n</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">t</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">i</span></span><span class="vz-ch lenc">4</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">j</span></span><span class="vz-ch hash">#</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">c</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">o</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">d</span><span class="vz-ix">10</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">e</span><span class="vz-ix">11</span></span></div></div>
