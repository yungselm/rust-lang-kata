# Vec<T> operations — building, accessing, mutating, sorting, slicing.
# Non-resizing params take &mut [i32] (clippy::ptr_arg); resizing ones keep &mut Vec.
- instruction: |
    Write `running_max(v: &[i32]) -> Vec<i32>` where element i is the maximum of
    v[0..=i]. Build the result by pushing.
  starter: |
    fn running_max(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn running_max(v: &[i32]) -> Vec<i32> {
        let mut out = Vec::new();
        let mut best = i32::MIN;
        for &x in v {
            best = best.max(x);
            out.push(best);
        }
        out
    }
  notes: |
    `push` is the tool for building a Vec whose elements you compute one at a
    time. (When you already know all the elements, use the `vec![]` macro
    instead — clippy's `vec_init_then_push` will remind you.)
  source: "std Vec::push"
  tags: [rust, vec]
  tests: |
    assert_eq!(running_max(&[1, 3, 2]), vec![1, 3, 3]);
    assert_eq!(running_max(&[-2, -5, -1]), vec![-2, -2, -1]);
    assert_eq!(running_max(&[7]), vec![7]);
    assert_eq!(running_max(&[]), Vec::<i32>::new());

- instruction: |
    Write `three_ones() -> Vec<i32>` returning [1, 1, 1] using the `vec!` macro.
  starter: |
    fn three_ones() -> Vec<i32> {

    }
  solution: |
    fn three_ones() -> Vec<i32> {
        vec![1; 3]
    }
  notes: |
    `vec![value; count]` repeats a value; `vec![1, 2, 3]` lists elements.
  source: "std vec! macro"
  tags: [rust, vec]
  tests: |
    assert_eq!(three_ones(), vec![1, 1, 1]);
    assert_eq!(three_ones().len(), 3);

- instruction: |
    Write `squares(n: usize) -> Vec<usize>` of 0^2..(n-1)^2, pre-allocating with
    `with_capacity`.
  starter: |
    fn squares(n: usize) -> Vec<usize> {

    }
  solution: |
    fn squares(n: usize) -> Vec<usize> {
        let mut v = Vec::with_capacity(n);
        for i in 0..n {
            v.push(i * i);
        }
        v
    }
  notes: |
    `with_capacity(n)` reserves space up front so the pushes don't reallocate.
  source: "std Vec::with_capacity"
  tags: [rust, vec]
  tests: |
    assert_eq!(squares(4), vec![0, 1, 4, 9]);
    assert_eq!(squares(1), vec![0]);
    assert_eq!(squares(0), Vec::<usize>::new());

- instruction: |
    Write `get_or(v: &[i32], i: usize) -> i32` returning the element at `i`, or
    -1 if out of bounds. Use the safe accessor.
  starter: |
    fn get_or(v: &[i32], i: usize) -> i32 {

    }
  solution: |
    fn get_or(v: &[i32], i: usize) -> i32 {
        v.get(i).copied().unwrap_or(-1)
    }
  notes: |
    `get(i)` returns `Option<&T>` (None if out of bounds) — unlike `v[i]`, which
    panics. `copied()` then `unwrap_or(-1)` gives a plain `i32`.
  source: "std slice::get"
  tags: [rust, vec, indexing]
  tests: |
    assert_eq!(get_or(&[10, 20, 30], 1), 20);
    assert_eq!(get_or(&[10, 20, 30], 3), -1);
    assert_eq!(get_or(&[], 0), -1);

- instruction: |
    Write `increment_all(v: &mut [i32])` adding 1 to every element in place.
  starter: |
    fn increment_all(v: &mut [i32]) {

    }
  solution: |
    fn increment_all(v: &mut [i32]) {
        for x in v.iter_mut() {
            *x += 1;
        }
    }
  notes: |
    Take `&mut [i32]`, not `&mut Vec`, when you only edit existing elements
    (clippy::ptr_arg). `iter_mut()` yields `&mut T`; write through with `*x`.
  source: "std slice::iter_mut"
  tags: [rust, vec, mutation]
  tests: |
    let mut v = vec![1, 2, 3];
    increment_all(&mut v);
    assert_eq!(v, vec![2, 3, 4]);
    let mut empty: Vec<i32> = Vec::new();
    increment_all(&mut empty);
    assert_eq!(empty, Vec::<i32>::new());

- instruction: |
    Write `pop_last(v: &mut Vec<i32>) -> Option<i32>` removing and returning the
    last element.
  starter: |
    fn pop_last(v: &mut Vec<i32>) -> Option<i32> {

    }
  solution: |
    fn pop_last(v: &mut Vec<i32>) -> Option<i32> {
        v.pop()
    }
  notes: |
    `pop()` is O(1) and returns `None` when empty. It changes the length, so the
    parameter is `&mut Vec`, not `&mut [_]`.
  source: "std Vec::pop"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2, 3];
    assert_eq!(pop_last(&mut v), Some(3));
    assert_eq!(v, vec![1, 2]);
    let mut empty: Vec<i32> = Vec::new();
    assert_eq!(pop_last(&mut empty), None);

- instruction: |
    Write `insert_front(v: &mut Vec<i32>, x: i32)` inserting `x` at the front.
  starter: |
    fn insert_front(v: &mut Vec<i32>, x: i32) {

    }
  solution: |
    fn insert_front(v: &mut Vec<i32>, x: i32) {
        v.insert(0, x);
    }
  notes: |
    `insert(i, x)` shifts everything after `i` right — O(n). For frequent
    front-insertion use a `VecDeque`.
  source: "std Vec::insert"
  tags: [rust, vec]
  tests: |
    let mut v = vec![2, 3];
    insert_front(&mut v, 1);
    assert_eq!(v, vec![1, 2, 3]);
    let mut empty = Vec::new();
    insert_front(&mut empty, 7);
    assert_eq!(empty, vec![7]);

- instruction: |
    Write `remove_at(v: &mut Vec<i32>, i: usize) -> i32` removing and returning
    the element at `i` (preserving order).
  starter: |
    fn remove_at(v: &mut Vec<i32>, i: usize) -> i32 {

    }
  solution: |
    fn remove_at(v: &mut Vec<i32>, i: usize) -> i32 {
        v.remove(i)
    }
  notes: |
    `remove(i)` shifts later elements left — O(n). Panics if `i` is out of bounds.
  source: "std Vec::remove"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2, 3, 4];
    assert_eq!(remove_at(&mut v, 1), 2);
    assert_eq!(v, vec![1, 3, 4]);
    let mut single = vec![9];
    assert_eq!(remove_at(&mut single, 0), 9);
    assert_eq!(single, Vec::<i32>::new());

- instruction: |
    Write `swap_remove_at(v: &mut Vec<i32>, i: usize) -> i32` removing element
    `i` in O(1) (order may change).
  starter: |
    fn swap_remove_at(v: &mut Vec<i32>, i: usize) -> i32 {

    }
  solution: |
    fn swap_remove_at(v: &mut Vec<i32>, i: usize) -> i32 {
        v.swap_remove(i)
    }
  notes: |
    `swap_remove` moves the LAST element into slot `i` and pops — O(1), but does
    not preserve order.
  source: "std Vec::swap_remove"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2, 3, 4];
    assert_eq!(swap_remove_at(&mut v, 0), 1);
    assert_eq!(v, vec![4, 2, 3]);
    let mut single = vec![9];
    assert_eq!(swap_remove_at(&mut single, 0), 9);
    assert!(single.is_empty());

- instruction: |
    Write `has(v: &[i32], x: i32) -> bool` testing membership.
  starter: |
    fn has(v: &[i32], x: i32) -> bool {

    }
  solution: |
    fn has(v: &[i32], x: i32) -> bool {
        v.contains(&x)
    }
  notes: |
    `contains` takes a reference and scans linearly — O(n). For repeated lookups
    prefer a `HashSet`.
  source: "std slice::contains"
  tags: [rust, vec]
  tests: |
    assert!(has(&[1, 2, 3], 2));
    assert!(!has(&[1, 2, 3], 5));
    assert!(!has(&[], 1));

- instruction: |
    Write `sorted(mut v: Vec<i32>) -> Vec<i32>` sorting ascending and returning.
  starter: |
    fn sorted(mut v: Vec<i32>) -> Vec<i32> {

    }
  solution: |
    fn sorted(mut v: Vec<i32>) -> Vec<i32> {
        v.sort();
        v
    }
  notes: |
    `sort()` sorts in place, O(n log n), stable. It returns `()`, not the vec — so
    `return v.sort()` is a type error (unit vs `Vec<i32>`); sort, then return `v` on
    the next line. Rust's in-place mutators (sort/push/reverse/retain/dedup/truncate
    …) all return `()`, never `Self`, so they don't chain. Taking `mut v` by value
    lets us mutate it and hand it back.
  source: "std slice::sort"
  tags: [rust, vec, sorting]
  tests: |
    assert_eq!(sorted(vec![3, 1, 2]), vec![1, 2, 3]);
    assert_eq!(sorted(vec![5]), vec![5]);
    assert_eq!(sorted(Vec::new()), Vec::<i32>::new());

- instruction: |
    Write `sort_by_abs(mut v: Vec<i32>) -> Vec<i32>` sorting by absolute value.
  starter: |
    fn sort_by_abs(mut v: Vec<i32>) -> Vec<i32> {

    }
  solution: |
    fn sort_by_abs(mut v: Vec<i32>) -> Vec<i32> {
        v.sort_by_key(|x| x.abs());
        v
    }
  notes: |
    `sort_by_key(f)` sorts by a derived key. For a full custom comparison use
    `sort_by(|a, b| ...)`. Like `sort`, it mutates in place and returns `()`, so
    sort then return `v` — not `return v.sort_by_key(...)`.
  source: "std slice::sort_by_key"
  tags: [rust, vec, sorting]
  tests: |
    assert_eq!(sort_by_abs(vec![-3, 1, 2]), vec![1, 2, -3]);
    assert_eq!(sort_by_abs(vec![-5, 4]), vec![4, -5]);
    assert_eq!(sort_by_abs(Vec::new()), Vec::<i32>::new());

- instruction: |
    Write `unique_sorted(mut v: Vec<i32>) -> Vec<i32>`: sorted with duplicates
    removed.
  starter: |
    fn unique_sorted(mut v: Vec<i32>) -> Vec<i32> {

    }
  solution: |
    fn unique_sorted(mut v: Vec<i32>) -> Vec<i32> {
        v.sort_unstable();
        v.dedup();
        v
    }
  notes: |
    `dedup()` removes CONSECUTIVE duplicates, so sort first. `sort_unstable` is a
    good default — faster, no allocation. Both mutate in place and return `()`, so
    apply them and then return `v`.
  source: "std Vec::dedup"
  tags: [rust, vec, sorting]
  tests: |
    assert_eq!(unique_sorted(vec![3, 1, 3, 2, 1]), vec![1, 2, 3]);
    assert_eq!(unique_sorted(vec![7]), vec![7]);
    assert_eq!(unique_sorted(Vec::new()), Vec::<i32>::new());

- instruction: |
    Write `keep_positive(v: &mut Vec<i32>)` removing all non-positive elements
    in place.
  starter: |
    fn keep_positive(v: &mut Vec<i32>) {

    }
  solution: |
    fn keep_positive(v: &mut Vec<i32>) {
        v.retain(|&x| x > 0);
    }
  notes: |
    `retain` keeps elements where the predicate is true, in one in-place pass.
    It changes the length, so `&mut Vec` is correct.
  source: "std Vec::retain"
  tags: [rust, vec, mutation]
  tests: |
    let mut v = vec![1, -2, 0, 3];
    keep_positive(&mut v);
    assert_eq!(v, vec![1, 3]);
    let mut all_neg = vec![-1, -2];
    keep_positive(&mut all_neg);
    assert_eq!(all_neg, Vec::<i32>::new());

- instruction: |
    Write `append_all(v: &mut Vec<i32>, more: &[i32])` appending copies of
    `more` onto `v`.
  starter: |
    fn append_all(v: &mut Vec<i32>, more: &[i32]) {

    }
  solution: |
    fn append_all(v: &mut Vec<i32>, more: &[i32]) {
        v.extend_from_slice(more);
    }
  notes: |
    `extend_from_slice` copies a whole slice onto the end. The general form is
    `extend(iter)` for any iterator.
  source: "std Vec::extend_from_slice"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2];
    append_all(&mut v, &[3, 4]);
    assert_eq!(v, vec![1, 2, 3, 4]);
    append_all(&mut v, &[]);
    assert_eq!(v, vec![1, 2, 3, 4]);

- instruction: |
    Write `ends(v: &[i32]) -> Option<(i32, i32)>` returning (first, last), or
    None if empty. Use `?` on `first`/`last`.
  starter: |
    fn ends(v: &[i32]) -> Option<(i32, i32)> {

    }
  solution: |
    fn ends(v: &[i32]) -> Option<(i32, i32)> {
        Some((*v.first()?, *v.last()?))
    }
  notes: |
    `first()`/`last()` return `Option<&T>`; `?` bails out with None on empty, and
    `*` copies the values out.
  source: "std slice::first / last"
  tags: [rust, vec, option]
  tests: |
    assert_eq!(ends(&[1, 2, 3]), Some((1, 3)));
    assert_eq!(ends(&[7]), Some((7, 7)));
    assert_eq!(ends(&[]), None);

- instruction: |
    Write `middle(v: &[i32]) -> &[i32]` returning the slice without its first
    and last elements.
  starter: |
    fn middle(v: &[i32]) -> &[i32] {

    }
  solution: |
    fn middle(v: &[i32]) -> &[i32] {
        &v[1..v.len() - 1]
    }
  notes: |
    Slicing `&v[a..b]` borrows a sub-range (no copy); the result borrows from the
    input. (Panics if `v.len() < 2` — guard in real code.)
  source: "std slice indexing"
  tags: [rust, vec, slices]
  tests: |
    assert_eq!(middle(&[1, 2, 3, 4]), [2, 3]);
    assert_eq!(middle(&[5, 6, 7]), [6]);
    assert!(middle(&[1, 2]).is_empty());

- instruction: |
    Write `swap_ends(v: &mut [i32])` swapping the first and last elements
    (do nothing if fewer than 2).
  starter: |
    fn swap_ends(v: &mut [i32]) {

    }
  solution: |
    fn swap_ends(v: &mut [i32]) {
        let n = v.len();
        if n >= 2 {
            v.swap(0, n - 1);
        }
    }
  notes: |
    `swap(i, j)` exchanges two elements by index in O(1). It's a slice method, so
    `&mut [i32]` is the right parameter.
  source: "std slice::swap"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2, 3, 4];
    swap_ends(&mut v);
    assert_eq!(v, vec![4, 2, 3, 1]);
    let mut single = vec![7];
    swap_ends(&mut single);
    assert_eq!(single, vec![7]);
    let mut empty: Vec<i32> = Vec::new();
    swap_ends(&mut empty);
    assert_eq!(empty, Vec::<i32>::new());

- instruction: |
    Write `reverse_in_place(v: &mut [i32])` reversing the slice in place.
  starter: |
    fn reverse_in_place(v: &mut [i32]) {

    }
  solution: |
    fn reverse_in_place(v: &mut [i32]) {
        v.reverse();
    }
  notes: |
    `reverse()` mutates in place. For a reversed COPY use
    `v.iter().rev().copied().collect()`.
  source: "std slice::reverse"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2, 3];
    reverse_in_place(&mut v);
    assert_eq!(v, vec![3, 2, 1]);
    let mut single = vec![7];
    reverse_in_place(&mut single);
    assert_eq!(single, vec![7]);

- instruction: |
    Write `find_sorted(v: &[i32], x: i32) -> Option<usize>`: index of `x` in a
    SORTED slice via binary search, or None.
  starter: |
    fn find_sorted(v: &[i32], x: i32) -> Option<usize> {

    }
  solution: |
    fn find_sorted(v: &[i32], x: i32) -> Option<usize> {
        v.binary_search(&x).ok()
    }
  notes: |
    `binary_search` is O(log n) but REQUIRES a sorted slice. It returns
    `Result<usize, usize>`; `.ok()` keeps only the found index.
  source: "std slice::binary_search"
  tags: [rust, vec, search]
  tests: |
    assert_eq!(find_sorted(&[1, 3, 5, 7], 5), Some(2));
    assert_eq!(find_sorted(&[1, 3, 5, 7], 4), None);
    assert_eq!(find_sorted(&[], 1), None);

- instruction: |
    Write `pairwise_sums(v: &[i32]) -> Vec<i32>`: sums of each adjacent pair
    (length n-1). e.g. [1, 2, 3, 4] -> [3, 5, 7].
  starter: |
    fn pairwise_sums(v: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn pairwise_sums(v: &[i32]) -> Vec<i32> {
        v.windows(2).map(|w| w[0] + w[1]).collect()
    }
  notes: |
    `windows(k)` yields OVERLAPPING sub-slices of length k (use `chunks(k)` for
    non-overlapping groups). Each item is `&[i32]`, so map with `|w|` and index
    through it (`w[0]`, `w[1]`) — do NOT write `|&w|`. That pattern tries to bind
    `w: [i32]` BY VALUE, but a bare slice `[i32]` is unsized (`!Sized`) and can't be
    moved out of the reference. (`|&x|` works on `&i32` only because `i32` is sized
    and `Copy`; a whole slice is neither.)
  source: "std slice::windows"
  tags: [rust, vec, slices]
  tests: |
    assert_eq!(pairwise_sums(&[1, 2, 3, 4]), vec![3, 5, 7]);
    assert_eq!(pairwise_sums(&[5]), Vec::<i32>::new());
    assert_eq!(pairwise_sums(&[]), Vec::<i32>::new());

- instruction: |
    Write `row_sums(v: &[i32], width: usize) -> Vec<i32>`: treat `v` as rows of
    `width` and sum each row.
  starter: |
    fn row_sums(v: &[i32], width: usize) -> Vec<i32> {

    }
  solution: |
    fn row_sums(v: &[i32], width: usize) -> Vec<i32> {
        v.chunks(width).map(|c| c.iter().sum()).collect()
    }
  notes: |
    `chunks(k)` yields non-overlapping groups (the last may be shorter).
  source: "std slice::chunks"
  tags: [rust, vec, slices]
  tests: |
    assert_eq!(row_sums(&[1, 2, 3, 4, 5, 6], 3), vec![6, 15]);
    assert_eq!(row_sums(&[1, 2, 3], 2), vec![3, 3]);
    assert_eq!(row_sums(&[], 2), Vec::<i32>::new());

- instruction: |
    Write `take_first_two(v: &mut Vec<i32>) -> Vec<i32>`: remove the first two
    elements and return them as a Vec.
  starter: |
    fn take_first_two(v: &mut Vec<i32>) -> Vec<i32> {

    }
  solution: |
    fn take_first_two(v: &mut Vec<i32>) -> Vec<i32> {
        v.drain(0..2).collect()
    }
  notes: |
    `drain(range)` removes a range and yields the removed items as an iterator,
    leaving the rest shifted down.
  source: "std Vec::drain"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2, 3, 4];
    assert_eq!(take_first_two(&mut v), vec![1, 2]);
    assert_eq!(v, vec![3, 4]);
    let mut exact = vec![5, 6];
    assert_eq!(take_first_two(&mut exact), vec![5, 6]);
    assert_eq!(exact, Vec::<i32>::new());

- instruction: |
    Write `cap_to(v: &mut Vec<i32>, n: usize)` shortening the Vec to at most `n`
    elements.
  starter: |
    fn cap_to(v: &mut Vec<i32>, n: usize) {

    }
  solution: |
    fn cap_to(v: &mut Vec<i32>, n: usize) {
        v.truncate(n);
    }
  notes: |
    `truncate(n)` drops elements past index n (no-op if already shorter). Related:
    `clear()` empties it, `resize(n, val)` sets the length to exactly n.
  source: "std Vec::truncate"
  tags: [rust, vec]
  tests: |
    let mut v = vec![1, 2, 3, 4];
    cap_to(&mut v, 2);
    assert_eq!(v, vec![1, 2]);
    let mut short = vec![1];
    cap_to(&mut short, 5);
    assert_eq!(short, vec![1]);

# --- concept cards ---
- type: concept
  question: |
    Why take `&[T]` instead of `&Vec<T>` (and `&mut [T]` instead of `&mut Vec<T>`)
    as a function parameter?
  answer: |
    `&[T]` is strictly more general: a `&Vec<T>`, an array, or any slice coerces
    to it. Take `&[T]` to read and `&mut [T]` to edit existing elements. Only
    take `&mut Vec<T>` when you must change the LENGTH (push, insert, remove,
    truncate). clippy::ptr_arg nudges you here.
  source: "clippy::ptr_arg / book §4.3"
  tags: [rust, vec, concept]

- type: concept
  question: |
    What does a `Vec<T>` store, and where does the data live?
  answer: |
    Three words: a pointer to a heap buffer, the length, and the capacity. That
    header sits on the stack (or inline in its owner); the elements live on the
    heap. Moving a Vec just copies the header.
  source: "book §8.1 / std Vec"
  tags: [rust, vec, concept]

- type: concept
  question: |
    Difference between `v[i]` and `v.get(i)`?
  answer: |
    `v[i]` yields the element directly but PANICS if out of bounds. `v.get(i)`
    returns `Option<&T>` (None when out of bounds) — the safe choice when the
    index might be invalid. (`get_mut` gives `Option<&mut T>`.)
  source: "std slice::get"
  tags: [rust, vec, concept]

- type: concept
  question: |
    Why must you usually `sort` before calling `dedup`?
  answer: |
    `dedup` only collapses CONSECUTIVE equal elements. Sorting brings equal
    values together, so dedup then yields fully unique elements. If you can't
    sort, dedup via a `HashSet` instead.
  source: "std Vec::dedup"
  tags: [rust, vec, concept]

- instruction: |
    Define `enum Cell { Int(i64), Text(String), Float(f64) }` so one `Vec` can hold
    mixed kinds of value, then write `sum_ints(row: &[Cell]) -> i64` summing only the
    `Int` cells.
    Example: [Int(3), Text("x"), Int(4)] -> 7.
  starter: |
    enum Cell {
        Int(i64),
        Text(String),
        Float(f64),
    }

    fn sum_ints(row: &[Cell]) -> i64 {

    }
  solution: |
    enum Cell {
        Int(i64),
        Text(String),
        Float(f64),
    }

    fn sum_ints(row: &[Cell]) -> i64 {
        row.iter()
            .filter_map(|cell| match cell {
                Cell::Int(n) => Some(*n),
                _ => None,
            })
            .sum()
    }
  notes: |
    A `Vec` is homogeneous, so to store different types together you wrap them in one
    enum — every element is a `Cell`, and you `match` to recover the specific kind.
    `filter_map` keeps only the `Int` payloads.
  source: "Rust Book §8.1 (using an enum to store multiple types)"
  tags: [rust, vec, enums]
  tests: |
    let row = vec![
        Cell::Int(3),
        Cell::Text("x".to_string()),
        Cell::Int(4),
        Cell::Float(1.5),
    ];
    assert_eq!(sum_ints(&row), 7);
