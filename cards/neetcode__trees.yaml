- instruction: |
    Construct Binary Tree from Preorder and Inorder. Write `build_tree(preorder:
    &[i32], inorder: &[i32]) -> Option<Box<TreeNode>>`: rebuild the tree from its
    preorder and inorder traversals (all values distinct).
    Example: preorder [3,9,20,15,7], inorder [9,3,15,20,7] -> 3(9,20(15,7)).
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn build_tree(preorder: &[i32], inorder: &[i32]) -> Option<Box<TreeNode>> {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn build_tree(preorder: &[i32], inorder: &[i32]) -> Option<Box<TreeNode>> {
        if preorder.is_empty() {
            return None;
        }
        let root_val = preorder[0];
        let mid = inorder.iter().position(|&v| v == root_val).unwrap();
        Some(Box::new(TreeNode {
            val: root_val,
            left: build_tree(&preorder[1..=mid], &inorder[..mid]),
            right: build_tree(&preorder[mid + 1..], &inorder[mid + 1..]),
        }))
    }
  notes: |
    The first preorder element is the root; its position in the inorder array
    splits the remaining nodes into the left and right subtrees, whose sizes then
    slice the preorder array. Recursion rebuilds each side.
    Time O(n^2), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Preorder's first value is the <b>root</b>; its position in the inorder array splits the left and right subtrees, which in turn slice the preorder array. Recurse.</p>
