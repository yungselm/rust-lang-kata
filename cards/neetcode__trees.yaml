- instruction: |
    Validate Binary Search Tree. Write `is_valid_bst(root:
    &Option<Box<TreeNode>>) -> bool`: true if every node's value is strictly
    greater than all values in its left subtree and strictly less than all in its
    right subtree.
    Example: 2(1,3) -> true; 5(1,4(3,6)) -> false.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_valid_bst(root: &Option<Box<TreeNode>>) -> bool {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_valid_bst(root: &Option<Box<TreeNode>>) -> bool {
        fn check(node: &Option<Box<TreeNode>>, lo: Option<i32>, hi: Option<i32>) -> bool {
            match node {
                None => true,
                Some(n) => {
                    if lo.is_some_and(|l| n.val <= l) || hi.is_some_and(|h| n.val >= h) {
                        return false;
                    }
                    check(&n.left, lo, Some(n.val)) && check(&n.right, Some(n.val), hi)
                }
            }
        }
        check(root, None, None)
    }
  notes: |
    Each node must lie within an open (lo, hi) range; descending left tightens the
    upper bound to the node's value, descending right tightens the lower bound.
    `Option<i32>` bounds avoid overflow at i32::MIN/MAX.
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Each node must fall inside an open <b>(lo, hi)</b> range. Going left tightens the upper bound to the node's value, going right tightens the lower bound.</p>
      <div class="vz-flow"><span class="vz-step">node inside (lo, hi)?</span><span class="vz-arr">&rarr;</span><span class="vz-step">go left &rarr; hi = node</span><span class="vz-arr">&rarr;</span><span class="vz-step">go right &rarr; lo = node</span><span class="vz-arr">&rarr;</span><span class="vz-step win">any violation &rarr; false</span></div>
