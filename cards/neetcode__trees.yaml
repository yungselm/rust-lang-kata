- instruction: |
    Lowest Common Ancestor of a BST. Write `lowest_common_ancestor(root:
    &Option<Box<TreeNode>>, p: i32, q: i32) -> i32`: return the value of the
    lowest node that is an ancestor of both `p` and `q`. Use the BST ordering.
    Example: BST 6(2(0,4),8(7,9)), p=2, q=8 -> 6.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn lowest_common_ancestor(
        root: &Option<Box<TreeNode>>,
        p: i32,
        q: i32,
    ) -> i32 {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn lowest_common_ancestor(
        root: &Option<Box<TreeNode>>,
        p: i32,
        q: i32,
    ) -> i32 {
        let mut cur = root;
        while let Some(node) = cur {
            if p < node.val && q < node.val {
                cur = &node.left;
            } else if p > node.val && q > node.val {
                cur = &node.right;
            } else {
                return node.val;
            }
        }
        unreachable!("p and q are guaranteed to be present in the BST")
    }
  notes: |
    Walk down: if both targets are smaller go left, if both are larger go right;
    the first node where they diverge (or one equals it) is the split point and
    thus the LCA. No recursion needed.
    Time O(h), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Use the BST order: if both targets are smaller go left, if both larger go right; the <b>first node where they split</b> (or equals one) is the lowest common ancestor.</p>
      <div class="vz-flow"><span class="vz-step">both &lt; node &rarr; go left</span><span class="vz-arr">&rarr;</span><span class="vz-step">both &gt; node &rarr; go right</span><span class="vz-arr">&rarr;</span><span class="vz-step win">they split &rarr; that's the LCA</span></div>
    </div>
