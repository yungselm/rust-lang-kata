- instruction: |
    Binary Tree Right Side View. Write `right_side_view(root:
    &Option<Box<TreeNode>>) -> Vec<i32>`: the values visible from the right, i.e.
    the last node at each depth.
    Example: 1(2(_,5),3(_,4)) -> [1, 3, 4].
  starter: |
    use std::collections::VecDeque;

    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn right_side_view(root: &Option<Box<TreeNode>>) -> Vec<i32> {

    }
  solution: |
    use std::collections::VecDeque;

    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn right_side_view(root: &Option<Box<TreeNode>>) -> Vec<i32> {
        let mut view = Vec::new();
        let mut queue: VecDeque<&TreeNode> = VecDeque::new();
        if let Some(node) = root {
            queue.push_back(node.as_ref());
        }
        while !queue.is_empty() {
            let count = queue.len();
            for i in 0..count {
                let node = queue.pop_front().unwrap();
                if i == count - 1 {
                    view.push(node.val);
                }
                if let Some(left) = &node.left {
                    queue.push_back(left.as_ref());
                }
                if let Some(right) = &node.right {
                    queue.push_back(right.as_ref());
                }
            }
        }
        view
    }
  notes: |
    BFS level by level; the last node dequeued on each level is the one seen from
    the right. Enqueueing left-then-right keeps that ordering.
