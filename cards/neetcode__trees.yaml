- instruction: |
    Count Good Nodes in Binary Tree. Write `good_nodes(root:
    &Option<Box<TreeNode>>) -> i32`: count nodes X such that no node on the path
    from the root to X has a value greater than X.
    Example: 3(1(3,_),4(1,5)) -> 4.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn good_nodes(root: &Option<Box<TreeNode>>) -> i32 {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn good_nodes(root: &Option<Box<TreeNode>>) -> i32 {
        fn dfs(node: &Option<Box<TreeNode>>, max_so_far: i32) -> i32 {
            match node {
                None => 0,
                Some(n) => {
                    let here = i32::from(n.val >= max_so_far);
                    let best = max_so_far.max(n.val);
                    here + dfs(&n.left, best) + dfs(&n.right, best)
                }
            }
        }
        match root {
            None => 0,
            Some(n) => dfs(root, n.val),
        }
    }
  notes: |
    Carry the maximum value seen on the path down the recursion; a node is "good"
    when it is at least that running max. Start the threshold at the root's own
    value so the root always counts.
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Carry the <b>maximum value seen on the path</b> from the root downward; a node is 'good' when it is at least that running max.</p>
