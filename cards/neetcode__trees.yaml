- instruction: |
    Binary Tree Level Order Traversal. Write `level_order(root:
    &Option<Box<TreeNode>>) -> Vec<Vec<i32>>`: the node values grouped by depth,
    top to bottom, left to right.
    Example: 3(9,20(15,7)) -> [[3], [9, 20], [15, 7]].
  starter: |
    use std::collections::VecDeque;

    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn level_order(root: &Option<Box<TreeNode>>) -> Vec<Vec<i32>> {

    }
  solution: |
    use std::collections::VecDeque;

    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn level_order(root: &Option<Box<TreeNode>>) -> Vec<Vec<i32>> {
        let mut levels = Vec::new();
        let mut queue: VecDeque<&TreeNode> = VecDeque::new();
        if let Some(node) = root {
            queue.push_back(node.as_ref());
        }
        while !queue.is_empty() {
            let mut level = Vec::with_capacity(queue.len());
            for _ in 0..queue.len() {
                let node = queue.pop_front().unwrap();
                level.push(node.val);
                if let Some(left) = &node.left {
                    queue.push_back(left.as_ref());
                }
                if let Some(right) = &node.right {
                    queue.push_back(right.as_ref());
                }
            }
            levels.push(level);
        }
        levels
    }
  notes: |
    Classic BFS: snapshot the queue length to know how many nodes are on the
    current level, then drain exactly that many before moving down.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>BFS with a queue; <b>snapshot the queue size</b> to know how many nodes are on the current level, drain exactly that many, then descend.</p>
      <div class="vz-flow"><span class="vz-step">queue starts with root</span><span class="vz-arr">&rarr;</span><span class="vz-step">process one level (queue size)</span><span class="vz-arr">&rarr;</span><span class="vz-step">enqueue children</span><span class="vz-arr">&rarr;</span><span class="vz-step win">collect per level</span></div>
    </div>
