- instruction: |
    Serialize and Deserialize Binary Tree. Write `serialize(root:
    &Option<Box<TreeNode>>) -> String` and `deserialize(s: &str) ->
    Option<Box<TreeNode>>` so that deserialize(serialize(t)) reproduces `t`.
    Example: round-trip on 1(2,3(4,5)).
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn serialize(root: &Option<Box<TreeNode>>) -> String {

    }

    fn deserialize(s: &str) -> Option<Box<TreeNode>> {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn serialize(root: &Option<Box<TreeNode>>) -> String {
        fn go(node: &Option<Box<TreeNode>>, out: &mut Vec<String>) {
            match node {
                None => out.push("#".to_string()),
                Some(n) => {
                    out.push(n.val.to_string());
                    go(&n.left, out);
                    go(&n.right, out);
                }
            }
        }
        let mut out = Vec::new();
        go(root, &mut out);
        out.join(",")
    }

    fn deserialize(s: &str) -> Option<Box<TreeNode>> {
        fn go<'a>(it: &mut impl Iterator<Item = &'a str>) -> Option<Box<TreeNode>> {
            let token = it.next()?;
            if token == "#" {
                return None;
            }
            Some(Box::new(TreeNode {
                val: token.parse().unwrap(),
                left: go(it),
                right: go(it),
            }))
        }
        go(&mut s.split(','))
    }
  notes: |
    Preorder with explicit "#" markers for null children uniquely encodes the
    tree. Deserializing consumes the comma-split tokens in the same preorder, so
    each call reconstructs a node then its left and right subtrees.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Preorder with an explicit <b>'#'</b> for null children uniquely encodes the tree. Deserializing consumes the same token stream in preorder, rebuilding node, then left, then right.</p>
      <div class="vz-flow"><span class="vz-step">preorder, # for null</span><span class="vz-arr">&rarr;</span><span class="vz-step">join into a string</span><span class="vz-arr">&rarr;</span><span class="vz-step">read tokens back in order</span><span class="vz-arr">&rarr;</span><span class="vz-step win">rebuild node, left, right</span></div>
    </div>
