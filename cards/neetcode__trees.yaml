  tags: [rust, neetcode, trees]
  tests: |
    fn leaf(val: i32) -> Option<Box<TreeNode>> {
        Some(Box::new(TreeNode { val, left: None, right: None }))
    }
    fn node(
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    ) -> Option<Box<TreeNode>> {
        Some(Box::new(TreeNode { val, left, right }))
    }
    let tree = node(1, leaf(2), node(3, leaf(4), leaf(5)));
    assert_eq!(deserialize(&serialize(&tree)), tree);
    assert_eq!(deserialize(&serialize(&None)), None);
    let single = leaf(-7);
    assert_eq!(deserialize(&serialize(&single)), single);
