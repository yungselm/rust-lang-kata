- instruction: |
    Binary Tree Maximum Path Sum. Write `max_path_sum(root:
    &Option<Box<TreeNode>>) -> i32`: the largest sum along any path (a sequence of
    connected nodes); a path need not pass through the root.
    Example: -10(9,20(15,7)) -> 42 (15+20+7).
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn max_path_sum(root: &Option<Box<TreeNode>>) -> i32 {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn max_path_sum(root: &Option<Box<TreeNode>>) -> i32 {
        // Returns the best downward path from `node`; updates `best` with the
        // best path that bends at `node`.
        fn dfs(node: &Option<Box<TreeNode>>, best: &mut i32) -> i32 {
            match node {
                None => 0,
                Some(n) => {
                    let left = dfs(&n.left, best).max(0);
                    let right = dfs(&n.right, best).max(0);
                    *best = (*best).max(n.val + left + right);
                    n.val + left.max(right)
                }
            }
        }
        let mut best = i32::MIN;
        dfs(root, &mut best);
        best
    }
  notes: |
    Each node returns the best straight-line path going down (clamping negative
    contributions to 0), while we separately track the best "bent" path that uses
    both children. The global best is the answer.
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Each node returns its best <b>downward</b> path (negative contributions clamped to 0), while we separately track the best 'bent' path that joins both children. The global best is the answer.</p>
      <div class="vz-flow"><span class="vz-step">best downward path per node</span><span class="vz-arr">&rarr;</span><span class="vz-step">clamp negatives to 0</span><span class="vz-arr">&rarr;</span><span class="vz-step">bend = val + left + right</span><span class="vz-arr">&rarr;</span><span class="vz-step win">track the global best</span></div>
