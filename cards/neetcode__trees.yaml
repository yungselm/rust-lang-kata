- instruction: |
    Same Tree. Write `is_same_tree(p: &Option<Box<TreeNode>>, q:
    &Option<Box<TreeNode>>) -> bool`: true if both trees have identical structure
    and node values.
    Example: 1(2,3) vs 1(2,3) -> true; 1(2,_) vs 1(_,2) -> false.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_same_tree(
        p: &Option<Box<TreeNode>>,
        q: &Option<Box<TreeNode>>,
    ) -> bool {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_same_tree(
        p: &Option<Box<TreeNode>>,
        q: &Option<Box<TreeNode>>,
    ) -> bool {
        match (p, q) {
            (None, None) => true,
            (Some(a), Some(b)) => {
                a.val == b.val
                    && is_same_tree(&a.left, &b.left)
                    && is_same_tree(&a.right, &b.right)
            }
            _ => false,
        }
    }
  notes: |
    Match the pair of nodes simultaneously: both empty is equal, both present
    requires equal values and equal subtrees, and a mismatch in presence is not.
    (`#[derive(PartialEq)]` would also work via `p == q`.)
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Compare the two trees <b>node-for-node</b>: both empty is equal; both present needs equal values and equal subtrees; anything else differs.</p>
      <div class="vz-flow"><span class="vz-step">compare the pair of nodes</span><span class="vz-arr">&rarr;</span><span class="vz-step">both empty &rarr; equal</span><span class="vz-arr">&rarr;</span><span class="vz-step">values + subtrees equal?</span><span class="vz-arr">&rarr;</span><span class="vz-step win">mismatch &rarr; false</span></div>
    </div>
