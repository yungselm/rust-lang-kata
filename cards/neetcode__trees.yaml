- instruction: |
    Kth Smallest Element in a BST. Write `kth_smallest(root:
    &Option<Box<TreeNode>>, k: i32) -> i32`: the k-th smallest value (1-indexed).
    Example: BST 3(1(_,2),4), k=1 -> 1.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn kth_smallest(root: &Option<Box<TreeNode>>, k: i32) -> i32 {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn kth_smallest(root: &Option<Box<TreeNode>>, k: i32) -> i32 {
        // In-order walk; decrement `remaining`, stop when it hits zero.
        fn walk(node: &Option<Box<TreeNode>>, remaining: &mut i32) -> Option<i32> {
            let n = node.as_ref()?;
            if let Some(found) = walk(&n.left, remaining) {
                return Some(found);
            }
            *remaining -= 1;
            if *remaining == 0 {
                return Some(n.val);
            }
            walk(&n.right, remaining)
        }
        let mut remaining = k;
        walk(root, &mut remaining).expect("k is within the tree size")
    }
  notes: |
    An in-order traversal of a BST yields values in sorted order, so the k-th
    visited node is the answer. A mutable counter lets us short-circuit as soon as
    it reaches zero.
    Time O(h + k), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>An <b>in-order</b> traversal of a BST visits values in sorted order, so the k-th node visited is the answer; stop as soon as a counter reaches k.</p>
      <div class="vz-flow"><span class="vz-step">in-order walk (sorted)</span><span class="vz-arr">&rarr;</span><span class="vz-step">count visited nodes</span><span class="vz-arr">&rarr;</span><span class="vz-step win">k-th visited &rarr; answer</span></div>
    </div>
