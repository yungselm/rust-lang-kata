- instruction: |
    Balanced Binary Tree. Write `is_balanced(root: &Option<Box<TreeNode>>) ->
    bool`: true if for every node the heights of its two subtrees differ by at
    most 1.
    Example: 3(9,20(15,7)) -> true.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_balanced(root: &Option<Box<TreeNode>>) -> bool {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_balanced(root: &Option<Box<TreeNode>>) -> bool {
        // Returns the height, or -1 if any subtree is unbalanced.
        fn height(node: &Option<Box<TreeNode>>) -> i32 {
            match node {
                None => 0,
                Some(n) => {
                    let lh = height(&n.left);
                    let rh = height(&n.right);
                    if lh == -1 || rh == -1 || (lh - rh).abs() > 1 {
                        -1
                    } else {
                        1 + lh.max(rh)
                    }
                }
            }
        }
        height(root) != -1
    }
  notes: |
    A bottom-up height function that returns the sentinel -1 the moment it sees an
    imbalance lets us short-circuit, versus recomputing heights at every node.
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Compute heights bottom-up, but return a sentinel <b>&minus;1</b> the instant a subtree is unbalanced so the whole check short-circuits.</p>
      <div class="vz-flow"><span class="vz-step">height of each subtree</span><span class="vz-arr">&rarr;</span><span class="vz-step">|left &minus; right| &gt; 1 &rarr; &minus;1</span><span class="vz-arr">&rarr;</span><span class="vz-step">propagate &minus;1 upward</span><span class="vz-arr">&rarr;</span><span class="vz-step win">never &minus;1 &rarr; balanced</span></div>
    </div>
