- instruction: |
    Diameter of Binary Tree. Write `diameter_of_binary_tree(root:
    &Option<Box<TreeNode>>) -> i32`: the number of edges on the longest path
    between any two nodes (need not pass through the root).
    Example: 1(2(4,5),3) -> 3.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn diameter_of_binary_tree(root: &Option<Box<TreeNode>>) -> i32 {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn diameter_of_binary_tree(root: &Option<Box<TreeNode>>) -> i32 {
        // Returns (height_in_edges, best_diameter) for the subtree.
        fn dfs(node: &Option<Box<TreeNode>>) -> (i32, i32) {
            match node {
                None => (0, 0),
                Some(n) => {
                    let (lh, ld) = dfs(&n.left);
                    let (rh, rd) = dfs(&n.right);
                    let height = 1 + lh.max(rh);
                    let diameter = (lh + rh).max(ld).max(rd);
                    (height, diameter)
                }
            }
        }
        dfs(root).1
    }
  notes: |
    For each node the longest path bending at it is left height + right height
    (in edges); the answer is the max over all nodes. One post-order pass returns
    both height and best-so-far.
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>The longest path that <b>bends at a node</b> is leftHeight + rightHeight (in edges). One post-order pass returns each subtree's height while tracking the best diameter seen.</p>
      <div class="vz-flow"><span class="vz-step">post-order: subtree heights</span><span class="vz-arr">&rarr;</span><span class="vz-step">bend = left h + right h</span><span class="vz-arr">&rarr;</span><span class="vz-step win">track the max over all nodes</span></div>
    </div>
