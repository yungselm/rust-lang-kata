- instruction: |
    Subtree of Another Tree. Write `is_subtree(root: &Option<Box<TreeNode>>, sub:
    &Option<Box<TreeNode>>) -> bool`: true if `sub` equals some subtree of `root`
    (same structure and values).
    Example: root 3(4(1,2),5), sub 4(1,2) -> true.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_subtree(
        root: &Option<Box<TreeNode>>,
        sub: &Option<Box<TreeNode>>,
    ) -> bool {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn is_subtree(
        root: &Option<Box<TreeNode>>,
        sub: &Option<Box<TreeNode>>,
    ) -> bool {
        match root {
            None => sub.is_none(),
            Some(node) => {
                root == sub
                    || is_subtree(&node.left, sub)
                    || is_subtree(&node.right, sub)
            }
        }
    }
  notes: |
    At each node, either the subtree rooted here equals `sub` (the derived
    `PartialEq` compares whole trees) or `sub` lives in a child. An empty `root`
    only matches an empty `sub`; in the worst case every node triggers a full
    subtree comparison.
    Time O(n * m), Space O(h).
  walkthrough: |
