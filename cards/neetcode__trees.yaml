- instruction: |
    Invert Binary Tree. Write `invert_tree(root: Option<Box<TreeNode>>) ->
    Option<Box<TreeNode>>`: swap the left and right child of every node.
    Example: 4(2(1,3),7) -> 4(7,2(3,1)).
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn invert_tree(root: Option<Box<TreeNode>>) -> Option<Box<TreeNode>> {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn invert_tree(root: Option<Box<TreeNode>>) -> Option<Box<TreeNode>> {
        root.map(|mut node| {
            let left = invert_tree(node.left.take());
            let right = invert_tree(node.right.take());
            node.left = right;
            node.right = left;
            node
        })
    }
  notes: |
    Take ownership, recurse on each subtree, then store them back swapped. Working
    by value lets us move boxes around without clones.
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Mirror the tree: at every node <b>swap its two children</b>, recursing into each side.</p>
      <div class="vz-flow"><span class="vz-step">at each node</span><span class="vz-arr">&rarr;</span><span class="vz-step">invert left &amp; right subtrees</span><span class="vz-arr">&rarr;</span><span class="vz-step win">swap the two children</span></div>
    </div>
  source: "NeetCode 150 · Trees"
  tags: [rust, neetcode, trees]
  tests: |
    fn leaf(val: i32) -> Option<Box<TreeNode>> {
        Some(Box::new(TreeNode { val, left: None, right: None }))
    }
    fn node(
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    ) -> Option<Box<TreeNode>> {
        Some(Box::new(TreeNode { val, left, right }))
    }
    let tree = node(4, node(2, leaf(1), leaf(3)), leaf(7));
    let want = node(4, leaf(7), node(2, leaf(3), leaf(1)));
    assert_eq!(invert_tree(tree), want);
    assert_eq!(invert_tree(None), None);

- instruction: |
    Maximum Depth of Binary Tree. Write `max_depth(root: &Option<Box<TreeNode>>)
    -> i32`: the number of nodes on the longest root-to-leaf path.
    Example: 3(9,20(15,7)) -> 3; empty -> 0.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn max_depth(root: &Option<Box<TreeNode>>) -> i32 {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct TreeNode {
        val: i32,
        left: Option<Box<TreeNode>>,
        right: Option<Box<TreeNode>>,
    }

    fn max_depth(root: &Option<Box<TreeNode>>) -> i32 {
        match root {
            None => 0,
            Some(node) => 1 + max_depth(&node.left).max(max_depth(&node.right)),
        }
    }
  notes: |
    Depth of a node is one plus the deeper of its two children; an empty tree has
    depth 0. Borrowing with `&Option<Box<...>>` avoids any cloning.
    Time O(n), Space O(h).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>A node's depth is <b>1 + the deeper of its two subtrees</b>; an empty tree is 0. Recurse.</p>
      <div class="vz-flow"><span class="vz-step">empty &rarr; 0</span><span class="vz-arr">&rarr;</span><span class="vz-step">depth = 1 + max(left, right)</span><span class="vz-arr">&rarr;</span><span class="vz-step win">recurse down</span></div>
    </div>
