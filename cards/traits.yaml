# --- concept cards ---
- type: concept
  question: |
    Difference between `impl Trait` (e.g. `fn f(x: &impl T)`) and `dyn Trait` (e.g.
    `Box<dyn T>`) — static vs dynamic dispatch?
  answer: |
    **`impl Trait` is static dispatch, monomorphized per concrete type at
    compile time; `dyn Trait` is dynamic dispatch, resolved at runtime
    through a vtable.**

    Static dispatch means zero overhead but one type per call site. Dynamic
    dispatch is slightly slower but lets a single collection hold different
    concrete types (`Vec<Box<dyn T>>`).
  source: "Rust Book §18.2"
  tags: [rust, traits, concept]

- type: concept
  question: |
    The orphan rule: when are you allowed to implement a trait for a type?
  answer: |
    **You may implement a trait for a type only if the trait or the type is
    local to your crate — at least one of the two must be yours.**

    You can't `impl ExternalTrait for ExternalType` — that "orphan" impl is
    forbidden so two crates can't write conflicting impls (coherence). Work
    around it with the newtype pattern (wrap the foreign type in your own
    struct).
  source: "Rust Book §10.2 (coherence / orphan rule)"
  tags: [rust, traits, concept]

- type: concept
  question: |
    What is a default method, and what can it do?
  answer: |
    **A default method is a trait method with a body, which implementors may
    use as-is (empty `impl` block) or override.**

    A default method may call the trait's other methods — including required
    ones the implementor must provide — letting a trait build rich behaviour
    on a small required surface.
  source: "Rust Book §10.2 (Default Implementations)"
  tags: [rust, traits, concept]

- type: concept
  question: |
    Associated type (like `Iterator::Item`) vs a generic trait parameter (like
    `Trait<T>`) — when do you use each?
  answer: |
    **Use an associated type when a type should implement the trait exactly
    once with one fixed output type; use a generic trait parameter when it
    may implement the trait many times with different parameters.**

    An associated type fixes ONE output type per impl: a type implements
    `Iterator` once, with one `Item`. A generic trait parameter lets a type
    implement the trait MANY times with different parameters (e.g.
    `From<i32>` and `From<&str>` on the same type).
  source: "Rust Book §20.x (Associated Types)"
  tags: [rust, traits, concept]

- type: concept
  question: |
    What does `#[derive(...)]` do, and which common std traits are derivable?
  answer: |
    **`#[derive(...)]` auto-generates the obvious field-by-field
    implementation of a trait; derivable std traits include `Debug`, `Clone`,
    `Copy`, `PartialEq`, `Eq`, `Hash`, `PartialOrd`, `Ord`, and `Default`.**

    For custom logic (e.g. case-insensitive equality) you write the `impl` by
    hand instead.
  source: "Rust Book Appendix C (Derivable Traits)"
  tags: [rust, traits, derive, concept]

- instruction: |
    Two traits `SomeTrait` and `OtherTrait` (each with a default method returning a
    bool) and two structs implementing both are given. Write
    `some_func(item: impl SomeTrait + OtherTrait) -> bool` returning whether BOTH
    methods return true — requiring the argument to implement both traits.
  starter: |
    trait SomeTrait {
        fn some_function(&self) -> bool {
            true
        }
    }

    trait OtherTrait {
        fn other_function(&self) -> bool {
            true
        }
    }

    struct SomeStruct;
    impl SomeTrait for SomeStruct {}
    impl OtherTrait for SomeStruct {}

    fn some_func(item: impl SomeTrait + OtherTrait) -> bool {

    }
  solution: |
    trait SomeTrait {
        fn some_function(&self) -> bool {
            true
        }
    }

    trait OtherTrait {
        fn other_function(&self) -> bool {
            true
        }
    }

    struct SomeStruct;
    impl SomeTrait for SomeStruct {}
    impl OtherTrait for SomeStruct {}

    fn some_func(item: impl SomeTrait + OtherTrait) -> bool {
        item.some_function() && item.other_function()
    }
  notes: |
    `impl SomeTrait + OtherTrait` requires the argument to implement BOTH traits, so
    the body may call methods from each. (Equivalent to `fn some_func<T: SomeTrait +
    OtherTrait>(item: T)`.)
  source: "Rustlings traits5 · Book §10.2 (multiple trait bounds)"
  tags: [rust, traits, rustlings]
  tests: |
    assert!(some_func(SomeStruct));

# --- Copy vs Clone (concept) ---
- type: concept
  question: |
    What is the difference between the `Copy` and `Clone` traits?
  answer: |
    **`Copy` is an implicit, always-cheap bitwise duplicate made automatically
    on move/assignment (you never call `.copy()`); `Clone` is an explicit,
    possibly expensive duplicate made by calling `.clone()`.**

    Every `Copy` type is also `Clone` (Copy requires Clone), but not the other
    way around.
  source: "Rust Book §4.1 / §10.2 (Copy & Clone)"
  tags: [rust, traits, concept]

- type: concept
  question: |
    Which kinds of types implement `Copy`?
  answer: |
    **Cheap, stack-only types implement `Copy`: integers, floats, `bool`,
    `char`, shared references `&T`, raw pointers, and fixed-size arrays
    `[T; N]` / tuples whose elements are all `Copy`.**

    Anything that owns a heap allocation is NOT `Copy`.
  source: "Rust Book §4.1 (Stack-Only Data: Copy)"
  tags: [rust, traits, concept]

- type: concept
  question: |
    Which common types own heap data, making them `Clone` but not `Copy`?
  answer: |
    **`String`, `Vec<T>`, `Box<T>`, the standard collections, and `Rc<T>`/
    `Arc<T>` all own heap data, so they're `Clone` but not `Copy`.**

    This also includes `HashMap`, `HashSet`, `BTreeMap`, `VecDeque`,
    `BinaryHeap`, and similar. Duplicating them must allocate (or, for
    Rc/Arc, bump a reference count), so it's explicit via `.clone()` rather
    than an automatic copy.
  source: "Rust Book §8 / §15 (owned heap types)"
  tags: [rust, traits, concept]

- type: concept
  question: |
    Why can't a type be both `Copy` and have a `Drop` impl (why does owning heap
    data rule out `Copy`)?
  answer: |
    **A bitwise `Copy` duplicate would create two owners of the same
    allocation that both try to free it on drop (a double-free), so Rust
    makes `Copy` and `Drop` mutually exclusive.**

    If dropping a value must free something, the type cannot be `Copy`.
  source: "Rust Book §4.1 / std::marker::Copy"
  tags: [rust, traits, concept]

- type: concept
  question: |
    On an `Option<&T>` (or an iterator of `&T`), what do `.copied()` and
    `.cloned()` do, and when do you use each?
  answer: |
    **Both `.copied()` and `.cloned()` reach THROUGH the reference to produce
    an owned value (`Option<&T>` -> `Option<T>`); `.copied()` requires `T:
    Copy`, `.cloned()` requires `T: Clone`.**

    This also applies to `Iterator<Item = &T>` -> `Item = T`. For example
    `.copied()` turns `&i32` into `i32`, while `.cloned()` turns `&String`
    into `String`. Prefer `.copied()` for cheap Copy types, `.cloned()`
    otherwise.
  code: |
    use std::collections::HashMap;
    let m: HashMap<String, i32> = HashMap::new();
    let _value: Option<i32> = m.get("k").copied();        // &i32 -> i32  (i32: Copy)
    let _keys: Vec<String> = m.keys().cloned().collect(); // &String -> String (Clone)
  source: "std Option::copied/cloned · Iterator::copied/cloned"
  tags: [rust, traits, concept]

- type: concept
  question: |
    Why does `m.get(key).clone()` (where `m: HashMap<String, i32>`) give
    `Option<&i32>` instead of the `Option<i32>` you wanted?
  answer: |
    **Because `.clone()` clones its receiver — the whole `Option<&i32>` — you
    get back another `Option<&i32>`, not the `Option<i32>` you wanted.**

    `get` returns `Option<&i32>`, and it just copies the inner `&i32` (since
    `&T` is `Copy`); it never dereferences to the `i32`. Use `.copied()` (or
    `.cloned()`), which reach through the reference to return an owned value.
  source: "std Option::clone vs copied"
  tags: [rust, traits, concept]

- instruction: |
    Implement `TryFrom<i32>` for `Age` (wrapping a `u8`) so values outside
    0..=150 fail with a `String` error instead of panicking or wrapping.
  starter: |
    struct Age(u8);

    impl TryFrom<i32> for Age {
        type Error = String;

    }
  solution: |
    struct Age(u8);

    impl TryFrom<i32> for Age {
        type Error = String;

        fn try_from(value: i32) -> Result<Self, Self::Error> {
            if (0..=150).contains(&value) {
                Ok(Age(value as u8))
            } else {
                Err(format!("{value} is not a valid age"))
            }
        }
    }
  notes: |
    `TryFrom` is the fallible sibling of `From`: pick an `Error` associated type
    and implement `try_from` returning a `Result`. Implementing it gives you
    `TryInto` for free, so `value.try_into()` also works — the same relationship
    `From`/`Into` have.
  source: "Rust Book §9.2 · std::convert::TryFrom"
  tags: [rust, traits, tryfrom]
  tests: |
    assert_eq!(Age::try_from(30).unwrap().0, 30);
    assert!(Age::try_from(-1).is_err());
    assert!(Age::try_from(200).is_err());
    let a: Result<Age, _> = 42.try_into();
    assert_eq!(a.unwrap().0, 42);

- instruction: |
    Define a trait `Double` with method `double(&self) -> Self`, and give it a
    single BLANKET impl covering every type that is `Copy` and can `Add` to
    itself (rather than implementing it per type).
  starter: |
    trait Double {
        fn double(&self) -> Self;
    }

    // blanket impl here
  solution: |
    trait Double {
        fn double(&self) -> Self;
    }

    impl<T: Copy + std::ops::Add<Output = T>> Double for T {
        fn double(&self) -> Self {
            *self + *self
        }
    }
  notes: |
    A blanket impl (`impl<T: Bound> Trait for T`) implements a trait for EVERY
    type satisfying the bound, in one block — this is exactly how std gives
    every `Display` type a free `ToString` via
    `impl<T: Display> ToString for T`.
  source: "Rust Book §10.2 (blanket implementations) · std ToString"
  tags: [rust, traits, blanket-impl]
  tests: |
    assert_eq!(3i32.double(), 6);
    assert!((1.5f64.double() - 3.0).abs() < 1e-9);

- instruction: |
    Implement `Ord` (and `PartialOrd` in terms of it) for `Priority` (wrapping a
    `u8`) so values compare by their inner number, then sort a `Vec<Priority>`.
  starter: |
    #[derive(PartialEq, Eq, Debug)]
    struct Priority(u8);

    impl PartialOrd for Priority {

    }

    impl Ord for Priority {

    }
  solution: |
    #[derive(PartialEq, Eq, Debug)]
    struct Priority(u8);

    impl PartialOrd for Priority {
        fn partial_cmp(&self, other: &Self) -> Option<std::cmp::Ordering> {
            Some(self.cmp(other))
        }
    }

    impl Ord for Priority {
        fn cmp(&self, other: &Self) -> std::cmp::Ordering {
            self.0.cmp(&other.0)
        }
    }
  notes: |
    Idiomatic order when a type has a total ordering: implement `Ord::cmp` with
    the real comparison logic, then implement `PartialOrd::partial_cmp` as
    `Some(self.cmp(other))`. This unlocks `.sort()`, `.max()`/`.min()`, and
    `<`/`>` — usually you'd just `#[derive(PartialOrd, Ord)]`, but a manual impl
    is needed when ordering isn't simple field order.
  source: "Rust Book §10.2 · std::cmp::Ord"
  tags: [rust, traits, ord]
  tests: |
    let mut v = vec![Priority(3), Priority(1), Priority(2)];
    v.sort();
    assert_eq!(v, vec![Priority(1), Priority(2), Priority(3)]);
    assert!(Priority(1) < Priority(2));
    assert_eq!(Priority(5).max(Priority(2)), Priority(5));
