  tags: [rust, traits]
  tests: |
    assert_eq!(Robot.hello(), "hi");

- instruction: |
    Add a `#[derive(...)]` attribute so `Color` can be debug-printed (`{:?}`),
    cloned, and compared with `==`.
  starter: |
    struct Color {
        r: u8,
        g: u8,
        b: u8,
    }
  solution: |
    #[derive(Debug, Clone, PartialEq)]
    struct Color {
        r: u8,
        g: u8,
        b: u8,
    }
  notes: |
    `derive` auto-generates the obvious field-by-field impl. `Debug` enables
    `{:?}`, `Clone` enables `.clone()`, `PartialEq` enables `==`/`!=`.
  source: "Rust Book §10.2 / §5.2 (derivable traits) · Rustlings traits"
  tags: [rust, traits, derive]
  tests: |
    let c = Color { r: 1, g: 2, b: 3 };
    assert_eq!(c.clone(), c);
    assert_eq!(format!("{c:?}"), "Color { r: 1, g: 2, b: 3 }");
    assert_ne!(c, Color { r: 0, g: 0, b: 0 });

- instruction: |
    Implement `PartialEq` for `CiStr` (a wrapper around a `String`) so two values
    are equal when their contents match ignoring ASCII case.
    Example: CiStr("Hi") == CiStr("hi").
  starter: |
    struct CiStr(String);

    impl PartialEq for CiStr {

    }
  solution: |
    struct CiStr(String);

    impl PartialEq for CiStr {
        fn eq(&self, other: &Self) -> bool {
            self.0.eq_ignore_ascii_case(&other.0)
        }
    }
  notes: |
    Implement `PartialEq` by hand when equality isn't just field-by-field. You only
    write `eq`; `!=` comes from the default `ne`.
  source: "Rust Book §10.2 · std::cmp::PartialEq"
  tags: [rust, traits]
  tests: |
    assert!(CiStr("Hi".to_string()) == CiStr("hi".to_string()));
    assert!(CiStr("a".to_string()) != CiStr("b".to_string()));

- instruction: |
    Implement `From<i32>` for `Celsius` (a tuple struct wrapping an `i32`) so an
    integer can be converted into a `Celsius`.
  starter: |
    #[derive(PartialEq, Debug)]
    struct Celsius(i32);

    impl From<i32> for Celsius {

    }
  solution: |
    #[derive(PartialEq, Debug)]
    struct Celsius(i32);

    impl From<i32> for Celsius {
        fn from(value: i32) -> Self {
            Celsius(value)
        }
    }
  notes: |
    Implementing `From<T>` gives you `Into<U>` for free (so `20.into()` works), and
    it's what the `?` operator uses to convert error types.
  source: "Rust Book §10.2 / §9.2 · std::convert::From"
  tags: [rust, traits]
  tests: |
    assert_eq!(Celsius::from(20), Celsius(20));
    let c: Celsius = 20.into();
    assert_eq!(c, Celsius(20));

