- instruction: |
    Implement Trie (Prefix Tree). Build a `Trie` supporting `insert(&str)`,
    `search(&str) -> bool` (whole word present), and `starts_with(&str) -> bool`
    (any word has this prefix). Implement `new`, `insert`, `search`, `starts_with`.
    Example: insert "apple"; search "apple" -> true; search "app" -> false;
    starts_with "app" -> true.
  starter: |
