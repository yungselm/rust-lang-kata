  solution: |
    use std::collections::HashMap;

    #[derive(Default)]
    struct Trie {
        children: HashMap<char, Trie>,
        is_word: bool,
    }

    impl Trie {
        fn new() -> Self {
            Trie::default()
        }

        fn insert(&mut self, word: &str) {
            let mut node = self;
            for c in word.chars() {
                node = node.children.entry(c).or_default();
            }
            node.is_word = true;
        }

        fn find(&self, s: &str) -> Option<&Trie> {
            let mut node = self;
            for c in s.chars() {
                node = node.children.get(&c)?;
            }
            Some(node)
        }

        fn search(&self, word: &str) -> bool {
            self.find(word).is_some_and(|node| node.is_word)
        }

        fn starts_with(&self, prefix: &str) -> bool {
            self.find(prefix).is_some()
        }
    }
  notes: |
    Each node holds a child map keyed by character plus an `is_word` flag marking
    word ends. `insert` walks/creates nodes with `entry().or_default()`. A shared
    `find` helper walks the path; `search` also checks `is_word`, `starts_with`
    just needs the path to exist.
    Time O(L) per insert/search/starts_with where L = word length, Space O(total chars inserted).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Store the words in a <b>tree of characters</b>: each node has a child per next letter and an is_word flag. insert walks/creates the path, search walks it and checks is_word, starts_with just needs the path to exist.</p>
      <div class="vz-flow"><span class="vz-step">node = letter &rarr; child + is_word</span><span class="vz-arr">&rarr;</span><span class="vz-step">insert walks/creates the path</span><span class="vz-arr">&rarr;</span><span class="vz-step">search: path + is_word</span><span class="vz-arr">&rarr;</span><span class="vz-step win">starts_with: path exists</span></div>
    </div>
    ===
    14-21 | insert: walk/create a node per character, then mark the end as a word.
    ===
    22-29 | find: follow the path for a string, or None if it breaks.
    ===
    30-33 | search: the path exists AND its end is a word.
    ===
    34-37 | starts_with: the path just needs to exist.
  source: "NeetCode 150 · Tries"
  tags: [rust, neetcode, trie]
  tests: |
    let mut t = Trie::new();
    t.insert("apple");
    assert!(t.search("apple"));
    assert!(!t.search("app"));
    assert!(t.starts_with("app"));
    t.insert("app");
    assert!(t.search("app"));
    assert!(!t.search("apples"));
    assert!(!t.starts_with("b"));

- instruction: |
    Design Add and Search Words Data Structure. Build `WordDictionary` supporting
    `add_word(&str)` and `search(&str) -> bool`, where in a search query '.' matches
    any single character. Implement `new`, `add_word`, `search`.
    Example: add "bad","dad","mad"; search "pad" -> false; search ".ad" -> true;
    search "b.." -> true.
  starter: |
    use std::collections::HashMap;

    #[derive(Default)]
    struct WordDictionary {
        children: HashMap<char, WordDictionary>,
        is_word: bool,
    }

    impl WordDictionary {
        fn new() -> Self {

        }

        fn add_word(&mut self, word: &str) {

        }

        fn search(&self, word: &str) -> bool {

        }
    }
  solution: |
    use std::collections::HashMap;

    #[derive(Default)]
    struct WordDictionary {
        children: HashMap<char, WordDictionary>,
        is_word: bool,
    }

    impl WordDictionary {
        fn new() -> Self {
            WordDictionary::default()
        }

        fn add_word(&mut self, word: &str) {
            let mut node = self;
            for c in word.chars() {
                node = node.children.entry(c).or_default();
            }
            node.is_word = true;
        }

        fn search(&self, word: &str) -> bool {
            Self::search_from(self, &word.chars().collect::<Vec<char>>(), 0)
        }

        fn search_from(node: &WordDictionary, chars: &[char], i: usize) -> bool {
            if i == chars.len() {
                return node.is_word;
            }
            let c = chars[i];
            if c == '.' {
                node.children
                    .values()
                    .any(|child| Self::search_from(child, chars, i + 1))
            } else if let Some(child) = node.children.get(&c) {
                Self::search_from(child, chars, i + 1)
            } else {
                false
            }
        }
    }
  notes: |
    A trie with a recursive search. A concrete character follows the single matching
    edge; a '.' branches into every child and succeeds if any branch matches the
    rest. Worst case (all dots) the search visits many nodes.
    Time O(L) per add_word where L = word length; search O(L) for a plain word but up to O(number of nodes) with dots, Space O(total chars added).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Same trie, but the search <b>recurses</b>: a concrete letter follows its single edge, while '.' branches into every child and succeeds if any branch matches the rest.</p>
      <div class="vz-flow"><span class="vz-step">build a trie</span><span class="vz-arr">&rarr;</span><span class="vz-step">letter &rarr; follow that edge</span><span class="vz-arr">&rarr;</span><span class="vz-step">'.' &rarr; try every child</span><span class="vz-arr">&rarr;</span><span class="vz-step win">any branch matches?</span></div>
    </div>
    ===
    14-25 | add_word: the same trie insert as before.
    ===
    26-30 | Recursive search over the characters.
    ===
    31-34 | A '.' tries every child and succeeds if any branch matches the rest.
    ===
    35-41 | A concrete letter follows its single edge.
  source: "NeetCode 150 · Tries"
  tags: [rust, neetcode, trie]
  tests: |
    let mut d = WordDictionary::new();
    d.add_word("bad");
    d.add_word("dad");
    d.add_word("mad");
    assert!(!d.search("pad"));
    assert!(d.search("bad"));
    assert!(d.search(".ad"));
    assert!(d.search("b.."));
    assert!(d.search("...")); // three dots match any 3-letter word
    assert!(!d.search("....")); // no 4-letter words were added

- instruction: |
    Word Search II. Given an m x n board of characters and a list of words, return
    all words that can be formed by a path of adjacent (up/down/left/right) cells,
    using each cell at most once per word. Write
    `find_words(board: &[Vec<char>], words: &[String]) -> Vec<String>`.
    Example: board with "oath","eat" present among letters -> ["eat","oath"]
    (order doesn't matter).
  starter: |
    use std::collections::HashMap;

    fn find_words(board: &[Vec<char>], words: &[String]) -> Vec<String> {

    }
  solution: |
    use std::collections::HashMap;

    #[derive(Default)]
    struct Node {
        children: HashMap<char, Node>,
        word: Option<String>,
    }

    fn find_words(board: &[Vec<char>], words: &[String]) -> Vec<String> {
        // Build a trie of all words; store the full word at its end node.
        let mut root = Node::default();
        for w in words {
            let mut node = &mut root;
            for c in w.chars() {
                node = node.children.entry(c).or_default();
            }
            node.word = Some(w.clone());
        }

        if board.is_empty() || board[0].is_empty() {
            return Vec::new();
        }
        let rows = board.len();
        let cols = board[0].len();
        let mut grid: Vec<Vec<char>> = board.to_vec();
        let mut found = Vec::new();

        for r in 0..rows {
            for c in 0..cols {
                dfs(&mut grid, r, c, &mut root, &mut found);
            }
        }
        found
    }

    fn dfs(
        grid: &mut [Vec<char>],
        r: usize,
        c: usize,
        node: &mut Node,
        found: &mut Vec<String>,
    ) {
        let ch = grid[r][c];
        if ch == '#' {
            return;
        }
        let Some(next) = node.children.get_mut(&ch) else {
            return;
        };
        if let Some(word) = next.word.take() {
            found.push(word);
        }
        grid[r][c] = '#'; // mark visited
        let rows = grid.len();
        let cols = grid[0].len();
        if r + 1 < rows {
            dfs(grid, r + 1, c, next, found);
        }
        if r > 0 {
            dfs(grid, r - 1, c, next, found);
        }
        if c + 1 < cols {
            dfs(grid, r, c + 1, next, found);
        }
        if c > 0 {
            dfs(grid, r, c - 1, next, found);
        }
        grid[r][c] = ch; // restore
    }
  notes: |
    Put all words in a trie, then DFS from every cell, descending the trie in step
    with the board. Marking the cell '#' during recursion prevents reuse; `word.take`
    records a hit once and avoids duplicates. Searching all words together (rather
    than one at a time) shares prefixes and prunes dead branches early.
    Time O(m*n*4^L) where m*n = board cells and L = max word length, Space O(total chars in words).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Put <b>all</b> target words into one trie, then DFS the board descending the trie in lockstep. Marking cells visited prevents reuse, and shared prefixes prune dead branches early.</p>
      <div class="vz-flow"><span class="vz-step">all words &rarr; one trie</span><span class="vz-arr">&rarr;</span><span class="vz-step">DFS each cell down the trie</span><span class="vz-arr">&rarr;</span><span class="vz-step">mark visited, record hits</span><span class="vz-arr">&rarr;</span><span class="vz-step win">trie prunes dead paths</span></div>
    </div>
    ===
    11-27 | Build a trie of all the target words.
    ===
    28-46 | DFS from every board cell.
    ===
    47-49 | Descend the trie in step with the board; bail if no matching edge.
    ===
    50-52 | Hitting a word-end records it once.
    ===
    53-69 | Mark the cell visited during recursion, then restore it.
  source: "NeetCode 150 · Tries"
  tags: [rust, neetcode, trie]
  tests: |
    let board = vec![
        vec!['o', 'a', 'a', 'n'],
        vec!['e', 't', 'a', 'e'],
        vec!['i', 'h', 'k', 'r'],
        vec!['i', 'f', 'l', 'v'],
    ];
    let words = vec![
        "oath".to_string(),
        "pea".to_string(),
        "eat".to_string(),
        "rain".to_string(),
    ];
    let mut got = find_words(&board, &words);
    got.sort();
    assert_eq!(got, vec!["eat".to_string(), "oath".to_string()]);
    let empty: Vec<Vec<char>> = vec![];
    assert!(find_words(&empty, &words).is_empty());
    let single = vec![vec!['a']];
    let mut got2 = find_words(&single, &["a".to_string(), "b".to_string()]);
    got2.sort();
    assert_eq!(got2, vec!["a".to_string()]);
