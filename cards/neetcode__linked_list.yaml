- instruction: |
    Linked List Cycle. Detect whether a list contains a cycle. Because a
    `Box`-based list cannot form a cycle in safe Rust, the list is modeled as an
    adjacency table: `next[i]` is the index of node i's successor (or None), and
    `head` is the starting index. Write
    `has_cycle(next: &[Option<usize>], head: Option<usize>) -> bool` using Floyd's
    tortoise-and-hare. Example: next=[Some(1), Some(0)], head=Some(0) -> true.
  starter: |
    fn has_cycle(next: &[Option<usize>], head: Option<usize>) -> bool {

    }
  solution: |
    fn has_cycle(next: &[Option<usize>], head: Option<usize>) -> bool {
        let mut slow = head;
        let mut fast = head;
        while let Some(f) = fast {
            // Advance fast two steps; if it falls off, there is no cycle.
            fast = match next[f] {
                Some(f1) => next[f1],
                None => return false,
            };
            slow = next[slow.unwrap()];
            if slow == fast && slow.is_some() {
                return true;
            }
        }
        false
    }
  notes: |
    Floyd's algorithm: a slow pointer steps once, a fast pointer twice. If they ever
    coincide on a node, there is a cycle; if fast reaches the end, there is not.
    Indices model the links because safe `Box` lists can't be cyclic.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Floyd's tortoise &amp; hare: one pointer steps once, the other twice. If there's a cycle they must eventually land on the same node; if the fast one runs off the end, there isn't.</p>
      <div class="vz-flow"><span class="vz-step">slow +1, fast +2</span><span class="vz-arr">&rarr;</span><span class="vz-step">fast hits end &rarr; no cycle</span><span class="vz-arr">&rarr;</span><span class="vz-step win">slow == fast &rarr; cycle</span></div>
    </div>
