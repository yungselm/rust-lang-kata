      <div class="vz-lab">Core idea</div>
      <p>'nth from the end' is just index <b>len &minus; n</b> from the front. Collect the nodes so the length is known, drop that index, and relink.</p>
      <div class="vz-flow"><span class="vz-step">collect nodes (know len)</span><span class="vz-arr">&rarr;</span><span class="vz-step">drop index len &minus; n</span><span class="vz-arr">&rarr;</span><span class="vz-step win">relink the rest</span></div>
    </div>
