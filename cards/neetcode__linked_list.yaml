- instruction: |
    Find the Duplicate Number. An array of n+1 integers each in 1..=n contains
    exactly one value that repeats (possibly many times). Return it without
    modifying the array and in O(1) extra space. Write
    `find_duplicate(nums: &[i32]) -> i32` using Floyd's cycle detection.
    Example: [1, 3, 4, 2, 2] -> 2.
  starter: |
    fn find_duplicate(nums: &[i32]) -> i32 {

    }
  solution: |
    fn find_duplicate(nums: &[i32]) -> i32 {
        // Treat value as "next index"; the duplicate is the cycle's entrance.
        let mut slow = nums[0] as usize;
        let mut fast = nums[nums[0] as usize] as usize;
        while slow != fast {
            slow = nums[slow] as usize;
            fast = nums[nums[fast] as usize] as usize;
        }
        let mut a = 0usize;
        while a != slow {
            a = nums[a] as usize;
            slow = nums[slow] as usize;
        }
        a as i32
    }
  notes: |
    Following `i -> nums[i]` forms a linked structure whose cycle entrance is the
    duplicated value. Phase 1 finds a meeting point with tortoise-and-hare; phase 2
    walks one pointer from the start in lockstep to locate the entrance.
    Time O(n), Space O(1).
