- instruction: |
    Merge K Sorted Lists. Given a vector of sorted linked lists, merge them all into
    one sorted list. Write
    `merge_k_lists(lists: Vec<Option<Box<ListNode>>>) -> Option<Box<ListNode>>`.
    Example: [1->4->5, 1->3->4, 2->6] -> 1->1->2->3->4->4->5->6.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn merge_k_lists(
        lists: Vec<Option<Box<ListNode>>>,
    ) -> Option<Box<ListNode>> {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn merge_two(
        mut a: Option<Box<ListNode>>,
        mut b: Option<Box<ListNode>>,
    ) -> Option<Box<ListNode>> {
        let mut dummy = Box::new(ListNode { val: 0, next: None });
        let mut tail = &mut dummy;
        loop {
            match (a.as_ref(), b.as_ref()) {
                (Some(na), Some(nb)) => {
                    if na.val <= nb.val {
                        let mut node = a.take().unwrap();
                        a = node.next.take();
                        tail.next = Some(node);
                    } else {
                        let mut node = b.take().unwrap();
                        b = node.next.take();
                        tail.next = Some(node);
                    }
                    tail = tail.next.as_mut().unwrap();
                }
                _ => {
                    tail.next = a.or(b);
                    break;
                }
            }
        }
        dummy.next
    }

    fn merge_k_lists(
        mut lists: Vec<Option<Box<ListNode>>>,
    ) -> Option<Box<ListNode>> {
        if lists.is_empty() {
            return None;
        }
        // Pairwise merge until a single list remains: O(N log k).
        while lists.len() > 1 {
            let mut merged = Vec::with_capacity(lists.len().div_ceil(2));
            let mut iter = lists.into_iter();
            while let Some(first) = iter.next() {
                match iter.next() {
                    Some(second) => merged.push(merge_two(first, second)),
                    None => merged.push(first),
                }
            }
            lists = merged;
        }
        lists.into_iter().next().flatten()
    }
  notes: |
    Reuse the two-list merge and combine lists pairwise, halving the count each
    round. That gives O(N log k) total work for N nodes across k lists, beating the
    O(N k) of merging one at a time.
    Time O(N log k), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Reuse the two-list merge and combine the lists <b>pairwise</b>, halving the count each round &mdash; O(N log k) instead of merging them one at a time.</p>
      <div class="vz-flow"><span class="vz-step">merge lists in pairs</span><span class="vz-arr">&rarr;</span><span class="vz-step">halve the count each round</span><span class="vz-arr">&rarr;</span><span class="vz-step win">one list remains</span></div>
    </div>
    ===
    43-45 | Repeat until a single list remains.
    ===
    46-47 | Pair up the lists...
    ===
    48-51 | ...merge each pair with the two-list merge.
    ===
    52-53 | Halve the count each round (O(N log k)).
    ===
    54-55 | The lone remaining list is the answer.
  source: "NeetCode 150 · Linked List"
  tags: [rust, neetcode, linked-list]
  tests: |
    fn build(vals: &[i32]) -> Option<Box<ListNode>> {
        vals.iter()
            .rev()
            .fold(None, |next, &val| Some(Box::new(ListNode { val, next })))
    }
    let lists = vec![build(&[1, 4, 5]), build(&[1, 3, 4]), build(&[2, 6])];
    assert_eq!(
        merge_k_lists(lists),
        build(&[1, 1, 2, 3, 4, 4, 5, 6])
    );
    assert_eq!(merge_k_lists(vec![]), build(&[]));
    assert_eq!(merge_k_lists(vec![build(&[]), build(&[])]), build(&[]));
    assert_eq!(merge_k_lists(vec![build(&[1])]), build(&[1]));

- instruction: |
    Reverse Nodes in k-Group. Reverse the nodes of the list k at a time; if the
    final group has fewer than k nodes, leave it as is. Write
    `reverse_k_group(head: Option<Box<ListNode>>, k: i32) -> Option<Box<ListNode>>`.
    Example: (1->2->3->4->5, k=2) -> 2->1->4->3->5.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn reverse_k_group(
        head: Option<Box<ListNode>>,
        k: i32,
    ) -> Option<Box<ListNode>> {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn reverse_k_group(
        head: Option<Box<ListNode>>,
        k: i32,
    ) -> Option<Box<ListNode>> {
        if k <= 1 {
            return head;
        }
        let k = k as usize;
        // Detach all nodes into a vector for simple group-wise reversal.
        let mut nodes = Vec::new();
        let mut cur = head;
        while let Some(mut node) = cur {
            cur = node.next.take();
            nodes.push(node);
        }
        // Reverse each full chunk of k in place; leave the remainder.
        let full = nodes.len() / k * k;
        let mut i = 0;
        while i < full {
            nodes[i..i + k].reverse();
            i += k;
        }
        // Relink in the new order.
        let mut result = None;
        for mut node in nodes.into_iter().rev() {
            node.next = result;
            result = Some(node);
        }
        result
    }
  notes: |
    Owning the nodes in a `Vec` reduces k-group reversal to reversing fixed-size
    slices, dodging the borrow-checker gymnastics of in-place pointer surgery. Only
    complete groups are reversed (`len / k * k`).
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Owning the nodes in a Vec reduces k-group reversal to reversing <b>fixed-size slices</b>; reverse only the complete groups (len/k&middot;k) and leave the short remainder.</p>
      <div class="vz-flow"><span class="vz-step">collect nodes into a Vec</span><span class="vz-arr">&rarr;</span><span class="vz-step">reverse each full k-chunk</span><span class="vz-arr">&rarr;</span><span class="vz-step">leave the short tail</span><span class="vz-arr">&rarr;</span><span class="vz-step win">relink</span></div>
    </div>
    ===
    16-22 | Detach all nodes into a Vec.
    ===
    23-24 | How many nodes belong to complete groups of k.
    ===
    25-30 | Reverse each full k-sized slice in place.
    ===
    31 | Relink; the short remainder stays as-is.
    ===
    32-36 | The regrouped list.
  source: "NeetCode 150 · Linked List"
  tags: [rust, neetcode, linked-list]
  tests: |
    fn build(vals: &[i32]) -> Option<Box<ListNode>> {
        vals.iter()
            .rev()
            .fold(None, |next, &val| Some(Box::new(ListNode { val, next })))
    }
    assert_eq!(
        reverse_k_group(build(&[1, 2, 3, 4, 5]), 2),
        build(&[2, 1, 4, 3, 5])
    );
    assert_eq!(
        reverse_k_group(build(&[1, 2, 3, 4, 5]), 3),
        build(&[3, 2, 1, 4, 5])
    );
    assert_eq!(
        reverse_k_group(build(&[1, 2, 3, 4, 5]), 1),
        build(&[1, 2, 3, 4, 5])
    );
    assert_eq!(
        reverse_k_group(build(&[1, 2, 3, 4]), 2),
        build(&[2, 1, 4, 3])
    );
