- instruction: |
    LRU Cache. Design a fixed-capacity cache with O(1)-ish `get` and `put` that
    evicts the least-recently-used key when full. Implement `LRUCache` with
    `new(capacity: usize)`, `get(&mut self, key: i32) -> Option<i32>`, and
    `put(&mut self, key: i32, value: i32)`. Any access (get or put) marks a key as
    most recently used.
  starter: |
    use std::collections::HashMap;
    use std::collections::VecDeque;

    struct LRUCache {

    }

    impl LRUCache {
        fn new(capacity: usize) -> Self {

        }

        fn get(&mut self, key: i32) -> Option<i32> {

        }

        fn put(&mut self, key: i32, value: i32) {

        }
    }
  solution: |
    use std::collections::HashMap;
    use std::collections::VecDeque;

    struct LRUCache {
        capacity: usize,
        map: HashMap<i32, i32>,
        // Front = least recently used, back = most recently used.
        order: VecDeque<i32>,
    }

    impl LRUCache {
        fn new(capacity: usize) -> Self {
            LRUCache {
                capacity,
                map: HashMap::new(),
                order: VecDeque::new(),
            }
        }

        fn touch(&mut self, key: i32) {
            if let Some(pos) = self.order.iter().position(|&k| k == key) {
                self.order.remove(pos);
            }
            self.order.push_back(key);
        }

        fn get(&mut self, key: i32) -> Option<i32> {
            if let Some(&value) = self.map.get(&key) {
                self.touch(key);
                Some(value)
            } else {
                None
            }
        }

        fn put(&mut self, key: i32, value: i32) {
            if self.capacity == 0 {
                return;
            }
            self.map.insert(key, value);
            self.touch(key);
            if self.map.len() > self.capacity {
                if let Some(lru) = self.order.pop_front() {
                    self.map.remove(&lru);
                }
            }
        }
    }
  notes: |
    A `HashMap` holds key->value; a `VecDeque` tracks recency (front = oldest). Each
    access removes the key and re-pushes it to the back. Eviction pops the front.
    The `position`/`remove` scan is O(n); a true O(1) design needs an intrusive
    doubly linked list, which is awkward in safe Rust without an index-arena.
    Time O(n) per get/put (recency scan), Space O(capacity).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Keep the values in a map and the <b>recency</b> in a queue (front = oldest). Every access moves its key to the back; when over capacity, evict the front.</p>
      <div class="vz-flow"><span class="vz-step">map: key &rarr; value</span><span class="vz-arr">&rarr;</span><span class="vz-step">queue tracks recency</span><span class="vz-arr">&rarr;</span><span class="vz-step">touch &rarr; move to back</span><span class="vz-arr">&rarr;</span><span class="vz-step win">full &rarr; evict the front</span></div>
    </div>
    ===
    20-26 | touch: move a key to the back (most recently used).
    ===
    27-35 | get: read from the map and touch the key.
    ===
    36-41 | put: insert/update, then touch.
    ===
    42-48 | Over capacity -> evict the front (least recently used).
  source: "NeetCode 150 · Linked List"
  tags: [rust, neetcode, linked-list]
  tests: |
    let mut c = LRUCache::new(2);
    c.put(1, 1);
    c.put(2, 2);
    assert_eq!(c.get(1), Some(1)); // 1 is now most recent
    c.put(3, 3); // evicts 2 (least recent)
    assert_eq!(c.get(2), None);
    c.put(4, 4); // evicts 1
    assert_eq!(c.get(1), None);
    assert_eq!(c.get(3), Some(3));
