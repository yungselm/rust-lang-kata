- instruction: |
    Merge Two Sorted Lists. Given two sorted singly linked lists, merge them into
    one sorted list and return it. Write
    `merge_two_lists(a: Option<Box<ListNode>>, b: Option<Box<ListNode>>) -> Option<Box<ListNode>>`.
    Example: 1->2->4 and 1->3->4 -> 1->1->2->3->4->4.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn merge_two_lists(
        a: Option<Box<ListNode>>,
        b: Option<Box<ListNode>>,
    ) -> Option<Box<ListNode>> {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn merge_two_lists(
        mut a: Option<Box<ListNode>>,
        mut b: Option<Box<ListNode>>,
    ) -> Option<Box<ListNode>> {
        let mut dummy = Box::new(ListNode { val: 0, next: None });
        let mut tail = &mut dummy;
        loop {
            match (a.as_ref(), b.as_ref()) {
                (Some(na), Some(nb)) => {
                    if na.val <= nb.val {
                        let mut node = a.take().unwrap();
                        a = node.next.take();
                        tail.next = Some(node);
                    } else {
                        let mut node = b.take().unwrap();
                        b = node.next.take();
                        tail.next = Some(node);
                    }
                    tail = tail.next.as_mut().unwrap();
                }
                _ => {
                    tail.next = a.or(b);
                    break;
                }
            }
        }
        dummy.next
    }
  notes: |
    A dummy head lets `tail` always point at a real node, so appending is uniform.
    Detach the smaller node, move it onto the tail, advance. When one list empties,
    splice the remainder with `a.or(b)`.
    Time O(n + m), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Like merging two sorted piles: repeatedly append the <b>smaller</b> current head to a growing tail. A dummy head makes appending uniform; splice the leftover when one list empties.</p>
      <div class="vz-flow"><span class="vz-step">dummy head + tail</span><span class="vz-arr">&rarr;</span><span class="vz-step">append the smaller head</span><span class="vz-arr">&rarr;</span><span class="vz-step">advance that list</span><span class="vz-arr">&rarr;</span><span class="vz-step win">one empties &rarr; splice rest</span></div>
    </div>
    ===
    11-13 | A dummy head so appending is uniform; tail tracks the end.
    ===
    14-15 | While both lists have nodes...
    ===
    16-24 | ...detach the smaller head and append it.
    ===
    25-27 | Advance the tail.
    ===
    28-32 | One list emptied -> splice on the remainder.
    ===
    33-34 | Skip the dummy; return the merged list.
  source: "NeetCode 150 · Linked List"
  tags: [rust, neetcode, linked-list]
  tests: |
    fn build(vals: &[i32]) -> Option<Box<ListNode>> {
        vals.iter()
            .rev()
            .fold(None, |next, &val| Some(Box::new(ListNode { val, next })))
    }
    assert_eq!(
        merge_two_lists(build(&[1, 2, 4]), build(&[1, 3, 4])),
        build(&[1, 1, 2, 3, 4, 4])
    );
    assert_eq!(merge_two_lists(build(&[]), build(&[0])), build(&[0]));
    assert_eq!(merge_two_lists(build(&[]), build(&[])), build(&[]));

- instruction: |
    Reorder List. Given a list L0->L1->...->Ln, reorder it in place to
    L0->Ln->L1->Ln-1->L2->... . Write `reorder_list(head: &mut Option<Box<ListNode>>)`.
    Example: 1->2->3->4 becomes 1->4->2->3.
  starter: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn reorder_list(head: &mut Option<Box<ListNode>>) {

    }
  solution: |
    #[derive(PartialEq, Eq, Clone, Debug)]
    struct ListNode {
        val: i32,
        next: Option<Box<ListNode>>,
    }

    fn reorder_list(head: &mut Option<Box<ListNode>>) {
        // Detach all nodes into a vector to sidestep awkward in-place splicing.
        let mut nodes = Vec::new();
        let mut cur = head.take();
        while let Some(mut node) = cur {
            cur = node.next.take();
            nodes.push(node);
        }
        if nodes.is_empty() {
            return;
        }
        // Weave from both ends: front, back, front, back, ...
        let mut order: Vec<Box<ListNode>> = Vec::with_capacity(nodes.len());
        let mut lo = 0;
        let mut hi = nodes.len();
        let mut take_front = true;
        while lo < hi {
            if take_front {
                order.push(std::mem::replace(
                    &mut nodes[lo],
                    Box::new(ListNode { val: 0, next: None }),
                ));
                lo += 1;
            } else {
                hi -= 1;
                order.push(std::mem::replace(
                    &mut nodes[hi],
                    Box::new(ListNode { val: 0, next: None }),
                ));
            }
            take_front = !take_front;
        }
        // Relink in the woven order.
        let mut result = None;
        for mut node in order.into_iter().rev() {
            node.next = result;
            result = Some(node);
        }
        *head = result;
    }
  notes: |
    Owning each node in a `Vec` turns the two-pointer weave (front, back, front, ...)
    into simple indexing, avoiding the borrow-checker pain of reversing the second
    half in place. Relink by folding from the back.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>The target order weaves <b>front, back, front, back&hellip;</b>. Owning the nodes in a Vec turns that into simple two-pointer indexing, then relink in the woven order.</p>
      <div class="vz-flow"><span class="vz-step">collect nodes into a Vec</span><span class="vz-arr">&rarr;</span><span class="vz-step">weave front / back / front &hellip;</span><span class="vz-arr">&rarr;</span><span class="vz-step win">relink in that order</span></div>
    </div>
    ===
    9-14 | Detach every node into a Vec for two-ended indexing.
    <div class="vz"><div class="vz-lab">nodes</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">4</span><span class="vz-ix">3</span></span></div></div>
    ===
    23-38 | Weave: take front, then back, then front, then back -> 1, 4, 2, 3.
    <div class="vz"><div class="vz-lab">woven order</div><div class="vz-row"><span class="vz-lab">order</span><span class="vz-chip">1</span><span class="vz-chip">4</span><span class="vz-chip">2</span><span class="vz-chip">3</span></div></div>
    ===
    40-45 | Relink in that order -> 1 -> 4 -> 2 -> 3.
    <div class="vz"><div class="vz-lab">result</div><div class="vz-row"><span class="vz-lab">reordered</span><span class="vz-chip win">1</span><span class="vz-chip win">4</span><span class="vz-chip win">2</span><span class="vz-chip win">3</span></div></div>
