- instruction: |
    Search in Rotated Sorted Array. An ascending array of distinct values was
    rotated. Write `search_rotated(nums: &[i32], target: i32) -> Option<usize>`:
    the index of `target`, or None, in O(log n).
    Example: ([4, 5, 6, 7, 0, 1, 2], 0) -> Some(4); ([..], 3) -> None.
  starter: |
    fn search_rotated(nums: &[i32], target: i32) -> Option<usize> {

    }
  solution: |
    fn search_rotated(nums: &[i32], target: i32) -> Option<usize> {
        let mut lo = 0;
        let mut hi = nums.len();
        while lo < hi {
            let mid = lo + (hi - lo) / 2;
            if nums[mid] == target {
                return Some(mid);
            }
            if nums[lo] <= nums[mid] {
                if nums[lo] <= target && target < nums[mid] {
                    hi = mid;
                } else {
                    lo = mid + 1;
                }
            } else if nums[mid] < target && target <= nums[hi - 1] {
                lo = mid + 1;
            } else {
                hi = mid;
            }
        }
        None
    }
  notes: |
    One half of [lo, hi) is always sorted. Decide which by comparing nums[lo] to
    nums[mid], then check whether the target falls inside that sorted half to pick
    a side.
    Time O(log n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Even rotated, at least one half [lo,mid] or [mid,hi] is still sorted. Work out which, check whether the target falls inside that sorted half, and recurse into the right side.</p>
      <div class="vz-flow"><span class="vz-step">find the sorted half</span><span class="vz-arr">&rarr;</span><span class="vz-step">target inside it?</span><span class="vz-arr">&rarr;</span><span class="vz-step">yes &rarr; search there</span><span class="vz-arr">&rarr;</span><span class="vz-step win">else &rarr; the other half</span></div>
    </div>
    ===
    2-5 | Binary search, but the array is rotated.
    <div class="vz"><div class="vz-lab">lo / mid / hi</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">6</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#c586c0">mid</span></span><span class="vz-ch">7</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">0</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">2</span><span class="vz-ix">6</span></span></div></div>
    ===
    9-13 | Left half [lo..mid] is sorted (4..7); target 0 isn't in it -> go right.
    <div class="vz"><div class="vz-lab">search the right half</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">6</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">7</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch take">0</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#c586c0">mid</span></span><span class="vz-ch take">1</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">2</span><span class="vz-ix">6</span></span></div></div>
    ===
