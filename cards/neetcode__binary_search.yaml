    ===
    6-7 | mid=4, nums[4]=9 = target -> found at index 4.
    <div class="vz"><div class="vz-lab">found</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">0</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#4ec96a">mid</span></span><span class="vz-ch take">9</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">12</span><span class="vz-ix">5</span></span></div></div>
