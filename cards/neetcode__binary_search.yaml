    8-12 | mid=6 -> matrix[1][2]=16 > 3 -> search the left half.
    <div class="vz"><div class="vz-lab">go left</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch take">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">3</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">5</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">7</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">10</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">11</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#c586c0">mid</span></span><span class="vz-ch">16</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">20</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">23</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">30</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">34</span><span class="vz-ix">10</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">60</span><span class="vz-ix">11</span></span></div></div>
