- instruction: |
    Koko Eating Bananas. Piles of bananas and `h` hours; at speed k bananas/hour
    Koko eats from one pile per hour (taking ceil(pile/k) hours per pile). Write
    `min_eating_speed(piles: &[i32], h: i32) -> i32`: the smallest k that finishes
    within h hours.
    Example: piles [3, 6, 7, 11], h 8 -> 4.
  starter: |
    fn min_eating_speed(piles: &[i32], h: i32) -> i32 {

    }
  solution: |
    fn min_eating_speed(piles: &[i32], h: i32) -> i32 {
        let hours_at = |k: i64| -> i64 {
            piles.iter().map(|&p| (p as i64 + k - 1) / k).sum()
        };
        let mut lo: i64 = 1;
        let mut hi: i64 = *piles.iter().max().unwrap() as i64;
        while lo < hi {
            let mid = lo + (hi - lo) / 2;
            if hours_at(mid) <= h as i64 {
                hi = mid;
            } else {
                lo = mid + 1;
            }
        }
        lo as i32
    }
  notes: |
    Binary-search the answer over speeds 1..=max(pile). Hours needed is monotonic
    in k, so find the smallest k whose total hours fit. `(p + k - 1) / k` is the
    ceiling division.
    Time O(n log(max pile)), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Hours needed only <b>shrink as the speed grows</b>, so the answer is monotonic. Binary-search the speed and pick the smallest one that still finishes within h hours.</p>
      <div class="vz-flow"><span class="vz-step">speeds 1 .. max pile</span><span class="vz-arr">&rarr;</span><span class="vz-step">mid speed: hours &le; h?</span><span class="vz-arr">&rarr;</span><span class="vz-step">yes &rarr; try slower</span><span class="vz-arr">&rarr;</span><span class="vz-step win">smallest feasible speed</span></div>
    </div>
    ===
    5-6 | Binary-search the eating speed between 1 and the max pile = 11.
    <div class="vz"><div class="vz-lab">candidate speeds (bananas/hour)</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">4</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">6</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">7</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">8</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">9</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">10</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">11</span><span class="vz-ix">10</span></span></div></div>
    ===
    8-12 | speed 6 finishes in 6 h <= 8 -> feasible, so try slower (hi = mid).
    <div class="vz"><div class="vz-lab">feasible -> go slower</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">4</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#c586c0">mid</span></span><span class="vz-ch">6</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">7</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">8</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">9</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">10</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">11</span><span class="vz-ix">10</span></span></div></div>
    ===
    8-12 | speed 3 needs 10 h > 8 -> too slow (lo = mid+1).
    <div class="vz"><div class="vz-lab">too slow -> go faster</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#c586c0">mid</span></span><span class="vz-ch">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">4</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">6</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">7</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">8</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">9</span><span class="vz-ix">8</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">10</span><span class="vz-ix">9</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">11</span><span class="vz-ix">10</span></span></div></div>
