- instruction: |
    Median of Two Sorted Arrays. Given two ascending slices, write
    `find_median_sorted_arrays(a: &[i32], b: &[i32]) -> f64`: the median of all
    values combined.
    Example: ([1, 3], [2]) -> 2.0; ([1, 2], [3, 4]) -> 2.5.
  starter: |
    fn find_median_sorted_arrays(a: &[i32], b: &[i32]) -> f64 {

    }
  solution: |
    fn find_median_sorted_arrays(a: &[i32], b: &[i32]) -> f64 {
        let total = a.len() + b.len();
        let mut merged = Vec::with_capacity(total);
        let mut i = 0;
        let mut j = 0;
        while i < a.len() && j < b.len() {
            if a[i] <= b[j] {
                merged.push(a[i]);
                i += 1;
            } else {
                merged.push(b[j]);
                j += 1;
            }
        }
        merged.extend_from_slice(&a[i..]);
        merged.extend_from_slice(&b[j..]);
        let mid = total / 2;
        if total % 2 == 1 {
            merged[mid] as f64
        } else {
            (merged[mid - 1] + merged[mid]) as f64 / 2.0
        }
    }
  notes: |
    Merge both sorted slices like merge-sort, then read the middle (or average the
    two middles for an even total). This is O(m + n); the textbook O(log(m + n))
    partition search is faster but far more error-prone.
    Time O(m + n), Space O(m + n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Merge the two sorted slices into one (like merge-sort's merge step) and read the middle &mdash; averaging the two middles when the combined length is even.</p>
      <div class="vz-flow"><span class="vz-step">merge both sorted slices</span><span class="vz-arr">&rarr;</span><span class="vz-step">one sorted sequence</span><span class="vz-arr">&rarr;</span><span class="vz-step win">read middle (or avg of two)</span></div>
    </div>
    ===
    6-13 | Merge a and b like merge-sort, picking the smaller head each step.
    <div class="vz"><div class="vz-lab">two sorted inputs</div><div class="vz-lab">a</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">i</span></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">1</span></span></div><div class="vz-lab">b</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">j</span></span><span class="vz-ch">2</span><span class="vz-ix">0</span></span></div></div>
    ===
    7-9 | a[i]=1 <= b[j]=2 -> take 1, advance i.
    <div class="vz"><div class="vz-lab">merged so far</div><div class="vz-row"><span class="vz-lab">merged</span><span class="vz-chip">1</span></div></div>
    ===
    15-16 | One side empties; append the rest -> [1, 2, 3].
    <div class="vz"><div class="vz-lab">merged</div><div class="vz-row"><span class="vz-lab">merged</span><span class="vz-chip">1</span><span class="vz-chip">2</span><span class="vz-chip">3</span></div></div>
    ===
    17-21 | Odd total -> the median is the middle element = 2.
    <div class="vz"><div class="vz-lab">median</div><div class="vz-row"><span class="vz-lab">merged</span><span class="vz-chip">1</span><span class="vz-chip win">2</span><span class="vz-chip">3</span></div></div>
  source: "NeetCode 150 · Binary Search"
  tags: [rust, neetcode, binary-search]
  tests: |
    assert_eq!(find_median_sorted_arrays(&[1, 3], &[2]), 2.0);
    assert_eq!(find_median_sorted_arrays(&[1, 2], &[3, 4]), 2.5);
    assert_eq!(find_median_sorted_arrays(&[], &[1]), 1.0);
    assert_eq!(find_median_sorted_arrays(&[2], &[]), 2.0);
    assert_eq!(find_median_sorted_arrays(&[1, 2, 3], &[4, 5, 6]), 3.5);
