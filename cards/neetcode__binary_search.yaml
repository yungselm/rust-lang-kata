# NeetCode 150 — Binary Search. Original prompts; idiomatic, clippy-clean
# Rust; example tests run by `python check_cards.py`.
- instruction: |
    Binary Search. Write `search(nums: &[i32], target: i32) -> Option<usize>` on a
    strictly ascending slice: return the index of `target`, or None.
    Example: ([-1, 0, 3, 5, 9, 12], 9) -> Some(4); ([..], 2) -> None.
  starter: |
    fn search(nums: &[i32], target: i32) -> Option<usize> {

    }
  solution: |
    fn search(nums: &[i32], target: i32) -> Option<usize> {
        use std::cmp::Ordering;
        let mut lo = 0;
        let mut hi = nums.len();
        while lo < hi {
            let mid = lo + (hi - lo) / 2;
            match nums[mid].cmp(&target) {
                Ordering::Equal => return Some(mid),
                Ordering::Less => lo = mid + 1,
                Ordering::Greater => hi = mid,
            }
        }
        None
    }
  notes: |
    Half-open range [lo, hi): shrink toward the target by comparing the midpoint.
    Using `lo + (hi - lo) / 2` avoids overflow. A three-way `if`/`else if`/`else`
    comparing the same two values would trip clippy's `comparison_chain`; `match
    ....cmp(&target)` is the idiomatic (and lint-clean) way to express it.
    Time O(log n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>On a <b>sorted</b> array you can halve the search each step: compare the middle element to the target and throw away the half that cannot contain it.</p>
      <div class="vz-flow"><span class="vz-step">look at the middle</span><span class="vz-arr">&rarr;</span><span class="vz-step">target smaller &rarr; go left</span><span class="vz-arr">&rarr;</span><span class="vz-step">target larger &rarr; go right</span><span class="vz-arr">&rarr;</span><span class="vz-step win">found, or empty</span></div>
    </div>
    ===
    2-5 | Range [lo, hi) starts as the whole array; look at the midpoint.
    <div class="vz"><div class="vz-lab">lo .. hi</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch take">-1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">0</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#c586c0">mid</span></span><span class="vz-ch take">5</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">9</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">12</span><span class="vz-ix">5</span></span></div></div>
    ===
    6-9 | nums[mid]=5 < 9 -> discard the left half, lo = mid+1.
    <div class="vz"><div class="vz-lab">go right</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">0</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#c586c0">mid</span></span><span class="vz-ch">5</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch take">9</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch take">12</span><span class="vz-ix">5</span></span></div></div>
