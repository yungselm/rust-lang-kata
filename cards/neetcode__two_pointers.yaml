- instruction: |
    Two Sum II (sorted input). Write
    `two_sum_sorted(nums: &[i32], target: i32) -> Option<(usize, usize)>`.
    The slice is sorted ascending; return the 0-based indices of the two values
    that add up to `target` (smaller index first), or None.
    Example: ([2, 7, 11, 15], 9) -> Some((0, 1)).
  starter: |
    fn two_sum_sorted(nums: &[i32], target: i32) -> Option<(usize, usize)> {

    }
  solution: |
    fn two_sum_sorted(nums: &[i32], target: i32) -> Option<(usize, usize)> {
        if nums.is_empty() {
            return None;
        }
        let mut lo = 0;
        let mut hi = nums.len() - 1;
        while lo < hi {
            let sum = nums[lo] + nums[hi];
            match sum.cmp(&target) {
                std::cmp::Ordering::Equal => return Some((lo, hi)),
                std::cmp::Ordering::Less => lo += 1,
                std::cmp::Ordering::Greater => hi -= 1,
            }
        }
        None
    }
  notes: |
    Because the array is sorted, a sum too small means we need a bigger value
    (advance `lo`); too large means a smaller one (retreat `hi`).
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Because the array is <b>sorted</b>, a sum that's too small needs a bigger left value and a sum that's too big needs a smaller right value. Squeeze two pointers in from both ends.</p>
      <div class="vz-flow"><span class="vz-step">lo at start, hi at end</span><span class="vz-arr">→</span><span class="vz-step">sum &lt; target → lo++</span><span class="vz-arr">→</span><span class="vz-step">sum &gt; target → hi−−</span><span class="vz-arr">→</span><span class="vz-step win">sum == target → found</span></div>
    </div>
    ===
    5-6 | Start lo and hi at the two ends of the sorted slice.
    <div class="vz"><div class="vz-lab">lo / hi</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">2</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">7</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">11</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">15</span><span class="vz-ix">3</span></span></div></div>
    ===
    8-12 | 2 + 15 = 17 > 9 -> move hi down.
    <div class="vz"><div class="vz-lab">sum too big</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">2</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">7</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">11</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">15</span><span class="vz-ix">3</span></span></div></div>
    ===
    8-12 | 2 + 11 = 13 > 9 -> move hi down again.
    <div class="vz"><div class="vz-lab">still too big</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">2</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">7</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">11</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">15</span><span class="vz-ix">3</span></span></div></div>
    ===
    8-10 | 2 + 7 = 9 = target -> return (0, 1).
    <div class="vz"><div class="vz-lab">found</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch take">2</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch take">7</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">11</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">15</span><span class="vz-ix">3</span></span></div></div>
  source: "NeetCode 150 · Two Pointers"
  tags: [rust, neetcode, two-pointers]
  tests: |
    assert_eq!(two_sum_sorted(&[2, 7, 11, 15], 9), Some((0, 1)));
    assert_eq!(two_sum_sorted(&[2, 3, 4], 6), Some((0, 2)));
    assert_eq!(two_sum_sorted(&[-1, 0], -1), Some((0, 1)));
    assert_eq!(two_sum_sorted(&[1, 2, 3], 100), None);

- instruction: |
    3Sum. Write `three_sum(nums: &[i32]) -> Vec<[i32; 3]>` returning all unique
    triplets that sum to zero. Each triplet is sorted ascending; the result
    contains no duplicate triplets. Order of triplets doesn't matter.
    Example: [-1, 0, 1, 2, -1, -4] -> [[-1, -1, 2], [-1, 0, 1]].
  starter: |
    fn three_sum(nums: &[i32]) -> Vec<[i32; 3]> {

    }
  solution: |
    fn three_sum(nums: &[i32]) -> Vec<[i32; 3]> {
        let mut nums = nums.to_vec();
        nums.sort_unstable();
        let n = nums.len();
        let mut res = Vec::new();
        for i in 0..n {
            if i > 0 && nums[i] == nums[i - 1] {
                continue;
            }
            let mut lo = i + 1;
            let mut hi = n.saturating_sub(1);
            while lo < hi {
                let sum = nums[i] + nums[lo] + nums[hi];
                match sum.cmp(&0) {
                    std::cmp::Ordering::Less => lo += 1,
                    std::cmp::Ordering::Greater => hi -= 1,
                    std::cmp::Ordering::Equal => {
                        res.push([nums[i], nums[lo], nums[hi]]);
                        lo += 1;
                        hi -= 1;
                        while lo < hi && nums[lo] == nums[lo - 1] {
                            lo += 1;
                        }
                        while lo < hi && nums[hi] == nums[hi + 1] {
                            hi -= 1;
                        }
                    }
                }
            }
        }
        res
    }
  notes: |
    Sort, then fix the first element and two-pointer the rest. Skipping equal
    neighbours (for `i`, and after each hit for `lo`/`hi`) suppresses duplicates.
    The extra space is constant beyond the sort.
    Time O(n^2), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Fix one number and the rest becomes <b>Two-Sum on a sorted array</b>. Sort first, then for each value two-pointer the remainder to hit −value, skipping equal neighbours to avoid duplicate triplets.</p>
      <div class="vz-flow"><span class="vz-step">sort</span><span class="vz-arr">→</span><span class="vz-step">fix nums[i]</span><span class="vz-arr">→</span><span class="vz-step">two-pointer rest for −nums[i]</span><span class="vz-arr">→</span><span class="vz-step win">skip duplicates</span></div>
    </div>
    ===
    2-3 | Sort first so we can two-pointer and skip duplicates.
    <div class="vz"><div class="vz-lab">sorted</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-1</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-1</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">0</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">5</span></span></div></div>
    ===
    6-11 | Fix nums[i], then two-pointer the rest for sum 0.
    <div class="vz"><div class="vz-lab">fix i, scan lo/hi</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#4ec96a">i</span></span><span class="vz-ch">-1</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">-1</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">0</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">2</span><span class="vz-ix">5</span></span></div></div>
    ===
    13-18 | -1 + -1 + 2 = 0 -> record [-1, -1, 2].
    <div class="vz"><div class="vz-lab">hit</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#4ec96a">i</span></span><span class="vz-ch take">-1</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch take">-1</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">0</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">1</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch take">2</span><span class="vz-ix">5</span></span></div></div>
    ===
    13-18 | Move inward: -1 + 0 + 1 = 0 -> [-1, 0, 1].
    <div class="vz"><div class="vz-lab">another hit</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-4</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#4ec96a">i</span></span><span class="vz-ch take">-1</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">-1</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch take">0</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch take">1</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">5</span></span></div></div>
  source: "NeetCode 150 · Two Pointers"
  tags: [rust, neetcode, two-pointers]
  tests: |
    let mut got = three_sum(&[-1, 0, 1, 2, -1, -4]);
    got.sort();
    assert_eq!(got, vec![[-1, -1, 2], [-1, 0, 1]]);
    assert_eq!(three_sum(&[0, 1, 1]), Vec::<[i32; 3]>::new());
    assert_eq!(three_sum(&[0, 0, 0]), vec![[0, 0, 0]]);

- instruction: |
    Container With Most Water. Write `max_area(heights: &[i32]) -> i32`: each value
    is a vertical line at that index; find the two lines that, with the x-axis,
    hold the most water. Area = distance between lines * the shorter height.
    Example: [1, 8, 6, 2, 5, 4, 8, 3, 7] -> 49.
  starter: |
    fn max_area(heights: &[i32]) -> i32 {

    }
  solution: |
    fn max_area(heights: &[i32]) -> i32 {
        if heights.len() < 2 {
            return 0;
        }
        let mut lo = 0;
        let mut hi = heights.len() - 1;
        let mut best = 0;
        while lo < hi {
            let h = heights[lo].min(heights[hi]);
            best = best.max(h * (hi - lo) as i32);
            if heights[lo] < heights[hi] {
                lo += 1;
            } else {
                hi -= 1;
            }
        }
        best
    }
  notes: |
    Start at the widest pair and move whichever pointer has the shorter line: the
    width only shrinks, so the only way to beat the current area is a taller line.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Area is <b>width × the shorter wall</b>. Start at the widest pair; moving the taller wall can't help (width only shrinks, height is capped by the shorter), so always move the shorter wall inward.</p>
      <div class="vz-flow"><span class="vz-step">start widest pair</span><span class="vz-arr">→</span><span class="vz-step">area = shorter × width</span><span class="vz-arr">→</span><span class="vz-step">move the shorter wall in</span><span class="vz-arr">→</span><span class="vz-step win">track best</span></div>
    </div>
    ===
    5-6 | Start lo and hi at the two ends (widest).
    <div class="vz"><div class="vz-lab">widest pair</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">8</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">6</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">4</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">8</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">7</span><span class="vz-ix">8</span></span></div></div>
    ===
    9-15 | Area = shorter wall x width = 1 x 8 = 8; the left wall is shorter, so move lo in.
    <div class="vz"><div class="vz-lab">move the shorter wall</div><div class="vz-str"><span class="vz-col"><span class="vz-ptrs"><span style="color:#569cd6">lo</span></span><span class="vz-ch">1</span><span class="vz-ix">0</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">8</span><span class="vz-ix">1</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">6</span><span class="vz-ix">2</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">2</span><span class="vz-ix">3</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">5</span><span class="vz-ix">4</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">4</span><span class="vz-ix">5</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">8</span><span class="vz-ix">6</span></span><span class="vz-col"><span class="vz-ptrs"></span><span class="vz-ch">3</span><span class="vz-ix">7</span></span><span class="vz-col"><span class="vz-ptrs"><span style="color:#ce9178">hi</span></span><span class="vz-ch">7</span><span class="vz-ix">8</span></span></div></div>
