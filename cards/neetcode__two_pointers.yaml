# NeetCode 150 — Two Pointers. Original prompts; idiomatic, clippy-clean
# Rust; example tests run by `python check_cards.py`.
- instruction: |
    Valid Palindrome. Write `is_palindrome(s: &str) -> bool`: true if `s` reads the
    same forwards and backwards, considering only alphanumeric characters and
    ignoring case.
    Example: "A man, a plan, a canal: Panama" -> true; "race a car" -> false.
  starter: |
    fn is_palindrome(s: &str) -> bool {

    }
  solution: |
    fn is_palindrome(s: &str) -> bool {
        let chars: Vec<char> = s
            .chars()
            .filter(|c| c.is_alphanumeric())
            .map(|c| c.to_ascii_lowercase())
            .collect();
        let mut i = 0;
        let mut j = chars.len();
        while i < j {
            j -= 1;
            if chars[i] != chars[j] {
                return false;
            }
            i += 1;
        }
        true
    }
  notes: |
    Filter to alphanumerics and lowercase once, then walk a pointer in from each
    end. Decrementing `j` first keeps the indices valid without underflow on usize.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Reading the same both ways means the <b>ends match all the way inward</b>. Keep only letters and digits, lowercase them, then compare one pointer from each end stepping toward the middle.</p>
      <div class="vz-flow"><span class="vz-step">keep alphanumerics, lowercase</span><span class="vz-arr">→</span><span class="vz-step">compare the two ends</span><span class="vz-arr">→</span><span class="vz-step">step inward</span><span class="vz-arr">→</span><span class="vz-step win">any mismatch → false</span></div>
    </div>
    ===
    2-6 | Keep only letters/digits and lowercase them.
    ===
    7-8 | A pointer at each end.
    ===
    9-10 | Walk inward comparing the two ends.
    ===
    11-15 | Any mismatch => not a palindrome.
    ===
    16-17 | All pairs matched.
  source: "NeetCode 150 · Two Pointers"
  tags: [rust, neetcode, two-pointers]
  tests: |
    assert!(is_palindrome("A man, a plan, a canal: Panama"));
    assert!(!is_palindrome("race a car"));
    assert!(is_palindrome(" "));
    assert!(!is_palindrome("0P"));

- instruction: |
    Two Sum II (sorted input). Write
    `two_sum_sorted(nums: &[i32], target: i32) -> Option<(usize, usize)>`.
    The slice is sorted ascending; return the 0-based indices of the two values
    that add up to `target` (smaller index first), or None.
    Example: ([2, 7, 11, 15], 9) -> Some((0, 1)).
  starter: |
    fn two_sum_sorted(nums: &[i32], target: i32) -> Option<(usize, usize)> {

    }
  solution: |
    fn two_sum_sorted(nums: &[i32], target: i32) -> Option<(usize, usize)> {
        if nums.is_empty() {
            return None;
        }
        let mut lo = 0;
        let mut hi = nums.len() - 1;
        while lo < hi {
            let sum = nums[lo] + nums[hi];
            match sum.cmp(&target) {
                std::cmp::Ordering::Equal => return Some((lo, hi)),
                std::cmp::Ordering::Less => lo += 1,
                std::cmp::Ordering::Greater => hi -= 1,
            }
        }
        None
    }
  notes: |
    Because the array is sorted, a sum too small means we need a bigger value
    (advance `lo`); too large means a smaller one (retreat `hi`).
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Because the array is <b>sorted</b>, a sum that's too small needs a bigger left value and a sum that's too big needs a smaller right value. Squeeze two pointers in from both ends.</p>
      <div class="vz-flow"><span class="vz-step">lo at start, hi at end</span><span class="vz-arr">→</span><span class="vz-step">sum &lt; target → lo++</span><span class="vz-arr">→</span><span class="vz-step">sum &gt; target → hi−−</span><span class="vz-arr">→</span><span class="vz-step win">sum == target → found</span></div>
    </div>
    ===
    5-7 | Start a pointer at each end of the sorted slice.
    ===
    8-9 | Sum the two ends.
    ===
    10 | Match -> return the pair.
    ===
    11-14 | Too small -> move lo up; too big -> move hi down.
    ===
    15-16 | Pointers crossed with no match.
  source: "NeetCode 150 · Two Pointers"
  tags: [rust, neetcode, two-pointers]
  tests: |
    assert_eq!(two_sum_sorted(&[2, 7, 11, 15], 9), Some((0, 1)));
    assert_eq!(two_sum_sorted(&[2, 3, 4], 6), Some((0, 2)));
    assert_eq!(two_sum_sorted(&[-1, 0], -1), Some((0, 1)));
    assert_eq!(two_sum_sorted(&[1, 2, 3], 100), None);

- instruction: |
    3Sum. Write `three_sum(nums: &[i32]) -> Vec<[i32; 3]>` returning all unique
    triplets that sum to zero. Each triplet is sorted ascending; the result
    contains no duplicate triplets. Order of triplets doesn't matter.
    Example: [-1, 0, 1, 2, -1, -4] -> [[-1, -1, 2], [-1, 0, 1]].
  starter: |
    fn three_sum(nums: &[i32]) -> Vec<[i32; 3]> {

    }
  solution: |
    fn three_sum(nums: &[i32]) -> Vec<[i32; 3]> {
        let mut nums = nums.to_vec();
        nums.sort_unstable();
        let n = nums.len();
        let mut res = Vec::new();
        for i in 0..n {
            if i > 0 && nums[i] == nums[i - 1] {
                continue;
            }
            let mut lo = i + 1;
            let mut hi = n.saturating_sub(1);
            while lo < hi {
                let sum = nums[i] + nums[lo] + nums[hi];
                match sum.cmp(&0) {
                    std::cmp::Ordering::Less => lo += 1,
                    std::cmp::Ordering::Greater => hi -= 1,
                    std::cmp::Ordering::Equal => {
                        res.push([nums[i], nums[lo], nums[hi]]);
                        lo += 1;
                        hi -= 1;
                        while lo < hi && nums[lo] == nums[lo - 1] {
                            lo += 1;
                        }
                        while lo < hi && nums[hi] == nums[hi + 1] {
                            hi -= 1;
                        }
                    }
                }
            }
        }
        res
    }
  notes: |
    Sort, then fix the first element and two-pointer the rest. Skipping equal
    neighbours (for `i`, and after each hit for `lo`/`hi`) suppresses duplicates.
    The extra space is constant beyond the sort.
    Time O(n^2), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Fix one number and the rest becomes <b>Two-Sum on a sorted array</b>. Sort first, then for each value two-pointer the remainder to hit −value, skipping equal neighbours to avoid duplicate triplets.</p>
      <div class="vz-flow"><span class="vz-step">sort</span><span class="vz-arr">→</span><span class="vz-step">fix nums[i]</span><span class="vz-arr">→</span><span class="vz-step">two-pointer rest for −nums[i]</span><span class="vz-arr">→</span><span class="vz-step win">skip duplicates</span></div>
    </div>
    ===
    3-5 | Sort so we can two-pointer and skip duplicates.
    ===
    6 | Fix the first number of the triplet.
    ===
    7-9 | Skip a repeated first number to avoid duplicate triplets.
    ===
    10-17 | Two-pointer the rest looking for sum 0.
    ===
    18-30 | On a hit, record it, then skip duplicate lo/hi values.
    ===
    31-32 | All unique zero-sum triplets.
  source: "NeetCode 150 · Two Pointers"
  tags: [rust, neetcode, two-pointers]
  tests: |
    let mut got = three_sum(&[-1, 0, 1, 2, -1, -4]);
    got.sort();
    assert_eq!(got, vec![[-1, -1, 2], [-1, 0, 1]]);
    assert_eq!(three_sum(&[0, 1, 1]), Vec::<[i32; 3]>::new());
    assert_eq!(three_sum(&[0, 0, 0]), vec![[0, 0, 0]]);

- instruction: |
    Container With Most Water. Write `max_area(heights: &[i32]) -> i32`: each value
    is a vertical line at that index; find the two lines that, with the x-axis,
    hold the most water. Area = distance between lines * the shorter height.
    Example: [1, 8, 6, 2, 5, 4, 8, 3, 7] -> 49.
  starter: |
    fn max_area(heights: &[i32]) -> i32 {

    }
  solution: |
    fn max_area(heights: &[i32]) -> i32 {
        if heights.len() < 2 {
            return 0;
        }
        let mut lo = 0;
        let mut hi = heights.len() - 1;
        let mut best = 0;
        while lo < hi {
            let h = heights[lo].min(heights[hi]);
            best = best.max(h * (hi - lo) as i32);
            if heights[lo] < heights[hi] {
                lo += 1;
            } else {
                hi -= 1;
            }
        }
        best
    }
  notes: |
    Start at the widest pair and move whichever pointer has the shorter line: the
    width only shrinks, so the only way to beat the current area is a taller line.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Area is <b>width × the shorter wall</b>. Start at the widest pair; moving the taller wall can't help (width only shrinks, height is capped by the shorter), so always move the shorter wall inward.</p>
      <div class="vz-flow"><span class="vz-step">start widest pair</span><span class="vz-arr">→</span><span class="vz-step">area = shorter × width</span><span class="vz-arr">→</span><span class="vz-step">move the shorter wall in</span><span class="vz-arr">→</span><span class="vz-step win">track best</span></div>
    </div>
    ===
    5-8 | Start at the widest pair of lines.
    ===
    9 | Area is the shorter wall x the width.
    ===
    10 | Keep the best area.
    ===
    11-16 | Move the shorter wall inward -- the only way to do better.
    ===
    17-18 | Largest area found.
  source: "NeetCode 150 · Two Pointers"
  tags: [rust, neetcode, two-pointers]
  tests: |
    assert_eq!(max_area(&[1, 8, 6, 2, 5, 4, 8, 3, 7]), 49);
    assert_eq!(max_area(&[1, 1]), 1);
    assert_eq!(max_area(&[4, 3, 2, 1, 4]), 16);
    assert_eq!(max_area(&[1]), 0);

- instruction: |
    Trapping Rain Water. Write `trap(heights: &[i32]) -> i32`: given an elevation
    map where each value is a bar width 1, return how many units of water are
    trapped after rain. Solve in O(n) time, O(1) space.
    Example: [0,1,0,2,1,0,1,3,2,1,2,1] -> 6.
  starter: |
    fn trap(heights: &[i32]) -> i32 {

    }
  solution: |
    fn trap(heights: &[i32]) -> i32 {
        if heights.len() < 3 {
            return 0;
        }
        let mut lo = 0;
        let mut hi = heights.len() - 1;
        let mut left_max = heights[lo];
        let mut right_max = heights[hi];
        let mut total = 0;
        while lo < hi {
            if left_max <= right_max {
                lo += 1;
                left_max = left_max.max(heights[lo]);
                total += left_max - heights[lo];
            } else {
                hi -= 1;
                right_max = right_max.max(heights[hi]);
                total += right_max - heights[hi];
            }
        }
        total
    }
  notes: |
    Water over a bar is min(maxLeft, maxRight) - height. Advance from the side
    with the smaller running max: that side's max is then guaranteed to be the
    limiting wall, so the trapped amount there is known.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Water above a bar is <b>min(highest-left, highest-right) − its height</b>. Advance from whichever side has the smaller running max, because that side's wall is the binding limit.</p>
      <div class="vz-flow"><span class="vz-step">two pointers + running maxes</span><span class="vz-arr">→</span><span class="vz-step">move the smaller-max side</span><span class="vz-arr">→</span><span class="vz-step">add wall − height</span><span class="vz-arr">→</span><span class="vz-step win">sum the water</span></div>
    </div>
    ===
    7-9 | Track the tallest wall seen from each side.
    ===
    10 | Advance from the side with the smaller running max.
    ===
    11-16 | Left is the limit: step right, update its max, add trapped water.
    ===
    17 | Otherwise the right side is the limit -- mirror it.
    ===
    18-22 | Total trapped water.
  source: "NeetCode 150 · Two Pointers"
  tags: [rust, neetcode, two-pointers]
  tests: |
    assert_eq!(trap(&[0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]), 6);
    assert_eq!(trap(&[4, 2, 0, 3, 2, 5]), 9);
    assert_eq!(trap(&[1, 2, 3]), 0);
    assert_eq!(trap(&[]), 0);
