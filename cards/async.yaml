- type: concept
  question: |
    Why can't you write `.await` inside an ordinary (non-`async`) function?
  answer: |
    `.await` only compiles inside an `async fn` or `async { }` block, because
    it's sugar for "poll this future, and if it's `Pending`, suspend THIS
    function (saving its state) and yield control back to whatever is
    driving it" — that suspend/resume machinery only exists for the state
    machine the compiler builds for async bodies. A plain synchronous
    function has no such state machine to suspend, so the compiler rejects
    `.await` there with a `... only allowed inside async functions and
    blocks` error.
  source: "book §17.1 (the await keyword)"
  tags: [rust, async, concept]

