# Async/await (book ch.17) — Future, Poll, Waker, a hand-rolled std-only
# block_on executor, and the runtime-specific APIs (tokio) taught as prose
# since this harness has no external crates / no network access to add any.
- type: concept
  question: |
    When you call an `async fn`, does its body start running immediately?
  answer: |
    No. Calling an `async fn` (or writing an `async { ... }` block) immediately
    returns a value implementing `Future` — the compiler builds this as a
    state machine capturing the function's locals — but NONE of the body runs
    yet. The body only executes once something actually POLLS that future:
    either an executor calling `.poll()` directly, or an `.await` inside
    another async fn/block that's itself being polled. Async is lazy; a
    `Future` you never poll or await simply never runs.
  source: "book §17.1 (futures and the async syntax)"
  tags: [rust, async, concept]

- type: concept
  question: |
    What do the two variants of `Poll<T>` mean, and who calls `.poll()`?
  answer: |
    `Poll::Ready(T)` — the future has finished, here's its output. `Poll::
    Pending` — not done yet; the future has stashed a `Waker` (from the
    `Context` it was given) so it can ask to be polled again later. An
    executor is the thing that calls `.poll()` — a plain async fn body never
    calls it directly; `.await` is sugar that calls `poll()` for you and
    either unwraps a `Ready` value or yields control back to the executor on
    `Pending`.
  source: "std::task::Poll docs + book §17"
  tags: [rust, async, concept]

- instruction: |
    Implement a `ReadyNow<T>` type that is a `Future` already complete on its
    first poll (wraps `Option<T>`, returns the value via `Poll::Ready` and
    takes it out of the `Option`). Then write a tiny `block_on` executor
    (using only `std::task`/`std::pin`, no external crate) that spin-polls a
    future with a no-op `Waker` until it's `Ready`, and use it to run
    `ReadyNow`.
  starter: |
    use std::future::Future;
    use std::pin::Pin;
    use std::task::{Context, Poll, RawWaker, RawWakerVTable, Waker};

    struct ReadyNow<T>(Option<T>);

    impl<T: Unpin> Future for ReadyNow<T> {
        type Output = T;

        fn poll(self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<T> {

        }
    }

    // add noop_raw_waker and block_on here
  solution: |
    use std::future::Future;
    use std::pin::Pin;
    use std::task::{Context, Poll, RawWaker, RawWakerVTable, Waker};

    struct ReadyNow<T>(Option<T>);

    impl<T: Unpin> Future for ReadyNow<T> {
        type Output = T;

        fn poll(self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<T> {
            Poll::Ready(self.get_mut().0.take().expect("polled after completion"))
        }
    }

    fn noop_raw_waker() -> RawWaker {
        fn no_op(_: *const ()) {}
        fn clone(_: *const ()) -> RawWaker {
            noop_raw_waker()
        }
        const VTABLE: RawWakerVTable = RawWakerVTable::new(clone, no_op, no_op, no_op);
        RawWaker::new(std::ptr::null(), &VTABLE)
    }

    fn block_on<F: Future>(mut fut: F) -> F::Output {
        let waker = unsafe { Waker::from_raw(noop_raw_waker()) };
        let mut cx = Context::from_waker(&waker);
        let mut fut = unsafe { Pin::new_unchecked(&mut fut) };
        loop {
            if let Poll::Ready(val) = fut.as_mut().poll(&mut cx) {
                return val;
            }
        }
    }
  notes: |
    This is exactly the shape of a real executor, minus the "park the thread
    until woken" part: `RawWakerVTable` needs four function pointers (clone,
    wake, wake_by_ref, drop) — here they're all no-ops since our loop just
    re-polls immediately instead of waiting for a wakeup. `Future::poll` takes
    `Pin<&mut Self>`; `Pin::get_mut` needs `Self: Unpin` to hand back a plain
    `&mut Self`, so the impl requires `T: Unpin` explicitly (the compiler
    won't assume an unconstrained generic parameter is `Unpin` on its own,
    even though `ReadyNow<T>` itself has no self-referential fields).
  source: "book §17 (futures and the async trait) + std::task docs"
  tags: [rust, async]
  tests: |
    assert_eq!(block_on(ReadyNow(Some(42))), 42);
    assert_eq!(block_on(ReadyNow(Some("hi"))), "hi");

- type: concept
  question: |
    What's the difference between `Waker::wake` and `Waker::wake_by_ref`, and
    why does a `Future::poll` implementation need a `Waker` at all?
  answer: |
    Both tell the executor "this future may be ready to make progress, please
    poll it again" — `wake` consumes the `Waker` (cheaper if you're done with
    it), `wake_by_ref` takes `&self` so you can call it again later. A
    correctly-written `poll` that returns `Pending` MUST stash (a clone of)
    the `Waker` from its `Context` and call `wake`/`wake_by_ref` once the
    future can actually progress (a socket became readable, a timer fired) —
    otherwise a real executor (which sleeps until woken, unlike a toy
    spin-loop) would never re-poll it.
  source: "std::task::Waker docs"
  tags: [rust, async, waker, concept]

