# NeetCode 150 — Greedy. Original prompts; idiomatic, clippy-clean
# Rust; example tests run by `python check_cards.py`.
- instruction: |
    Maximum Subarray. Write `max_sub_array(nums: &[i32]) -> i32` returning the
    largest sum of any contiguous non-empty subarray (Kadane's algorithm).
    Example: [-2, 1, -3, 4, -1, 2, 1, -5, 4] -> 6 (the run 4, -1, 2, 1).
  starter: |
    fn max_sub_array(nums: &[i32]) -> i32 {

    }
  solution: |
    fn max_sub_array(nums: &[i32]) -> i32 {
        let mut best = nums[0];
        let mut cur = nums[0];
        for &n in &nums[1..] {
            cur = n.max(cur + n);
            best = best.max(cur);
        }
        best
    }
  notes: |
    Kadane: `cur` is the best sum ending at the current index. Either extend the
    previous run or restart at `n`, whichever is larger; track the running maximum.
    Assumes a non-empty slice.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Kadane's: the best sum <b>ending here</b> is either this element alone or it extended onto the previous run, whichever is larger. Track the running best.</p>
      <div class="vz-flow"><span class="vz-step">best sum ending here</span><span class="vz-arr">&rarr;</span><span class="vz-step">extend run, or restart at n</span><span class="vz-arr">&rarr;</span><span class="vz-step win">keep the maximum</span></div>
    </div>
    ===
    2-4 | best = answer so far; cur = best sum ending here.
    ===
    5 | Extend the run or restart at n, whichever is larger.
    ===
    6-9 | Track the running maximum.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert_eq!(max_sub_array(&[-2, 1, -3, 4, -1, 2, 1, -5, 4]), 6);
    assert_eq!(max_sub_array(&[1]), 1);
    assert_eq!(max_sub_array(&[-3, -1, -2]), -1);
    assert_eq!(max_sub_array(&[5, 4, -1, 7, 8]), 23);

- instruction: |
    Jump Game. Write `can_jump(nums: &[i32]) -> bool` where nums[i] is the max
    forward jump length from index i; return true if the last index is reachable
    from index 0.
    Example: [2, 3, 1, 1, 4] -> true; [3, 2, 1, 0, 4] -> false.
  starter: |
    fn can_jump(nums: &[i32]) -> bool {

    }
  solution: |
    fn can_jump(nums: &[i32]) -> bool {
        let mut reach = 0usize;
        for (i, &n) in nums.iter().enumerate() {
            if i > reach {
                return false;
            }
            reach = reach.max(i + n as usize);
        }
        true
    }
  notes: |
    Track the furthest index reachable so far. If the loop ever reaches an index
    beyond `reach`, there's a gap and the end is unreachable. Greedy, single pass.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Track the <b>farthest index reachable</b> so far; if the scan ever passes that frontier there's a gap and the end is unreachable.</p>
      <div class="vz-flow"><span class="vz-step">track farthest reach</span><span class="vz-arr">&rarr;</span><span class="vz-step">index past reach &rarr; gap</span><span class="vz-arr">&rarr;</span><span class="vz-step">else extend the reach</span><span class="vz-arr">&rarr;</span><span class="vz-step win">end reachable?</span></div>
    </div>
    ===
    2-3 | Track the farthest index reachable so far.
    ===
    4-6 | If we're past the frontier, there's a gap -> unreachable.
    ===
    7-8 | Otherwise extend the reach.
    ===
    9-10 | Reached the end.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert!(can_jump(&[2, 3, 1, 1, 4]));
    assert!(!can_jump(&[3, 2, 1, 0, 4]));
    assert!(can_jump(&[0]));

- instruction: |
    Jump Game II. Write `jump(nums: &[i32]) -> i32` returning the minimum number of
    jumps to reach the last index (the input always allows reaching it).
    Example: [2, 3, 1, 1, 4] -> 2 (index 0 -> 1 -> 4).
  starter: |
    fn jump(nums: &[i32]) -> i32 {

    }
  solution: |
    fn jump(nums: &[i32]) -> i32 {
        let mut jumps = 0;
        let mut cur_end = 0usize;
        let mut farthest = 0usize;
        let last = nums.len().saturating_sub(1);
        for (i, &n) in nums.iter().enumerate().take(last) {
            farthest = farthest.max(i + n as usize);
            if i == cur_end {
                jumps += 1;
                cur_end = farthest;
            }
        }
        jumps
    }
  notes: |
    BFS by levels: `cur_end` marks the boundary of the current jump's reach. When
    the scan hits that boundary, commit one more jump and extend to `farthest`.
    Stopping before the last index avoids an extra count.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>BFS by jump <b>levels</b>: scan within the current jump's reach tracking the farthest; when you hit its boundary, commit one more jump and extend.</p>
      <div class="vz-flow"><span class="vz-step">scan within current reach</span><span class="vz-arr">&rarr;</span><span class="vz-step">track the farthest</span><span class="vz-arr">&rarr;</span><span class="vz-step">hit boundary &rarr; +1 jump</span><span class="vz-arr">&rarr;</span><span class="vz-step win">extend to farthest</span></div>
    </div>
    ===
    3-6 | cur_end is the boundary of the current jump's reach.
    ===
    7 | Track the farthest reachable within this jump.
    ===
    8-12 | Hit the boundary -> take one more jump, extend to farthest.
    ===
    13-14 | Minimum jumps.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert_eq!(jump(&[2, 3, 1, 1, 4]), 2);
    assert_eq!(jump(&[2, 3, 0, 1, 4]), 2);
    assert_eq!(jump(&[0]), 0);

- instruction: |
    Gas Station. Write `can_complete_circuit(gas: &[i32], cost: &[i32]) -> i32`:
    around a circular route, gas[i] is fuel at station i and cost[i] is fuel to
    reach i+1. Return the starting index to complete the loop, or -1 if impossible.
    Example: (gas [1,2,3,4,5], cost [3,4,5,1,2]) -> 3.
  starter: |
    fn can_complete_circuit(gas: &[i32], cost: &[i32]) -> i32 {

    }
  solution: |
    fn can_complete_circuit(gas: &[i32], cost: &[i32]) -> i32 {
        let mut total = 0;
        let mut tank = 0;
        let mut start = 0;
        for i in 0..gas.len() {
            let diff = gas[i] - cost[i];
            total += diff;
            tank += diff;
            if tank < 0 {
                start = i + 1;
                tank = 0;
            }
        }
        if total >= 0 {
            start as i32
        } else {
            -1
        }
    }
  notes: |
    A solution exists iff total gas >= total cost. If the tank goes negative at
    station i, no start in `start..=i` works, so jump the candidate start to i + 1.
    One pass finds the unique valid start.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>A loop is possible iff <b>total gas &ge; total cost</b>. If the tank ever goes negative at i, no start in start..=i works, so jump the candidate start to i+1.</p>
      <div class="vz-flow"><span class="vz-step">track tank &amp; total diff</span><span class="vz-arr">&rarr;</span><span class="vz-step">tank &lt; 0 &rarr; restart at i+1</span><span class="vz-arr">&rarr;</span><span class="vz-step">total &ge; 0?</span><span class="vz-arr">&rarr;</span><span class="vz-step win">that start works</span></div>
    </div>
    ===
    6-8 | Net fuel gained/lost at each station.
    ===
    9-13 | Tank goes negative -> no start up to here works; restart at i+1.
    ===
    14-19 | A loop is possible iff total gas >= total cost.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert_eq!(can_complete_circuit(&[1, 2, 3, 4, 5], &[3, 4, 5, 1, 2]), 3);
    assert_eq!(can_complete_circuit(&[2, 3, 4], &[3, 4, 3]), -1);
    assert_eq!(can_complete_circuit(&[5], &[4]), 0);

- instruction: |
    Hand of Straights. Write `is_n_straight_hand(hand: &[i32], group_size: i32) -> bool`:
    can the cards be rearranged into groups of `group_size` consecutive numbers?
    Example: ([1,2,3,6,2,3,4,7,8], 3) -> true (1-2-3, 2-3-4, 6-7-8).
  starter: |
    use std::collections::BTreeMap;

    fn is_n_straight_hand(hand: &[i32], group_size: i32) -> bool {

    }
  solution: |
    use std::collections::BTreeMap;

    fn is_n_straight_hand(hand: &[i32], group_size: i32) -> bool {
        let gs = group_size as usize;
        if !hand.len().is_multiple_of(gs) {
            return false;
        }
        let mut counts: BTreeMap<i32, i32> = BTreeMap::new();
        for &c in hand {
            *counts.entry(c).or_default() += 1;
        }
        while let Some((&lowest, &n)) = counts.iter().next() {
            for card in lowest..lowest + group_size {
                match counts.get_mut(&card) {
                    Some(cnt) if *cnt >= n => {
                        *cnt -= n;
                        if *cnt == 0 {
                            counts.remove(&card);
                        }
                    }
                    _ => return false,
                }
            }
        }
        true
    }
  notes: |
    A `BTreeMap` keeps cards sorted, so the smallest remaining card must start a
    group. Remove `n` copies each of the next `group_size` consecutive values; if
    any are missing, no valid grouping exists.
    Time O(n log n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>A sorted map (BTreeMap) means the <b>smallest remaining card</b> must begin a group. Remove its copies plus the next group_size&minus;1 consecutive values, and repeat.</p>
      <div class="vz-flow"><span class="vz-step">count cards (sorted map)</span><span class="vz-arr">&rarr;</span><span class="vz-step">smallest card starts a group</span><span class="vz-arr">&rarr;</span><span class="vz-step">remove the consecutive run</span><span class="vz-arr">&rarr;</span><span class="vz-step win">missing any &rarr; false</span></div>
    </div>
    ===
    5-7 | Size must divide evenly into groups.
    ===
    8-11 | Sorted card counts.
    ===
    12 | The smallest remaining card must start a group.
    ===
    13-26 | Remove n of each consecutive value; missing any -> false.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert!(is_n_straight_hand(&[1, 2, 3, 6, 2, 3, 4, 7, 8], 3));
    assert!(!is_n_straight_hand(&[1, 2, 3, 4, 5], 4));
    assert!(is_n_straight_hand(&[1, 1, 2, 2, 3, 3], 3));

- instruction: |
    Merge Triplets to Form Target. Write
    `merge_triplets(triplets: &[[i32; 3]], target: [i32; 3]) -> bool`. A merge of
    two triplets takes the element-wise maximum. Return true if `target` is
    obtainable by merging some subset.
    Example: (triplets [[2,5,3],[1,8,4],[1,7,5]], target [2,7,5]) -> true.
  starter: |
    fn merge_triplets(triplets: &[[i32; 3]], target: [i32; 3]) -> bool {

    }
  solution: |
    fn merge_triplets(triplets: &[[i32; 3]], target: [i32; 3]) -> bool {
        let mut found = [false; 3];
        for t in triplets {
            if t[0] <= target[0] && t[1] <= target[1] && t[2] <= target[2] {
                for j in 0..3 {
                    if t[j] == target[j] {
                        found[j] = true;
                    }
                }
            }
        }
        found.iter().all(|&f| f)
    }
  notes: |
    Any triplet with a component exceeding the target would spoil the max, so ignore
    those. Among the rest, we just need each target component matched exactly by
    some usable triplet; merging those triplets then yields exactly the target.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Ignore any triplet with a component <b>over</b> the target (it would spoil the max). Among the rest, just check each target component is matched exactly by some triplet.</p>
      <div class="vz-flow"><span class="vz-step">drop triplets exceeding target</span><span class="vz-arr">&rarr;</span><span class="vz-step">track components matched exactly</span><span class="vz-arr">&rarr;</span><span class="vz-step">all three matched?</span><span class="vz-arr">&rarr;</span><span class="vz-step win">&rarr; true</span></div>
    </div>
    ===
    4-5 | Ignore triplets with any component over the target.
    ===
    6-11 | Among the rest, mark which components are hit exactly.
    ===
    12-13 | All three matched -> target is reachable.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert!(merge_triplets(
        &[[2, 5, 3], [1, 8, 4], [1, 7, 5]],
        [2, 7, 5]
    ));
    assert!(!merge_triplets(&[[3, 4, 5], [4, 5, 6]], [3, 2, 5]));
    assert!(merge_triplets(
        &[[2, 5, 3], [2, 3, 4], [1, 2, 5], [5, 2, 3]],
        [5, 5, 5]
    ));

- instruction: |
    Partition Labels. Write `partition_labels(s: &str) -> Vec<i32>`: split `s` into
    as many parts as possible so each letter appears in at most one part; return the
    part sizes in order.
    Example: "ababcbacadefegdehijhklij" -> [9, 7, 8].
  starter: |
    fn partition_labels(s: &str) -> Vec<i32> {

    }
  solution: |
    fn partition_labels(s: &str) -> Vec<i32> {
        let bytes = s.as_bytes();
        let mut last = [0usize; 26];
        for (i, &b) in bytes.iter().enumerate() {
            last[(b - b'a') as usize] = i;
        }
        let mut res = Vec::new();
        let mut start = 0;
        let mut end = 0;
        for (i, &b) in bytes.iter().enumerate() {
            end = end.max(last[(b - b'a') as usize]);
            if i == end {
                res.push((end - start + 1) as i32);
                start = i + 1;
            }
        }
        res
    }
  notes: |
    Record each letter's last occurrence, then sweep: extend the current part's end
    to the furthest last-seen position of any letter inside it. When the scan index
    meets that end, the part is closed. Lowercase a-z assumed.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Record each letter's <b>last occurrence</b>; sweep, extending the current part's end to the furthest last-seen letter inside it. When the scan meets that end, close the part.</p>
      <div class="vz-flow"><span class="vz-step">last index of each letter</span><span class="vz-arr">&rarr;</span><span class="vz-step">extend end to furthest seen</span><span class="vz-arr">&rarr;</span><span class="vz-step">scan reaches end &rarr; cut</span><span class="vz-arr">&rarr;</span><span class="vz-step win">part sizes</span></div>
    </div>
    ===
    5-10 | Record each letter's last occurrence.
    ===
    11 | Extend the part's end to the furthest last-seen letter inside it.
    ===
    12-18 | When the scan reaches that end, cut a part here.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert_eq!(
        partition_labels("ababcbacadefegdehijhklij"),
        vec![9, 7, 8]
    );
    assert_eq!(partition_labels("eccbbbbdec"), vec![10]);
    assert_eq!(partition_labels("a"), vec![1]);

- instruction: |
    Valid Parenthesis String. Write `check_valid_string(s: &str) -> bool` where '('
    and ')' must balance and each '*' is a '(', a ')', or empty.
    Example: "(*))" -> true; ")(" -> false.
  starter: |
    fn check_valid_string(s: &str) -> bool {

    }
  solution: |
    fn check_valid_string(s: &str) -> bool {
        let mut low: i32 = 0;
        let mut high: i32 = 0;
        for c in s.chars() {
            match c {
                '(' => {
                    low += 1;
                    high += 1;
                }
                ')' => {
                    low -= 1;
                    high -= 1;
                }
                _ => {
                    low -= 1;
                    high += 1;
                }
            }
            if high < 0 {
                return false;
            }
            low = low.max(0);
        }
        low == 0
    }
  notes: |
    Track the range of possible open-paren counts: `low` treats each '*' as ')' (or
    empty) and `high` as '('. If `high` ever drops below zero there are too many
    ')'; clamp `low` at zero. The string is valid iff zero open parens is reachable.
    Time O(n), Space O(1).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Track the <b>range</b> [low, high] of possible open-paren counts: '*' as ')'/empty lowers low, as '(' raises high. If high &lt; 0 there are too many ')'; valid iff 0 is reachable.</p>
      <div class="vz-flow"><span class="vz-step">track low/high open count</span><span class="vz-arr">&rarr;</span><span class="vz-step">'*' widens the range</span><span class="vz-arr">&rarr;</span><span class="vz-step">high &lt; 0 &rarr; invalid</span><span class="vz-arr">&rarr;</span><span class="vz-step win">low == 0 at end &rarr; valid</span></div>
    </div>
    ===
    2-13 | Track the range [low, high] of possible open-paren counts.
    ===
    14-18 | '*' could be ')'/empty (lowers low) or '(' (raises high).
    ===
    19-23 | If even the max drops below 0, too many ')'.
    ===
    24-25 | Valid iff 0 open parens is reachable.
  source: "NeetCode 150 · Greedy"
  tags: [rust, neetcode, greedy]
  tests: |
    assert!(check_valid_string("()"));
    assert!(check_valid_string("(*)"));
    assert!(check_valid_string("(*))"));
    assert!(!check_valid_string(")("));
    assert!(!check_valid_string("(((*)"));
