- instruction: |
    Course Schedule II. Write `find_order(num_courses: usize, prerequisites: &[[usize; 2]]) -> Vec<usize>`:
    each [a, b] means b before a. Return a valid order to take all courses, or an
    empty vec if impossible.
    Example: (4, [[1,0],[2,1],[3,2]]) -> [0, 1, 2, 3] (unique chain).
  starter: |
    use std::collections::VecDeque;

    fn find_order(num_courses: usize, prerequisites: &[[usize; 2]]) -> Vec<usize> {

    }
  solution: |
    use std::collections::VecDeque;

    fn find_order(num_courses: usize, prerequisites: &[[usize; 2]]) -> Vec<usize> {
        let mut adj: Vec<Vec<usize>> = vec![Vec::new(); num_courses];
        let mut indegree = vec![0usize; num_courses];
        for &[a, b] in prerequisites {
            adj[b].push(a);
            indegree[a] += 1;
        }
        let mut queue: VecDeque<usize> =
            (0..num_courses).filter(|&i| indegree[i] == 0).collect();
        let mut order = Vec::with_capacity(num_courses);
        while let Some(node) = queue.pop_front() {
            order.push(node);
            for &next in &adj[node] {
                indegree[next] -= 1;
                if indegree[next] == 0 {
                    queue.push_back(next);
                }
            }
        }
        if order.len() == num_courses {
            order
        } else {
            Vec::new()
        }
    }
  notes: |
    Kahn's topological sort: emit courses as they reach indegree 0. The emitted
    sequence is a valid order; if a cycle blocks some courses the result is shorter
    than `num_courses`, so we return empty.
    Time O(V + E), Space O(V + E).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Same Kahn's topo-sort, but <b>emit</b> each course as it reaches indegree 0; that sequence is a valid order (empty if a cycle blocks some).</p>
      <div class="vz-flow"><span class="vz-step">indegree-0 into a queue</span><span class="vz-arr">&rarr;</span><span class="vz-step">emit, decrement neighbours</span><span class="vz-arr">&rarr;</span><span class="vz-step">new zeros enqueue</span><span class="vz-arr">&rarr;</span><span class="vz-step win">all emitted &rarr; order</span></div>
    </div>
    ===
    6-9 | Build the graph and indegrees.
    ===
    10-13 | Queue the indegree-0 courses.
    ===
    14-21 | Emit each as it's freed, decrementing dependents.
    ===
    22-27 | All emitted -> a valid order; else a cycle -> empty.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    assert_eq!(find_order(4, &[[1, 0], [2, 1], [3, 2]]), vec![0, 1, 2, 3]);
    assert_eq!(find_order(2, &[[1, 0]]), vec![0, 1]);
    assert_eq!(find_order(2, &[[0, 1], [1, 0]]), Vec::<usize>::new());
    assert_eq!(find_order(1, &[]), vec![0]);

- instruction: |
    Graph Valid Tree. Write `valid_tree(n: usize, edges: &[[usize; 2]]) -> bool`:
    given an undirected graph on nodes 0..n, return true iff it forms a tree
    (fully connected and acyclic).
    Example: (5, [[0,1],[0,2],[0,3],[1,4]]) -> true.
  starter: |
    fn valid_tree(n: usize, edges: &[[usize; 2]]) -> bool {

    }
  solution: |
    fn valid_tree(n: usize, edges: &[[usize; 2]]) -> bool {
        if edges.len() + 1 != n {
            return false;
        }
        let mut parent: Vec<usize> = (0..n).collect();
        for &[a, b] in edges {
            let ra = find(&mut parent, a);
            let rb = find(&mut parent, b);
            if ra == rb {
                return false;
            }
            parent[ra] = rb;
        }
        true
    }

    fn find(parent: &mut [usize], x: usize) -> usize {
        let mut root = x;
        while parent[root] != root {
            root = parent[root];
        }
        let mut cur = x;
        while parent[cur] != root {
            let next = parent[cur];
            parent[cur] = root;
            cur = next;
        }
        root
    }
  notes: |
    A tree on n nodes has exactly n-1 edges and no cycle. Check the edge count
    first, then union-find: if an edge joins two already-connected nodes there is a
    cycle. n-1 edges plus no cycle implies connected.
    Time O(V + E), Space O(V + E).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>A tree on n nodes has exactly <b>n&minus;1 edges and no cycle</b>. Check the count, then union-find: an edge joining two already-connected nodes is a cycle.</p>
      <div class="vz-flow"><span class="vz-step">edges == n&minus;1?</span><span class="vz-arr">&rarr;</span><span class="vz-step">union each edge's endpoints</span><span class="vz-arr">&rarr;</span><span class="vz-step">already connected &rarr; cycle</span><span class="vz-arr">&rarr;</span><span class="vz-step win">no cycle &rarr; tree</span></div>
    </div>
    ===
    2-4 | A tree on n nodes has exactly n-1 edges.
    ===
    5-8 | Union-find: each node starts its own set.
    ===
    9-13 | An edge joining two already-connected nodes is a cycle.
    ===
    14-29 | n-1 edges and no cycle -> it's a tree.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    assert!(valid_tree(5, &[[0, 1], [0, 2], [0, 3], [1, 4]]));
    assert!(!valid_tree(5, &[[0, 1], [1, 2], [2, 3], [1, 3], [1, 4]]));
    assert!(!valid_tree(4, &[[0, 1], [2, 3]]));
    assert!(valid_tree(1, &[]));

- instruction: |
    Number of Connected Components. Write
    `count_components(n: usize, edges: &[[usize; 2]]) -> i32`: count connected
    components in an undirected graph on nodes 0..n.
    Example: (5, [[0,1],[1,2],[3,4]]) -> 2.
  starter: |
    fn count_components(n: usize, edges: &[[usize; 2]]) -> i32 {

    }
  solution: |
    fn count_components(n: usize, edges: &[[usize; 2]]) -> i32 {
        let mut parent: Vec<usize> = (0..n).collect();
        let mut components = n;
        for &[a, b] in edges {
            let ra = find(&mut parent, a);
            let rb = find(&mut parent, b);
            if ra != rb {
                parent[ra] = rb;
                components -= 1;
            }
        }
        components as i32
    }

    fn find(parent: &mut [usize], x: usize) -> usize {
        let mut root = x;
        while parent[root] != root {
            root = parent[root];
        }
        let mut cur = x;
        while parent[cur] != root {
            let next = parent[cur];
            parent[cur] = root;
            cur = next;
        }
        root
    }
  notes: |
    Start with n singletons; every edge that unites two different sets reduces the
    component count by one. Path compression keeps find near O(1).
    Time O(V + E), Space O(V + E).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Start with <b>n singletons</b>; every edge that unites two different sets drops the component count by one.</p>
      <div class="vz-flow"><span class="vz-step">n singletons</span><span class="vz-arr">&rarr;</span><span class="vz-step">union each edge</span><span class="vz-arr">&rarr;</span><span class="vz-step">united two sets &rarr; count &minus; 1</span><span class="vz-arr">&rarr;</span><span class="vz-step win">remaining count</span></div>
    </div>
    ===
    3-6 | Start with n separate components.
    ===
    7-11 | Each edge uniting two sets drops the count by one.
    ===
    12-27 | What remains is the component count.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    assert_eq!(count_components(5, &[[0, 1], [1, 2], [3, 4]]), 2);
    assert_eq!(count_components(5, &[[0, 1], [1, 2], [2, 3], [3, 4]]), 1);
    assert_eq!(count_components(4, &[]), 4);

- instruction: |
    Redundant Connection. A tree on nodes 1..=n had one extra edge added, making
    exactly one cycle. Write
    `find_redundant_connection(edges: &[[usize; 2]]) -> [usize; 2]` returning the
    edge that, if removed, restores a tree (the last such edge in input order).
    Example: [[1,2],[1,3],[2,3]] -> [2, 3].
  starter: |
    fn find_redundant_connection(edges: &[[usize; 2]]) -> [usize; 2] {

    }
  solution: |
    fn find_redundant_connection(edges: &[[usize; 2]]) -> [usize; 2] {
        let n = edges.len();
        let mut parent: Vec<usize> = (0..=n).collect();
        for &[a, b] in edges {
            let ra = find(&mut parent, a);
            let rb = find(&mut parent, b);
            if ra == rb {
                return [a, b];
            }
            parent[ra] = rb;
        }
        [0, 0]
    }

    fn find(parent: &mut [usize], x: usize) -> usize {
        let mut root = x;
        while parent[root] != root {
            root = parent[root];
        }
        let mut cur = x;
        while parent[cur] != root {
            let next = parent[cur];
            parent[cur] = root;
            cur = next;
        }
        root
    }
  notes: |
    Union nodes edge by edge; the first edge whose endpoints are ALREADY in the
    same set closes the cycle, and since there is exactly one extra edge that is the
    one to remove. Nodes are 1-indexed, so size the parent array 0..=n.
    Time O(V + E), Space O(V + E).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Union nodes edge by edge; the <b>first edge whose endpoints are already connected</b> closes the cycle — that's the one to remove.</p>
      <div class="vz-flow"><span class="vz-step">union edges in order</span><span class="vz-arr">&rarr;</span><span class="vz-step">endpoints already joined?</span><span class="vz-arr">&rarr;</span><span class="vz-step">that edge closes a cycle</span><span class="vz-arr">&rarr;</span><span class="vz-step win">return it</span></div>
    </div>
    ===
    3-6 | Union-find over the 1-indexed nodes.
    ===
    7 | The first edge whose endpoints are already connected closes the cycle.
    ===
    8-27 | That edge is the redundant one.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    assert_eq!(find_redundant_connection(&[[1, 2], [1, 3], [2, 3]]), [2, 3]);
    assert_eq!(
        find_redundant_connection(&[[1, 2], [2, 3], [3, 4], [1, 4], [1, 5]]),
        [1, 4]
    );

- instruction: |
    Word Ladder. Write
    `ladder_length(begin_word: &str, end_word: &str, word_list: &[String]) -> i32`:
    the length of the shortest transformation sequence from begin to end where each
    step changes one letter and every intermediate word is in the list. Return 0 if
    impossible (the count includes both endpoints).
    Example: ("hit", "cog", ["hot","dot","dog","lot","log","cog"]) -> 5.
  starter: |
    use std::collections::{HashSet, VecDeque};

    fn ladder_length(begin_word: &str, end_word: &str, word_list: &[String]) -> i32 {

    }
  solution: |
    use std::collections::{HashSet, VecDeque};

    fn ladder_length(begin_word: &str, end_word: &str, word_list: &[String]) -> i32 {
        let mut unused: HashSet<String> = word_list.iter().cloned().collect();
        if !unused.contains(end_word) {
            return 0;
        }
        let mut queue: VecDeque<String> = VecDeque::new();
        queue.push_back(begin_word.to_string());
        unused.remove(begin_word);
        let mut steps = 1;
        while !queue.is_empty() {
            for _ in 0..queue.len() {
                let word = queue.pop_front().unwrap();
                if word == end_word {
                    return steps;
                }
                let mut chars: Vec<char> = word.chars().collect();
                for i in 0..chars.len() {
                    let original = chars[i];
                    for c in 'a'..='z' {
                        if c == original {
                            continue;
                        }
                        chars[i] = c;
                        let candidate: String = chars.iter().collect();
                        if unused.remove(&candidate) {
                            queue.push_back(candidate);
                        }
                    }
                    chars[i] = original;
                }
            }
            steps += 1;
        }
        0
    }
  notes: |
    BFS over the implicit graph where words one letter apart are adjacent. Generate
    neighbours by trying each of 26 letters at every position, consuming words from
    a "not yet visited" set so each is enqueued once. Level count = path length.
    Time O(N * L * L), Space O(N * L).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>BFS over the implicit graph where words <b>one letter apart</b> are adjacent. Generate neighbours by trying each of 26 letters at every position, consuming each from an unvisited set. Levels = path length.</p>
      <div class="vz-flow"><span class="vz-step">BFS from the begin word</span><span class="vz-arr">&rarr;</span><span class="vz-step">swap each letter a&ndash;z</span><span class="vz-arr">&rarr;</span><span class="vz-step">new word in the set? enqueue</span><span class="vz-arr">&rarr;</span><span class="vz-step win">level count = length</span></div>
    </div>
    ===
    4-12 | BFS over words; 'unused' is the not-yet-visited set.
    ===
    13-14 | Process one BFS level (= one transformation step).
    ===
    15-20 | Reached the target -> return the level count.
    ===
    21-37 | Neighbours = words one letter different, taken from the set.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let list: Vec<String> = ["hot", "dot", "dog", "lot", "log", "cog"]
        .iter()
        .map(|s| s.to_string())
        .collect();
    assert_eq!(ladder_length("hit", "cog", &list), 5);
    let list2: Vec<String> = ["hot", "dot", "dog", "lot", "log"]
        .iter()
        .map(|s| s.to_string())
        .collect();
    assert_eq!(ladder_length("hit", "cog", &list2), 0);
