- instruction: |
    Number of Islands. Write `num_islands(grid: &mut Vec<Vec<char>>) -> i32`:
    count groups of horizontally/vertically connected '1' (land) cells, with '0'
    being water.
    Example: [['1','1','0'],['0','1','0'],['0','0','1']] -> 2.
  starter: |
    fn num_islands(grid: &mut Vec<Vec<char>>) -> i32 {

    }
  solution: |
    fn num_islands(grid: &mut Vec<Vec<char>>) -> i32 {
        let rows = grid.len();
        let cols = if rows == 0 { 0 } else { grid[0].len() };
        let mut count = 0;
        for r in 0..rows {
            for c in 0..cols {
                if grid[r][c] == '1' {
                    count += 1;
                    sink(grid, r, c);
                }
            }
        }
        count
    }

    fn sink(grid: &mut Vec<Vec<char>>, r: usize, c: usize) {
        if grid[r][c] != '1' {
            return;
        }
        grid[r][c] = '0';
        if r > 0 {
            sink(grid, r - 1, c);
        }
        if r + 1 < grid.len() {
            sink(grid, r + 1, c);
        }
        if c > 0 {
            sink(grid, r, c - 1);
        }
        if c + 1 < grid[0].len() {
            sink(grid, r, c + 1);
        }
    }
  notes: |
    Scan for an unvisited land cell, then flood-fill (DFS) it to '0' so the whole
    island is consumed once; each new flood marks one more island.
    Time O(rows * cols), Space O(rows * cols).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Scan for an unvisited land cell, then <b>flood-fill</b> (DFS) the whole island to water so it's counted once. Each fresh flood is one more island.</p>
      <div class="vz-flow"><span class="vz-step">scan for a '1'</span><span class="vz-arr">&rarr;</span><span class="vz-step">flood-fill the island to '0'</span><span class="vz-arr">&rarr;</span><span class="vz-step">+1 island</span><span class="vz-arr">&rarr;</span><span class="vz-step win">keep scanning</span></div>
    </div>
    ===
    7-8 | Find an unvisited land cell -> a new island.
    ===
    9-19 | Flood-fill the whole island to water so it's counted once.
    ===
    20-33 | sink: mark land visited, then spread to 4 neighbours.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let mut g = vec![
        vec!['1', '1', '0'],
        vec!['0', '1', '0'],
        vec!['0', '0', '1'],
    ];
    assert_eq!(num_islands(&mut g), 2);
    let mut g2 = vec![
        vec!['1', '1', '1', '1', '0'],
        vec!['1', '1', '0', '1', '0'],
        vec!['1', '1', '0', '0', '0'],
        vec!['0', '0', '0', '0', '0'],
    ];
    assert_eq!(num_islands(&mut g2), 1);
    let mut empty: Vec<Vec<char>> = vec![];
    assert_eq!(num_islands(&mut empty), 0);

- instruction: |
    Max Area of Island. Write `max_area_of_island(grid: &mut Vec<Vec<i32>>) -> i32`:
    the largest count of connected 1-cells (4-directionally), or 0 if there is no
    land.
    Example: [[0,1,0],[1,1,0],[0,0,1]] -> 3.
  starter: |
    fn max_area_of_island(grid: &mut Vec<Vec<i32>>) -> i32 {

    }
  solution: |
    fn max_area_of_island(grid: &mut Vec<Vec<i32>>) -> i32 {
        let rows = grid.len();
        let cols = if rows == 0 { 0 } else { grid[0].len() };
        let mut best = 0;
        for r in 0..rows {
            for c in 0..cols {
                if grid[r][c] == 1 {
                    best = best.max(area(grid, r, c));
                }
            }
        }
        best
    }

    fn area(grid: &mut Vec<Vec<i32>>, r: usize, c: usize) -> i32 {
        if grid[r][c] != 1 {
            return 0;
        }
        grid[r][c] = 0;
        let mut a = 1;
        if r > 0 {
            a += area(grid, r - 1, c);
        }
        if r + 1 < grid.len() {
            a += area(grid, r + 1, c);
        }
        if c > 0 {
            a += area(grid, r, c - 1);
        }
        if c + 1 < grid[0].len() {
            a += area(grid, r, c + 1);
        }
        a
    }
  notes: |
    Same flood-fill as counting islands, but the DFS returns the size of the
    component (1 plus its neighbours) and we keep the running maximum.
    Time O(rows * cols), Space O(rows * cols).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Same flood-fill, but the DFS <b>returns the component's size</b> (1 + its neighbours); track the running maximum.</p>
      <div class="vz-flow"><span class="vz-step">flood-fill each island</span><span class="vz-arr">&rarr;</span><span class="vz-step">DFS returns its size</span><span class="vz-arr">&rarr;</span><span class="vz-step win">track the maximum</span></div>
    </div>
    ===
    8-18 | Flood-fill each island, tracking the largest.
    ===
    19 | area: mark visited...
    ===
    20-34 | ...count this cell plus all connected neighbours.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let mut g = vec![vec![0, 1, 0], vec![1, 1, 0], vec![0, 0, 1]];
    assert_eq!(max_area_of_island(&mut g), 3);
    let mut zero = vec![vec![0, 0], vec![0, 0]];
    assert_eq!(max_area_of_island(&mut zero), 0);

- instruction: |
    Clone Graph. The graph is modelled as a 0-indexed adjacency list
    `adj: &[Vec<usize>]` (this avoids Rc/RefCell node objects). Write
    `clone_graph(adj: &[Vec<usize>]) -> Vec<Vec<usize>>` returning a deep copy that
    is structurally equal to the input.
    Example: [[1,2],[0,2],[0,1]] -> [[1,2],[0,2],[0,1]].
  starter: |
    fn clone_graph(adj: &[Vec<usize>]) -> Vec<Vec<usize>> {

    }
  solution: |
    fn clone_graph(adj: &[Vec<usize>]) -> Vec<Vec<usize>> {
        adj.to_vec()
    }
  notes: |
    With the graph as an adjacency list, a deep copy is just a fresh owned copy of
    every neighbour list — no shared references survive. The classic Rc/RefCell
    version would BFS/DFS building old-node -> new-node mappings; here the indices
    already give that mapping, so the structure is preserved by construction.
    Time O(V + E), Space O(V + E).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>With the graph as an <b>adjacency list</b>, a deep copy is just a fresh owned copy of every neighbour list — indices already encode the structure.</p>
      <div class="vz-flow"><span class="vz-step">graph as adjacency list</span><span class="vz-arr">&rarr;</span><span class="vz-step">copy every neighbour list</span><span class="vz-arr">&rarr;</span><span class="vz-step win">indices preserve the shape</span></div>
    </div>
    ===
    2-3 | As an adjacency list, a deep copy is just an owned copy of the neighbour lists.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let adj = vec![vec![1, 2], vec![0, 2], vec![0, 1]];
    let cloned = clone_graph(&adj);
    assert_eq!(cloned, adj);
    let empty: Vec<Vec<usize>> = vec![];
    assert_eq!(clone_graph(&empty), empty);

- instruction: |
    Walls and Gates. Write `walls_and_gates(rooms: &mut [Vec<i32>])`: each cell
    is -1 (wall), 0 (gate), or i32::MAX (empty). Fill every empty room with the
    distance to its nearest gate (unreachable rooms stay i32::MAX).
    Example: [[i32::MAX,0],[-1,i32::MAX]] -> [[1,0],[-1,2]].
  starter: |
    use std::collections::VecDeque;

    fn walls_and_gates(rooms: &mut [Vec<i32>]) {

    }
  solution: |
    use std::collections::VecDeque;

    fn walls_and_gates(rooms: &mut [Vec<i32>]) {
        let rows = rooms.len();
        let cols = if rows == 0 { 0 } else { rooms[0].len() };
        let mut queue: VecDeque<(usize, usize)> = VecDeque::new();
        for (r, row) in rooms.iter().enumerate() {
            for (c, &val) in row.iter().enumerate() {
                if val == 0 {
                    queue.push_back((r, c));
                }
            }
        }
        while let Some((r, c)) = queue.pop_front() {
            let d = rooms[r][c];
            let mut step = |nr: usize, nc: usize, q: &mut VecDeque<(usize, usize)>| {
                if rooms[nr][nc] == i32::MAX {
                    rooms[nr][nc] = d + 1;
                    q.push_back((nr, nc));
                }
            };
            if r > 0 {
                step(r - 1, c, &mut queue);
            }
            if r + 1 < rows {
                step(r + 1, c, &mut queue);
            }
            if c > 0 {
                step(r, c - 1, &mut queue);
            }
            if c + 1 < cols {
                step(r, c + 1, &mut queue);
            }
        }
    }
  notes: |
    Multi-source BFS: seed the queue with every gate (distance 0) at once. Because
    BFS expands in layers, the first time a room is reached is via its nearest gate,
    so each empty cell is set exactly once.
    Time O(rows * cols), Space O(rows * cols).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Multi-source BFS: seed the queue with <b>every gate</b> at distance 0. BFS expands in layers, so each room is first reached via its nearest gate.</p>
      <div class="vz-flow"><span class="vz-step">queue all gates (dist 0)</span><span class="vz-arr">&rarr;</span><span class="vz-step">BFS outward in layers</span><span class="vz-arr">&rarr;</span><span class="vz-step">first reach = nearest gate</span><span class="vz-arr">&rarr;</span><span class="vz-step win">fill each room once</span></div>
    </div>
    ===
    9-13 | Seed the BFS queue with every gate (distance 0).
    ===
    14-16 | BFS outward in layers.
    ===
    17-35 | First time a room is reached is via its nearest gate.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let inf = i32::MAX;
    let mut rooms = vec![
        vec![inf, -1, 0, inf],
        vec![inf, inf, inf, -1],
        vec![inf, -1, inf, -1],
        vec![0, -1, inf, inf],
    ];
    walls_and_gates(&mut rooms);
    assert_eq!(
        rooms,
        vec![
            vec![3, -1, 0, 1],
            vec![2, 2, 1, -1],
            vec![1, -1, 2, -1],
            vec![0, -1, 3, 4],
        ]
    );

- instruction: |
    Rotting Oranges. Write `oranges_rotting(grid: &mut [Vec<i32>]) -> i32`:
    cells are 0 (empty), 1 (fresh), 2 (rotten). Each minute a rotten orange rots
    its 4-directional fresh neighbours. Return the minutes until none are fresh, or
    -1 if some can never rot.
    Example: [[2,1,1],[1,1,0],[0,1,1]] -> 4.
  starter: |
    use std::collections::VecDeque;

    fn oranges_rotting(grid: &mut [Vec<i32>]) -> i32 {

    }
  solution: |
    use std::collections::VecDeque;

    fn oranges_rotting(grid: &mut [Vec<i32>]) -> i32 {
        let rows = grid.len();
        let cols = if rows == 0 { 0 } else { grid[0].len() };
        let mut queue: VecDeque<(usize, usize)> = VecDeque::new();
        let mut fresh = 0;
        for (r, row) in grid.iter().enumerate() {
            for (c, &val) in row.iter().enumerate() {
                match val {
                    2 => queue.push_back((r, c)),
                    1 => fresh += 1,
                    _ => {}
                }
            }
        }
        let mut minutes = 0;
        while !queue.is_empty() && fresh > 0 {
            for _ in 0..queue.len() {
                let (r, c) = queue.pop_front().unwrap();
                let mut step = |nr: usize, nc: usize, q: &mut VecDeque<(usize, usize)>, f: &mut i32| {
                    if grid[nr][nc] == 1 {
                        grid[nr][nc] = 2;
                        *f -= 1;
                        q.push_back((nr, nc));
                    }
                };
                if r > 0 {
                    step(r - 1, c, &mut queue, &mut fresh);
                }
                if r + 1 < rows {
                    step(r + 1, c, &mut queue, &mut fresh);
                }
                if c > 0 {
                    step(r, c - 1, &mut queue, &mut fresh);
                }
                if c + 1 < cols {
                    step(r, c + 1, &mut queue, &mut fresh);
                }
            }
            minutes += 1;
        }
        if fresh == 0 {
            minutes
        } else {
            -1
        }
    }
  notes: |
    Multi-source BFS where each "level" is one minute: drain the whole current
    queue before incrementing the clock. Track the fresh count; if any remain when
    the queue empties they are unreachable, so return -1.
    Time O(rows * cols), Space O(rows * cols).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Multi-source BFS where each layer is <b>one minute</b>: drain the whole current queue before ticking the clock. Track the fresh count; leftovers mean &minus;1.</p>
      <div class="vz-flow"><span class="vz-step">queue all rotten (minute 0)</span><span class="vz-arr">&rarr;</span><span class="vz-step">rot neighbours layer by layer</span><span class="vz-arr">&rarr;</span><span class="vz-step">tick after each layer</span><span class="vz-arr">&rarr;</span><span class="vz-step win">fresh left &rarr; &minus;1</span></div>
    </div>
    ===
    11-17 | Queue all rotten oranges; count the fresh ones.
    ===
    18 | Each loop is one minute...
    ===
    19-42 | ...drain the whole current layer, rotting fresh neighbours.
    ===
    43-48 | All rotted -> minutes; leftovers -> -1.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let mut g = vec![vec![2, 1, 1], vec![1, 1, 0], vec![0, 1, 1]];
    assert_eq!(oranges_rotting(&mut g), 4);
    let mut unreach = vec![vec![2, 1, 1], vec![0, 1, 1], vec![1, 0, 1]];
    assert_eq!(oranges_rotting(&mut unreach), -1);
    let mut none_fresh = vec![vec![0, 2]];
    assert_eq!(oranges_rotting(&mut none_fresh), 0);

- instruction: |
    Pacific Atlantic Water Flow. The Pacific touches the top and left edges, the
    Atlantic the bottom and right. Water flows from a cell to an equal-or-lower
    neighbour. Write `pacific_atlantic(heights: &[Vec<i32>]) -> Vec<[usize; 2]>`
    listing [row, col] of cells that can reach BOTH oceans (any order).
    Example: a 5x5 grid -> its border-reachable overlap.
  starter: |
    fn pacific_atlantic(heights: &[Vec<i32>]) -> Vec<[usize; 2]> {

    }
  solution: |
    fn pacific_atlantic(heights: &[Vec<i32>]) -> Vec<[usize; 2]> {
        let rows = heights.len();
        let cols = if rows == 0 { 0 } else { heights[0].len() };
        if rows == 0 || cols == 0 {
            return Vec::new();
        }
        let mut pacific = vec![vec![false; cols]; rows];
        let mut atlantic = vec![vec![false; cols]; rows];
        for r in 0..rows {
            flow(heights, &mut pacific, r, 0);
            flow(heights, &mut atlantic, r, cols - 1);
        }
        for c in 0..cols {
            flow(heights, &mut pacific, 0, c);
            flow(heights, &mut atlantic, rows - 1, c);
        }
        let mut res = Vec::new();
        for r in 0..rows {
            for c in 0..cols {
                if pacific[r][c] && atlantic[r][c] {
                    res.push([r, c]);
                }
            }
        }
        res
    }

    fn flow(heights: &[Vec<i32>], seen: &mut Vec<Vec<bool>>, r: usize, c: usize) {
        if seen[r][c] {
            return;
        }
        seen[r][c] = true;
        let h = heights[r][c];
        if r > 0 && heights[r - 1][c] >= h {
            flow(heights, seen, r - 1, c);
        }
        if r + 1 < heights.len() && heights[r + 1][c] >= h {
            flow(heights, seen, r + 1, c);
        }
        if c > 0 && heights[r][c - 1] >= h {
            flow(heights, seen, r, c - 1);
        }
        if c + 1 < heights[0].len() && heights[r][c + 1] >= h {
            flow(heights, seen, r, c + 1);
        }
    }
  notes: |
    Instead of testing every cell, run DFS INWARD from each ocean's border,
    climbing to equal-or-higher neighbours (the reverse of water flow). A cell
    reaches an ocean iff that ocean's flood marked it; the answer is the overlap.
    Time O(rows * cols), Space O(rows * cols).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Instead of testing every cell, flood <b>inward from each ocean's border</b>, climbing to equal-or-higher neighbours. A cell reaches both oceans iff both floods marked it.</p>
      <div class="vz-flow"><span class="vz-step">flood inward from each ocean</span><span class="vz-arr">&rarr;</span><span class="vz-step">climb to &ge; neighbours</span><span class="vz-arr">&rarr;</span><span class="vz-step">mark reachable cells</span><span class="vz-arr">&rarr;</span><span class="vz-step win">overlap = answer</span></div>
    </div>
    ===
    10-19 | Flood inward from each ocean's border.
    ===
    20-27 | Cells reached by both oceans are the answer.
    ===
    28-46 | flow: climb to equal-or-higher neighbours (reverse of water flow).
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let heights = vec![
        vec![1, 2, 2, 3, 5],
        vec![3, 2, 3, 4, 4],
        vec![2, 4, 5, 3, 1],
        vec![6, 7, 1, 4, 5],
        vec![5, 1, 1, 2, 4],
    ];
    let mut got = pacific_atlantic(&heights);
    got.sort();
    let mut want = vec![
        [0, 4],
        [1, 3],
        [1, 4],
        [2, 2],
        [3, 0],
        [3, 1],
        [4, 0],
    ];
    want.sort();
    assert_eq!(got, want);

- instruction: |
    Surrounded Regions. Write `solve(board: &mut Vec<Vec<char>>)`: flip every 'O'
    that is NOT connected (4-directionally) to a border 'O' into 'X'. Border-
    touching regions stay 'O'.
    Example: a board whose only safe O's are on/attached to the edge.
  starter: |
    fn solve(board: &mut Vec<Vec<char>>) {

    }
  solution: |
    fn solve(board: &mut Vec<Vec<char>>) {
        let rows = board.len();
        let cols = if rows == 0 { 0 } else { board[0].len() };
        if rows == 0 || cols == 0 {
            return;
        }
        for r in 0..rows {
            mark(board, r, 0);
            mark(board, r, cols - 1);
        }
        for c in 0..cols {
            mark(board, 0, c);
            mark(board, rows - 1, c);
        }
        for row in board.iter_mut() {
            for cell in row.iter_mut() {
                *cell = match *cell {
                    'S' => 'O',
                    _ => 'X',
                };
            }
        }
    }

    fn mark(board: &mut Vec<Vec<char>>, r: usize, c: usize) {
        if board[r][c] != 'O' {
            return;
        }
        board[r][c] = 'S';
        if r > 0 {
            mark(board, r - 1, c);
        }
        if r + 1 < board.len() {
            mark(board, r + 1, c);
        }
        if c > 0 {
            mark(board, r, c - 1);
        }
        if c + 1 < board[0].len() {
            mark(board, r, c + 1);
        }
    }
  notes: |
    Invert the problem: the O's that SURVIVE are exactly those reachable from a
    border O. Flood those to a temporary 'S', then sweep once — 'S' becomes 'O',
    everything else becomes 'X'.
    Time O(rows * cols), Space O(rows * cols).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Invert it: the O's that <b>survive</b> are those reachable from a border O. Flood those to a temporary mark, then sweep — temp &rarr; O, every other O &rarr; X.</p>
      <div class="vz-flow"><span class="vz-step">flood border O's to a temp</span><span class="vz-arr">&rarr;</span><span class="vz-step">sweep the board</span><span class="vz-arr">&rarr;</span><span class="vz-step">temp &rarr; O</span><span class="vz-arr">&rarr;</span><span class="vz-step win">other O &rarr; X</span></div>
    </div>
    ===
    7-16 | Flood every border-connected 'O' to a temporary 'S'.
    ===
    17-24 | Then sweep: 'S' -> 'O' (survivors), every other 'O' -> 'X'.
    ===
    25-42 | mark: DFS the connected region of border O's.
  source: "NeetCode 150 · Graphs"
  tags: [rust, neetcode, graphs]
  tests: |
    let mut board = vec![
        vec!['X', 'X', 'X', 'X'],
        vec!['X', 'O', 'O', 'X'],
        vec!['X', 'X', 'O', 'X'],
        vec!['X', 'O', 'X', 'X'],
    ];
    solve(&mut board);
    assert_eq!(
        board,
        vec![
            vec!['X', 'X', 'X', 'X'],
            vec!['X', 'X', 'X', 'X'],
            vec!['X', 'X', 'X', 'X'],
            vec!['X', 'O', 'X', 'X'],
        ]
    );

- instruction: |
    Course Schedule. Write `can_finish(num_courses: usize, prerequisites: &[[usize; 2]]) -> bool`:
    each pair [a, b] means b must be taken before a. Return true iff all courses
    can be completed (the prerequisite graph has no cycle).
    Example: (2, [[1, 0]]) -> true; (2, [[1, 0], [0, 1]]) -> false.
  starter: |
    fn can_finish(num_courses: usize, prerequisites: &[[usize; 2]]) -> bool {

    }
  solution: |
    fn can_finish(num_courses: usize, prerequisites: &[[usize; 2]]) -> bool {
        let mut adj: Vec<Vec<usize>> = vec![Vec::new(); num_courses];
        let mut indegree = vec![0usize; num_courses];
        for &[a, b] in prerequisites {
            adj[b].push(a);
            indegree[a] += 1;
        }
        let mut stack: Vec<usize> = (0..num_courses).filter(|&i| indegree[i] == 0).collect();
        let mut taken = 0;
        while let Some(node) = stack.pop() {
            taken += 1;
            for &next in &adj[node] {
                indegree[next] -= 1;
                if indegree[next] == 0 {
                    stack.push(next);
                }
            }
        }
        taken == num_courses
    }
  notes: |
    Kahn's algorithm: repeatedly remove a course with no remaining prerequisites.
    If a cycle exists, those courses never reach indegree 0, so fewer than
    `num_courses` are processed.
    Time O(V + E), Space O(V + E).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Topological sort (Kahn's): repeatedly remove a course with <b>no remaining prerequisites</b>. A cycle leaves some courses stuck, so fewer than all get processed.</p>
      <div class="vz-flow"><span class="vz-step">build prereq graph + indegrees</span><span class="vz-arr">&rarr;</span><span class="vz-step">take indegree-0 courses</span><span class="vz-arr">&rarr;</span><span class="vz-step">decrement their neighbours</span><span class="vz-arr">&rarr;</span><span class="vz-step win">all taken? &rarr; true</span></div>
    </div>
    ===
    4-7 | Build the prerequisite graph and indegrees.
    ===
    8-9 | Start with courses that have no prerequisites.
    ===
    10-18 | Remove them, decrementing dependents (Kahn's).
    ===
    19-20 | All taken -> no cycle -> true.
  source: "NeetCode 150 · Graphs"
