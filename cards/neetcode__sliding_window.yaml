# NeetCode 150 — Sliding Window. Original prompts; idiomatic, clippy-clean
# Rust; example tests run by `python check_cards.py`.
- instruction: |
    Best Time to Buy and Sell Stock. Write `max_profit(prices: &[i32]) -> i32`:
    given daily prices, return the most profit from one buy followed by a later
    sell, or 0 if no profit is possible.
    Example: [7, 1, 5, 3, 6, 4] -> 5 (buy at 1, sell at 6).
  starter: |
    fn max_profit(prices: &[i32]) -> i32 {

    }
  solution: |
    fn max_profit(prices: &[i32]) -> i32 {
        let mut min_so_far = i32::MAX;
        let mut best = 0;
        for &p in prices {
            min_so_far = min_so_far.min(p);
            best = best.max(p - min_so_far);
        }
        best
    }
  notes: |
    Track the lowest price seen so far (the best day to have bought); each day the
    candidate profit is today's price minus that minimum. One pass.
    Time O(n), Space O(1).
  source: "NeetCode 150 · Sliding Window"
  tags: [rust, neetcode, sliding-window]
  tests: |
    assert_eq!(max_profit(&[7, 1, 5, 3, 6, 4]), 5);
    assert_eq!(max_profit(&[7, 6, 4, 3, 1]), 0);
    assert_eq!(max_profit(&[1]), 0);
    assert_eq!(max_profit(&[]), 0);

- instruction: |
    Longest Substring Without Repeating Characters. Write
    `length_of_longest_substring(s: &str) -> usize`: the length of the longest
    substring of `s` with all distinct characters.
    Example: "abcabcbb" -> 3 ("abc"); "bbbbb" -> 1.
  starter: |
    use std::collections::HashMap;

    fn length_of_longest_substring(s: &str) -> usize {

    }
  solution: |
    use std::collections::HashMap;

    fn length_of_longest_substring(s: &str) -> usize {
        let mut last: HashMap<char, usize> = HashMap::new();
        let mut start = 0;
        let mut best = 0;
        for (i, c) in s.chars().enumerate() {
            if let Some(&prev) = last.get(&c) {
                if prev >= start {
                    start = prev + 1;
                }
            }
            last.insert(c, i);
            best = best.max(i - start + 1);
        }
        best
    }
  notes: |
    Slide a window; when a repeat appears whose last position is inside the window,
    jump `start` just past it. Storing each char's last index lets the window move
    in O(1) amortised.
    Time O(n), Space O(n).
  source: "NeetCode 150 · Sliding Window"
  tags: [rust, neetcode, sliding-window]
  tests: |
    assert_eq!(length_of_longest_substring("abcabcbb"), 3);
    assert_eq!(length_of_longest_substring("bbbbb"), 1);
    assert_eq!(length_of_longest_substring("pwwkew"), 3);
    assert_eq!(length_of_longest_substring(""), 0);

- instruction: |
    Longest Repeating Character Replacement. Write
    `character_replacement(s: &str, k: usize) -> usize`: the length of the longest
    substring you can make all one character by replacing at most `k` characters.
    Example: ("AABABBA", 1) -> 4.
  starter: |
    fn character_replacement(s: &str, k: usize) -> usize {

    }
  solution: |
    fn character_replacement(s: &str, k: usize) -> usize {
        let bytes = s.as_bytes();
        let mut counts = [0usize; 26];
        let mut start = 0;
        let mut max_count = 0;
        let mut best = 0;
        for (end, &b) in bytes.iter().enumerate() {
            let idx = (b - b'A') as usize;
            counts[idx] += 1;
            max_count = max_count.max(counts[idx]);
            while (end - start + 1) - max_count > k {
                counts[(bytes[start] - b'A') as usize] -= 1;
                start += 1;
            }
            best = best.max(end - start + 1);
        }
        best
    }
  notes: |
    A window is valid when (its length - count of its most frequent char) <= k,
    i.e. the others can all be replaced. Grow the window, shrinking from the left
    only when that condition breaks. Assumes uppercase A-Z.
    Time O(n), Space O(1).
  source: "NeetCode 150 · Sliding Window"
  tags: [rust, neetcode, sliding-window]
  tests: |
    assert_eq!(character_replacement("AABABBA", 1), 4);
    assert_eq!(character_replacement("ABAB", 2), 4);
    assert_eq!(character_replacement("AAAA", 0), 4);
    assert_eq!(character_replacement("", 2), 0);

- instruction: |
    Permutation in String. Write `check_inclusion(s1: &str, s2: &str) -> bool`:
    true if `s2` contains a substring that is a permutation of `s1`.
    Assume lowercase a-z.
    Example: ("ab", "eidbaooo") -> true ("ba"); ("ab", "eidboaoo") -> false.
  starter: |
    fn check_inclusion(s1: &str, s2: &str) -> bool {

    }
  solution: |
    fn check_inclusion(s1: &str, s2: &str) -> bool {
        let n = s1.len();
        let hay = s2.as_bytes();
        if n == 0 {
            return true;
        }
        if n > hay.len() {
            return false;
        }
        let mut need = [0i32; 26];
        for &b in s1.as_bytes() {
            need[(b - b'a') as usize] += 1;
        }
        let mut window = [0i32; 26];
        for (i, &b) in hay.iter().enumerate() {
            window[(b - b'a') as usize] += 1;
            if i >= n {
                window[(hay[i - n] - b'a') as usize] -= 1;
            }
            if i + 1 >= n && window == need {
                return true;
            }
        }
        false
    }
  notes: |
    A permutation is just a matching letter histogram. Slide a fixed window of
    length `s1.len()` across `s2`, adding the new byte and dropping the one that
    fell off, and compare the 26-count arrays (each comparison O(1)).
    Time O(n), Space O(1).
  source: "NeetCode 150 · Sliding Window"
  tags: [rust, neetcode, sliding-window]
  tests: |
    assert!(check_inclusion("ab", "eidbaooo"));
    assert!(!check_inclusion("ab", "eidboaoo"));
    assert!(check_inclusion("adc", "dcda"));
    assert!(!check_inclusion("hello", "ooolleoooleh"));

- instruction: |
    Minimum Window Substring. Write `min_window(s: &str, t: &str) -> String`:
    the smallest substring of `s` that contains every character of `t` including
    multiplicities, or "" if none exists. Assume a unique answer if one exists.
    Example: ("ADOBECODEBANC", "ABC") -> "BANC".
  starter: |
    use std::collections::HashMap;

    fn min_window(s: &str, t: &str) -> String {

    }
  solution: |
    use std::collections::HashMap;

    fn min_window(s: &str, t: &str) -> String {
        if t.is_empty() || s.len() < t.len() {
            return String::new();
        }
        let mut need: HashMap<u8, i32> = HashMap::new();
        for &b in t.as_bytes() {
            *need.entry(b).or_insert(0) += 1;
        }
        let required = need.len();
        let bytes = s.as_bytes();
        let mut have = 0;
        let mut window: HashMap<u8, i32> = HashMap::new();
        let mut start = 0;
        let mut best: Option<(usize, usize)> = None;
        for (end, &b) in bytes.iter().enumerate() {
            let c = window.entry(b).or_insert(0);
            *c += 1;
            if need.get(&b).is_some_and(|&n| *c == n) {
                have += 1;
            }
            while have == required {
                if best.is_none_or(|(lo, hi)| end - start < hi - lo) {
                    best = Some((start, end));
                }
                let left = bytes[start];
                let wc = window.get_mut(&left).unwrap();
                *wc -= 1;
                if need.get(&left).is_some_and(|&n| *wc < n) {
                    have -= 1;
                }
                start += 1;
            }
        }
        match best {
            Some((lo, hi)) => s[lo..=hi].to_string(),
            None => String::new(),
        }
    }
  notes: |
    Expand the window until it covers all of `t` (tracked by how many distinct
    required chars have hit their needed count), then contract from the left to
    minimise it, recording the best span. Each index enters/leaves once.
    Time O(n), Space O(n).
  source: "NeetCode 150 · Sliding Window"
  tags: [rust, neetcode, sliding-window]
  tests: |
    assert_eq!(min_window("ADOBECODEBANC", "ABC"), "BANC");
    assert_eq!(min_window("a", "a"), "a");
    assert_eq!(min_window("a", "aa"), "");
    assert_eq!(min_window("ab", "b"), "b");

- instruction: |
    Sliding Window Maximum. Write
    `max_sliding_window(nums: &[i32], k: usize) -> Vec<i32>`: for each window of
    size `k` sliding left to right, the maximum in that window. Use a monotonic
    deque for O(n).
    Example: ([1,3,-1,-3,5,3,6,7], 3) -> [3, 3, 5, 5, 6, 7].
  starter: |
    use std::collections::VecDeque;

    fn max_sliding_window(nums: &[i32], k: usize) -> Vec<i32> {

    }
  solution: |
    use std::collections::VecDeque;

    fn max_sliding_window(nums: &[i32], k: usize) -> Vec<i32> {
        if k == 0 || nums.len() < k {
            return Vec::new();
        }
        let mut dq: VecDeque<usize> = VecDeque::new();
        let mut res = Vec::new();
        for (i, &n) in nums.iter().enumerate() {
            while let Some(&back) = dq.back() {
                if nums[back] <= n {
                    dq.pop_back();
                } else {
                    break;
                }
            }
            dq.push_back(i);
            if let Some(&front) = dq.front() {
                if front + k <= i {
                    dq.pop_front();
                }
            }
            if i + 1 >= k {
                res.push(nums[*dq.front().unwrap()]);
            }
        }
        res
    }
  notes: |
    The deque holds indices whose values are strictly decreasing, so its front is
    always the window's max. Pop smaller values off the back before pushing, and
    drop the front once it slides out of range. Each index is pushed/popped once.
    Time O(n), Space O(n).
  source: "NeetCode 150 · Sliding Window"
  tags: [rust, neetcode, sliding-window]
  tests: |
    assert_eq!(
        max_sliding_window(&[1, 3, -1, -3, 5, 3, 6, 7], 3),
        vec![3, 3, 5, 5, 6, 7]
    );
    assert_eq!(max_sliding_window(&[1], 1), vec![1]);
    assert_eq!(max_sliding_window(&[9, 11], 2), vec![11]);
    assert_eq!(max_sliding_window(&[4, 3, 2, 1], 2), vec![4, 3, 2]);
