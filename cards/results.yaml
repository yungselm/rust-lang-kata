# Result & Option handling — ?, the unwrap_or family, combinators, conversions.
# Eager (unwrap_or/ok_or) is used only with cheap values; lazy (_else) only when
# the closure does real work — this is what clippy enforces.
- instruction: |
    Write `first_num(s: &str) -> Result<i32, std::num::ParseIntError>`: parse s
    with `?`, then return Ok of twice the value.
  starter: |
    fn first_num(s: &str) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn first_num(s: &str) -> Result<i32, std::num::ParseIntError> {
        let n = s.parse::<i32>()?;
        Ok(n * 2)
    }
  notes: |
    `?` unwraps `Ok(v)` to `v`, or returns the `Err` early. The return type must
    be a `Result` whose error the `?` can produce.
  source: "book §9.2 (the ? operator)"
  tags: [rust, results, question-mark]

- instruction: |
    Write `parse_or(s: &str, default: i32) -> i32` returning the parsed value or
    `default` on failure.
  starter: |
    fn parse_or(s: &str, default: i32) -> i32 {

    }
  solution: |
    fn parse_or(s: &str, default: i32) -> i32 {
        s.parse::<i32>().unwrap_or(default)
    }
  notes: |
    `unwrap_or(x)` returns the inner value or `x`. Use the eager form when the
    default is already available and cheap (here, a parameter).
  source: "std Result::unwrap_or"
  tags: [rust, results, unwrap_or]

- instruction: |
    Write `parse_or_err_len(s: &str) -> usize`: parse `s` as a `usize`; on failure
    return the length of the parse error's message instead.
    Example: parse_or_err_len("42") -> 42; parse_or_err_len("x") -> the error length.
  starter: |
    fn parse_or_err_len(s: &str) -> usize {

    }
  solution: |
    fn parse_or_err_len(s: &str) -> usize {
        s.parse::<usize>().unwrap_or_else(|e| e.to_string().len())
    }
  notes: |
    `unwrap_or_else(|e| ...)` runs only on failure AND receives the error — the
    two reasons to pick it over `unwrap_or`. (For a cheap, error-independent
    default, clippy would tell you to use `unwrap_or`.)
  source: "std Result::unwrap_or_else"
  tags: [rust, results, unwrap_or_else]

- instruction: |
    Write `parse_or_default(s: &str) -> i32` returning the parsed value or the
    type's default.
  starter: |
    fn parse_or_default(s: &str) -> i32 {

    }
  solution: |
    fn parse_or_default(s: &str) -> i32 {
        s.parse::<i32>().unwrap_or_default()
    }
  notes: |
    `unwrap_or_default()` falls back to `Default::default()` (0 for i32, "" for
    String, empty Vec, ...).
  source: "std Result::unwrap_or_default"
  tags: [rust, results, unwrap_or_default]

- instruction: |
    Write `doubled(s: &str) -> Result<i32, std::num::ParseIntError>`: parse then
    double, using `map` (not `?`).
  starter: |
    fn doubled(s: &str) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn doubled(s: &str) -> Result<i32, std::num::ParseIntError> {
        s.parse::<i32>().map(|n| n * 2)
    }
  notes: |
    `Result::map` transforms the Ok value and leaves an Err untouched.
  source: "std Result::map"
  tags: [rust, results, map]

- instruction: |
    Write `parse_msg(s: &str) -> Result<i32, String>`: parse `s` as i32, and on
    failure use `map_err` to return the error as the message `"bad: <error>"`.
    Example: parse_msg("x") -> Err("bad: invalid digit found in string").
  starter: |
    fn parse_msg(s: &str) -> Result<i32, String> {

    }
  solution: |
    fn parse_msg(s: &str) -> Result<i32, String> {
        s.parse::<i32>().map_err(|e| format!("bad: {e}"))
    }
  notes: |
    `map_err` transforms the Err value (here changing its TYPE), leaving Ok
    untouched. Common for adapting library errors to your own.
  source: "std Result::map_err"
  tags: [rust, results, map_err]

- instruction: |
    Write `half_of(s: &str) -> Result<i32, String>`: parse (map error to String),
    then with `and_then` return n/2 if even, else Err("odd").
  starter: |
    fn half_of(s: &str) -> Result<i32, String> {

    }
  solution: |
    fn half_of(s: &str) -> Result<i32, String> {
        s.parse::<i32>()
            .map_err(|e| e.to_string())
            .and_then(|n| {
                if n % 2 == 0 {
                    Ok(n / 2)
                } else {
                    Err("odd".to_string())
                }
            })
    }
  notes: |
    `and_then` chains a second fallible step: it runs the closure only on Ok and
    the closure returns a `Result`, so errors short-circuit.
  source: "std Result::and_then"
  tags: [rust, results, and_then]

- instruction: |
    Write `get_first(v: &[i32]) -> Result<i32, &'static str>`: the first element,
    or `Err("empty")`. Convert the Option with `ok_or`.
  starter: |
    fn get_first(v: &[i32]) -> Result<i32, &'static str> {

    }
  solution: |
    fn get_first(v: &[i32]) -> Result<i32, &'static str> {
        v.first().copied().ok_or("empty")
    }
  notes: |
    `Option::ok_or(err)` turns `Some(v)` into `Ok(v)` and `None` into `Err(err)`.
    The eager `ok_or` is fine here because the error is a cheap `&'static str`.
  source: "std Option::ok_or"
  tags: [rust, results, ok_or, option]

- instruction: |
    Write `get_first_owned(v: &[i32]) -> Result<i32, String>`: return the first
    element as `Ok`, or an owned `Err("empty".to_string())` if the slice is empty.
    Build the error lazily (allocate only when the slice is actually empty).
    Example: get_first_owned(&[7, 8]) -> Ok(7); get_first_owned(&[]) -> Err("empty").
  starter: |
    fn get_first_owned(v: &[i32]) -> Result<i32, String> {

    }
  solution: |
    fn get_first_owned(v: &[i32]) -> Result<i32, String> {
        v.first().copied().ok_or_else(|| "empty".to_string())
    }
  notes: |
    Because the error ALLOCATES (`to_string`), use `ok_or_else` so it's built
    only on the `None` path. (Using eager `ok_or("empty".to_string())` would
    allocate every call — clippy's `or_fun_call` flags exactly that.)
  source: "std Option::ok_or_else"
  tags: [rust, results, ok_or_else]

- instruction: |
    Write `len_of(opt: Option<&str>) -> Option<usize>`: map the inner string to
    its length.
  starter: |
    fn len_of(opt: Option<&str>) -> Option<usize> {

    }
  solution: |
    fn len_of(opt: Option<&str>) -> Option<usize> {
        opt.map(|s| s.len())
    }
  source: "std Option::map"
  tags: [rust, results, option, map]

- instruction: |
    Write `first_char_upper(opt: Option<&str>) -> Option<char>`: first char of
    the inner string, uppercased. Combine `and_then` and `map`.
  starter: |
    fn first_char_upper(opt: Option<&str>) -> Option<char> {

    }
  solution: |
    fn first_char_upper(opt: Option<&str>) -> Option<char> {
        opt.and_then(|s| s.chars().next()).map(|c| c.to_ascii_uppercase())
    }
  notes: |
    `and_then` flattens (the closure returns another Option, avoiding
    `Option<Option<char>>`); `map` then transforms the char.
  source: "std Option::and_then"
  tags: [rust, results, option, and_then]

- instruction: |
    Write `first_plus_one(v: &[i32]) -> Option<i32>` using `?` on an Option:
    first element plus one, or None if empty.
  starter: |
    fn first_plus_one(v: &[i32]) -> Option<i32> {

    }
  solution: |
    fn first_plus_one(v: &[i32]) -> Option<i32> {
        let x = v.first()?;
        Some(x + 1)
    }
  notes: |
    `?` works on `Option` too: unwraps `Some` or returns `None` early. The
    function must return an `Option`.
  source: "book §9 / std Option"
  tags: [rust, results, question-mark, option]

- instruction: |
    Write `try_parse(s: &str) -> Option<i32>`: parse, discarding the error.
  starter: |
    fn try_parse(s: &str) -> Option<i32> {

    }
  solution: |
    fn try_parse(s: &str) -> Option<i32> {
        s.parse::<i32>().ok()
    }
  notes: |
    `Result::ok()` drops the error, converting `Result<T, E>` to `Option<T>`.
    (Mirror: `Option::ok_or` goes the other way.)
  source: "std Result::ok"
