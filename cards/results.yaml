# Result & Option handling — ?, the unwrap_or family, combinators, conversions.
# Eager (unwrap_or/ok_or) is used only with cheap values; lazy (_else) only when
# the closure does real work — this is what clippy enforces.
- instruction: |
    Write `first_num(s: &str) -> Result<i32, std::num::ParseIntError>`: parse s
    with `?`, then return Ok of twice the value.
  starter: |
    fn first_num(s: &str) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn first_num(s: &str) -> Result<i32, std::num::ParseIntError> {
        let n = s.parse::<i32>()?;
        Ok(n * 2)
    }
  notes: |
    `?` unwraps `Ok(v)` to `v`, or returns the `Err` early. The return type must
    be a `Result` whose error the `?` can produce.
  source: "book §9.2 (the ? operator)"
  tags: [rust, results, question-mark]

- instruction: |
    Write `parse_or(s: &str, default: i32) -> i32` returning the parsed value or
    `default` on failure.
  starter: |
    fn parse_or(s: &str, default: i32) -> i32 {

    }
  solution: |
    fn parse_or(s: &str, default: i32) -> i32 {
        s.parse::<i32>().unwrap_or(default)
    }
  notes: |
    `unwrap_or(x)` returns the inner value or `x`. Use the eager form when the
    default is already available and cheap (here, a parameter).
  source: "std Result::unwrap_or"
  tags: [rust, results, unwrap_or]

- instruction: |
    Write `parse_or_err_len(s: &str) -> usize`: the parsed usize, or — on failure
    — the length of the error message. Use the closure form so you can read the
    error.
  starter: |
    fn parse_or_err_len(s: &str) -> usize {

    }
  solution: |
    fn parse_or_err_len(s: &str) -> usize {
        s.parse::<usize>().unwrap_or_else(|e| e.to_string().len())
    }
  notes: |
    `unwrap_or_else(|e| ...)` runs only on failure AND receives the error — the
    two reasons to pick it over `unwrap_or`. (For a cheap, error-independent
    default, clippy would tell you to use `unwrap_or`.)
  source: "std Result::unwrap_or_else"
  tags: [rust, results, unwrap_or_else]

- instruction: |
    Write `parse_or_default(s: &str) -> i32` returning the parsed value or the
    type's default.
  starter: |
    fn parse_or_default(s: &str) -> i32 {

    }
  solution: |
    fn parse_or_default(s: &str) -> i32 {
        s.parse::<i32>().unwrap_or_default()
    }
  notes: |
    `unwrap_or_default()` falls back to `Default::default()` (0 for i32, "" for
    String, empty Vec, ...).
  source: "std Result::unwrap_or_default"
  tags: [rust, results, unwrap_or_default]

- instruction: |
    Write `doubled(s: &str) -> Result<i32, std::num::ParseIntError>`: parse then
    double, using `map` (not `?`).
  starter: |
    fn doubled(s: &str) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn doubled(s: &str) -> Result<i32, std::num::ParseIntError> {
        s.parse::<i32>().map(|n| n * 2)
    }
  notes: |
    `Result::map` transforms the Ok value and leaves an Err untouched.
  source: "std Result::map"
  tags: [rust, results, map]

- instruction: |
    Write `parse_msg(s: &str) -> Result<i32, String>`: parse, converting any
    error into a `String` message with `map_err`.
  starter: |
    fn parse_msg(s: &str) -> Result<i32, String> {

    }
  solution: |
    fn parse_msg(s: &str) -> Result<i32, String> {
        s.parse::<i32>().map_err(|e| format!("bad: {e}"))
    }
  notes: |
    `map_err` transforms the Err value (here changing its TYPE), leaving Ok
    untouched. Common for adapting library errors to your own.
  source: "std Result::map_err"
  tags: [rust, results, map_err]

- instruction: |
    Write `half_of(s: &str) -> Result<i32, String>`: parse (map error to String),
    then with `and_then` return n/2 if even, else Err("odd").
  starter: |
    fn half_of(s: &str) -> Result<i32, String> {

    }
  solution: |
    fn half_of(s: &str) -> Result<i32, String> {
        s.parse::<i32>()
            .map_err(|e| e.to_string())
            .and_then(|n| {
                if n % 2 == 0 {
                    Ok(n / 2)
                } else {
                    Err("odd".to_string())
                }
            })
    }
  notes: |
    `and_then` chains a second fallible step: it runs the closure only on Ok and
    the closure returns a `Result`, so errors short-circuit.
  source: "std Result::and_then"
  tags: [rust, results, and_then]

- instruction: |
    Write `get_first(v: &[i32]) -> Result<i32, &'static str>`: the first element,
    or `Err("empty")`. Convert the Option with `ok_or`.
  starter: |
    fn get_first(v: &[i32]) -> Result<i32, &'static str> {

    }
  solution: |
    fn get_first(v: &[i32]) -> Result<i32, &'static str> {
        v.first().copied().ok_or("empty")
    }
  notes: |
    `Option::ok_or(err)` turns `Some(v)` into `Ok(v)` and `None` into `Err(err)`.
    The eager `ok_or` is fine here because the error is a cheap `&'static str`.
  source: "std Option::ok_or"
  tags: [rust, results, ok_or, option]

- instruction: |
    Write `get_first_owned(v: &[i32]) -> Result<i32, String>` like the previous
    (the first elemnt or `Err("empty")`) but with an owned `String` error built 
    lazily via `ok_or_else`.
  starter: |
    fn get_first_owned(v: &[i32]) -> Result<i32, String> {

    }
  solution: |
    fn get_first_owned(v: &[i32]) -> Result<i32, String> {
        v.first().copied().ok_or_else(|| "empty".to_string())
    }
  notes: |
    Because the error ALLOCATES (`to_string`), use `ok_or_else` so it's built
    only on the `None` path. (Using eager `ok_or("empty".to_string())` would
    allocate every call — clippy's `or_fun_call` flags exactly that.)
  source: "std Option::ok_or_else"
  tags: [rust, results, ok_or_else]

- instruction: |
    Write `len_of(opt: Option<&str>) -> Option<usize>`: map the inner string to
    its length.
  starter: |
    fn len_of(opt: Option<&str>) -> Option<usize> {

    }
  solution: |
    fn len_of(opt: Option<&str>) -> Option<usize> {
        opt.map(|s| s.len())
    }
  source: "std Option::map"
  tags: [rust, results, option, map]

- instruction: |
    Write `first_char_upper(opt: Option<&str>) -> Option<char>`: first char of
    the inner string, uppercased. Combine `and_then` and `map`.
  starter: |
    fn first_char_upper(opt: Option<&str>) -> Option<char> {

    }
  solution: |
    fn first_char_upper(opt: Option<&str>) -> Option<char> {
        opt.and_then(|s| s.chars().next()).map(|c| c.to_ascii_uppercase())
    }
  notes: |
    `and_then` flattens (the closure returns another Option, avoiding
    `Option<Option<char>>`); `map` then transforms the char.
  source: "std Option::and_then"
  tags: [rust, results, option, and_then]

- instruction: |
    Write `first_plus_one(v: &[i32]) -> Option<i32>` using `?` on an Option:
    first element plus one, or None if empty.
  starter: |
    fn first_plus_one(v: &[i32]) -> Option<i32> {

    }
  solution: |
    fn first_plus_one(v: &[i32]) -> Option<i32> {
        let x = v.first()?;
        Some(x + 1)
    }
  notes: |
    `?` works on `Option` too: unwraps `Some` or returns `None` early. The
    function must return an `Option`.
  source: "book §9 / std Option"
  tags: [rust, results, question-mark, option]

- instruction: |
    Write `try_parse(s: &str) -> Option<i32>`: parse, discarding the error.
  starter: |
    fn try_parse(s: &str) -> Option<i32> {

    }
  solution: |
    fn try_parse(s: &str) -> Option<i32> {
        s.parse::<i32>().ok()
    }
  notes: |
    `Result::ok()` drops the error, converting `Result<T, E>` to `Option<T>`.
    (Mirror: `Option::ok_or` goes the other way.)
  source: "std Result::ok"
  tags: [rust, results, option]

- instruction: |
    Write `parsed_or_msg(s: &str) -> String` using `if let Ok(n)`: "ok N" or
    "bad".
  starter: |
    fn parsed_or_msg(s: &str) -> String {

    }
  solution: |
    fn parsed_or_msg(s: &str) -> String {
        if let Ok(n) = s.parse::<i32>() {
            format!("ok {n}")
        } else {
            "bad".to_string()
        }
    }
  source: "book §9.2 (if let Ok)"
  tags: [rust, results, if-let]

- instruction: |
    Write `len_or_zero(opt: Option<&str>) -> usize` using `map_or` (default 0).
  starter: |
    fn len_or_zero(opt: Option<&str>) -> usize {

    }
  solution: |
    fn len_or_zero(opt: Option<&str>) -> usize {
        opt.map_or(0, |s| s.len())
    }
  notes: |
    `map_or(default, f)` = map with `f` then unwrap_or `default`, in one step.
  source: "std Option::map_or"
  tags: [rust, results, map_or]

- instruction: |
    Write `describe_parse(s: &str) -> String` using `map_or_else`: "ok N" on
    success, "err E" on failure.
  starter: |
    fn describe_parse(s: &str) -> String {

    }
  solution: |
    fn describe_parse(s: &str) -> String {
        s.parse::<i32>()
            .map_or_else(|e| format!("err {e}"), |n| format!("ok {n}"))
    }
  notes: |
    For a `Result`, `map_or_else(err_fn, ok_fn)` handles both arms and returns
    one value — a compact `match`.
  source: "std Result::map_or_else"
  tags: [rust, results, map_or_else]

- instruction: |
    Write `even_only(opt: Option<i32>) -> Option<i32>` keeping the value only if
    it is even, using `filter`.
  starter: |
    fn even_only(opt: Option<i32>) -> Option<i32> {

    }
  solution: |
    fn even_only(opt: Option<i32>) -> Option<i32> {
        opt.filter(|&n| n % 2 == 0)
    }
  notes: |
    `Option::filter` keeps `Some(v)` only if the predicate holds, else `None`.
  source: "std Option::filter"
  tags: [rust, results, option, filter]

- instruction: |
    Define a `MyErr` type that converts from `ParseIntError`, then write
    `parse2(s: &str) -> Result<i32, MyErr>` using `?` (the error converts
    automatically via `From`).
  starter: |
    #[derive(Debug)]
    struct MyErr;

    impl From<std::num::ParseIntError> for MyErr {
        fn from(_: std::num::ParseIntError) -> Self {
            MyErr
        }
    }

    fn parse2(s: &str) -> Result<i32, MyErr> {

    }
  solution: |
    #[derive(Debug)]
    struct MyErr;

    impl From<std::num::ParseIntError> for MyErr {
        fn from(_: std::num::ParseIntError) -> Self {
            MyErr
        }
    }

    fn parse2(s: &str) -> Result<i32, MyErr> {
        let n: i32 = s.parse()?;
        Ok(n)
    }
  notes: |
    `?` calls `From::from` on the error, so a function can use `?` on any error
    that implements `Into<YourErr>`. This is how anyhow/thiserror feel seamless.
  source: "book §9.2 (? and From)"
  tags: [rust, results, question-mark, from]

- instruction: |
    Write `count_ok(results: &[Result<i32, String>]) -> usize`: how many are Ok.
  starter: |
    fn count_ok(results: &[Result<i32, String>]) -> usize {

    }
  solution: |
    fn count_ok(results: &[Result<i32, String>]) -> usize {
        results.iter().filter(|r| r.is_ok()).count()
    }
  notes: |
    `is_ok`/`is_err` (and `is_some`/`is_none`) give a quick boolean without
    consuming or destructuring.
  source: "std Result::is_ok"
  tags: [rust, results, predicates]

- instruction: |
    Write `config_value(primary: Option<i32>, fallback: Option<i32>) -> i32`:
    use `primary`, else `fallback`, else 0.
  starter: |
    fn config_value(primary: Option<i32>, fallback: Option<i32>) -> i32 {

    }
  solution: |
    fn config_value(primary: Option<i32>, fallback: Option<i32>) -> i32 {
        primary.or(fallback).unwrap_or(0)
    }
  notes: |
    `Option::or(other)` returns the first `Some`, else `other`. Chain `or` for
    layered fallbacks, then `unwrap_or` for the final default.
  source: "std Option::or"
  tags: [rust, results, option, or]

- instruction: |
    Write `items(opt: Option<Vec<i32>>) -> Vec<i32>`: the inner Vec or an empty
    one.
  starter: |
    fn items(opt: Option<Vec<i32>>) -> Vec<i32> {

    }
  solution: |
    fn items(opt: Option<Vec<i32>>) -> Vec<i32> {
        opt.unwrap_or_default()
    }
  notes: |
    `unwrap_or_default()` works for any `T: Default` — here an empty `Vec`.
  source: "std Option::unwrap_or_default"
  tags: [rust, results, option, unwrap_or_default]

- instruction: |
    Write `sum_two(a: &str, b: &str) -> Result<i32, std::num::ParseIntError>`:
    parse both with `?` on one line and return their sum.
  starter: |
    fn sum_two(a: &str, b: &str) -> Result<i32, std::num::ParseIntError> {

    }
  solution: |
    fn sum_two(a: &str, b: &str) -> Result<i32, std::num::ParseIntError> {
        Ok(a.parse::<i32>()? + b.parse::<i32>()?)
    }
  notes: |
    Multiple `?` in one expression short-circuit left to right.
  source: "book §9.2 (the ? operator)"
  tags: [rust, results, question-mark]

- instruction: |
    Write `greeting(name: &Option<String>) -> String`: "Hi NAME" if present,
    else "Hi there". Use `as_deref` so you don't move the String.
  starter: |
    fn greeting(name: &Option<String>) -> String {

    }
  solution: |
    fn greeting(name: &Option<String>) -> String {
        match name.as_deref() {
            Some(n) => format!("Hi {n}"),
            None => "Hi there".to_string(),
        }
    }
  notes: |
    `as_deref()` turns `&Option<String>` into `Option<&str>` — you borrow the
    contents instead of consuming the `Option`.
  source: "std Option::as_deref"
  tags: [rust, results, option, as_deref]

# --- concept cards ---
- type: concept
  question: |
    When should you reach for `Option<T>` versus `Result<T, E>`?
  answer: |
    `Option<T>`: a value may simply be absent, no explanation needed
    (`Some`/`None`). `Result<T, E>`: an operation may FAIL and you want to carry
    why (`Ok`/`Err` with an error). Use Result for fallible work.
  source: "book §9"
  tags: [rust, results, concept]

- type: concept
  question: |
    What does `?` do, and what does it require of the enclosing function?
  answer: |
    On `Ok(v)`/`Some(v)` it evaluates to `v`; on `Err(e)`/`None` it returns early
    with that `Err`/`None`. The function's return type must be a compatible
    `Result`/`Option`; for `Result`, the error converts via `From`.
  source: "book §9.2"
  tags: [rust, results, concept]

- type: concept
  question: |
    When is it acceptable to use `unwrap` / `expect`, and what do they do on
    failure?
  answer: |
    They return the inner value or PANIC on `None`/`Err`. Acceptable when failure
    is genuinely impossible or a bug (tests, prototypes, checked invariants). In
    real code prefer `?`, the `unwrap_or*` family, or matching. `expect("why")`
    documents the assumption in the panic message.
  source: "book §9.3"
  tags: [rust, results, concept]

- type: concept
  question: |
    Difference between `unwrap_or(x)` and `unwrap_or_else(|| x)` — and why does
    clippy care?
  answer: |
    `unwrap_or(x)` takes an already-evaluated value (eager). `unwrap_or_else(f)`
    calls the closure only on `None`/`Err` (lazy). Use `_else` when the fallback
    is expensive, allocates, or needs the error. clippy flags an eager call with
    an expensive arg (`or_fun_call`) and a lazy call with a trivial one
    (`unnecessary_lazy_evaluations`).
  source: "std Option/Result; clippy"
  tags: [rust, results, concept]
