- instruction: |
    Write `first_char_upper(opt: Option<&str>) -> Option<char>`: first char of
    the inner string, uppercased. Combine `and_then` and `map`.
  starter: |
    fn first_char_upper(opt: Option<&str>) -> Option<char> {

    }
  solution: |
    fn first_char_upper(opt: Option<&str>) -> Option<char> {
        opt.and_then(|s| s.chars().next()).map(|c| c.to_ascii_uppercase())
    }
  notes: |
    `and_then` flattens (the closure returns another Option, avoiding
    `Option<Option<char>>`); `map` then transforms the char.
