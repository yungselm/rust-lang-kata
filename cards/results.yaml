- instruction: |
    Write `describe_parse(s: &str) -> String` using `map_or_else`: "ok N" on
    success, "err E" on failure.
  starter: |
    fn describe_parse(s: &str) -> String {

    }
  solution: |
    fn describe_parse(s: &str) -> String {
        s.parse::<i32>()
            .map_or_else(|e| format!("err {e}"), |n| format!("ok {n}"))
    }
  notes: |
    For a `Result`, `map_or_else(err_fn, ok_fn)` handles both arms and returns
    one value — a compact `match`.
  source: "std Result::map_or_else"
  tags: [rust, results, map_or_else]

