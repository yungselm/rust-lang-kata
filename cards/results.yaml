# --- concept cards ---
- type: concept
  question: |
    When should you reach for `Option<T>` versus `Result<T, E>`?
  answer: |
    **Use `Option<T>` when a value may simply be absent with no explanation
    needed, and `Result<T, E>` when an operation may fail and you want to
    carry why.**

    `Option<T>`: `Some`/`None`, no error info. `Result<T, E>`: `Ok`/`Err`
    with an error. Use Result for fallible work.
  source: "book §9"
  tags: [rust, results, concept]

- type: concept
  question: |
    What does `?` do, and what does it require of the enclosing function?
  answer: |
    **`?` evaluates to the inner value on `Ok`/`Some`, or returns early with
    the `Err`/`None` on failure — requiring the enclosing function to return
    a compatible `Result`/`Option`.**

    On `Ok(v)`/`Some(v)` it evaluates to `v`; on `Err(e)`/`None` it returns
    early with that `Err`/`None`. For `Result`, the error converts via
    `From`.
  source: "book §9.2"
  tags: [rust, results, concept]

- type: concept
  question: |
    When is it acceptable to use `unwrap` / `expect`, and what do they do on
    failure?
  answer: |
    **`unwrap`/`expect` return the inner value or panic on `None`/`Err`; use
    them only when failure is genuinely impossible or a bug.**

    Acceptable for tests, prototypes, checked invariants. In real code prefer
    `?`, the `unwrap_or*` family, or matching. `expect("why")` documents the
    assumption in the panic message.
  source: "book §9.3"
  tags: [rust, results, concept]

- type: concept
  question: |
    Difference between `unwrap_or(x)` and `unwrap_or_else(|| x)` — and why does
    clippy care?
  answer: |
    **`unwrap_or(x)` is eager (x is always evaluated), while
    `unwrap_or_else(f)` is lazy (f runs only on `None`/`Err`).**

    Use `_else` when the fallback is expensive, allocates, or needs the
    error. clippy flags an eager call with an expensive argument
    (`or_fun_call`) and a lazy call with a trivial one
    (`unnecessary_lazy_evaluations`).
  source: "std Option/Result; clippy"
  tags: [rust, results, concept]

- instruction: |
    Define `enum DivisionError { DivideByZero, IntegerOverflow, NotDivisible }` and
    write `divide(a: i64, b: i64) -> Result<i64, DivisionError>`: Err `DivideByZero`
    if b is 0; `IntegerOverflow` if a is i64::MIN and b is -1; `NotDivisible` if a is
    not a multiple of b; otherwise Ok(a / b).
  starter: |
    #[derive(Debug, PartialEq, Eq)]
    enum DivisionError {
        DivideByZero,
        IntegerOverflow,
        NotDivisible,
    }

    fn divide(a: i64, b: i64) -> Result<i64, DivisionError> {

    }
  solution: |
    #[derive(Debug, PartialEq, Eq)]
    enum DivisionError {
        DivideByZero,
        IntegerOverflow,
        NotDivisible,
    }

    fn divide(a: i64, b: i64) -> Result<i64, DivisionError> {
        if b == 0 {
            return Err(DivisionError::DivideByZero);
        }
        if a == i64::MIN && b == -1 {
            return Err(DivisionError::IntegerOverflow);
        }
        if a % b != 0 {
            return Err(DivisionError::NotDivisible);
        }
        Ok(a / b)
    }
  notes: |
    A domain-specific error enum makes each failure a distinct, matchable value (and
    derives let you compare/inspect them). Guard the overflow case explicitly:
    `i64::MIN / -1` would otherwise panic.
  source: "Rustlings iterators3 · Book §9 (custom error types)"
  tags: [rust, results, errors, rustlings]
  tests: |
    assert_eq!(divide(81, 9), Ok(9));
    assert_eq!(divide(81, 0), Err(DivisionError::DivideByZero));
    assert_eq!(divide(i64::MIN, -1), Err(DivisionError::IntegerOverflow));
    assert_eq!(divide(81, 6), Err(DivisionError::NotDivisible));

- instruction: |
    Given `divide(a, b) -> Result<i64, DivisionError>`, divide [27, 297, 38502, 81]
    each by 27 and write two collectors: `result_with_list() -> Result<Vec<i64>,
    DivisionError>` (stop at the first error) and `list_of_results() -> Vec<Result<i64,
    DivisionError>>` (keep every outcome). Same iterator — only the return type differs.
  starter: |
    #[derive(Debug, PartialEq, Eq)]
    enum DivisionError {
        DivideByZero,
        IntegerOverflow,
        NotDivisible,
    }

    fn divide(a: i64, b: i64) -> Result<i64, DivisionError> {
        if b == 0 {
            return Err(DivisionError::DivideByZero);
        }
        if a % b != 0 {
            return Err(DivisionError::NotDivisible);
        }
        Ok(a / b)
    }

    fn result_with_list() -> Result<Vec<i64>, DivisionError> {

    }

    fn list_of_results() -> Vec<Result<i64, DivisionError>> {

    }
  solution: |
    #[derive(Debug, PartialEq, Eq)]
    enum DivisionError {
        DivideByZero,
        IntegerOverflow,
        NotDivisible,
    }

    fn divide(a: i64, b: i64) -> Result<i64, DivisionError> {
        if b == 0 {
            return Err(DivisionError::DivideByZero);
        }
        if a % b != 0 {
            return Err(DivisionError::NotDivisible);
        }
        Ok(a / b)
    }

    fn result_with_list() -> Result<Vec<i64>, DivisionError> {
        let numbers = [27, 297, 38502, 81];
        numbers.into_iter().map(|n| divide(n, 27)).collect()
    }

    fn list_of_results() -> Vec<Result<i64, DivisionError>> {
        let numbers = [27, 297, 38502, 81];
        numbers.into_iter().map(|n| divide(n, 27)).collect()
    }
  notes: |
    `collect()` is driven by the target type: into `Result<Vec<_>, _>` it
    short-circuits on the first `Err`; into `Vec<Result<_, _>>` it keeps every
    success and failure. Identical iterator, different collection.
  source: "Rustlings iterators3 · std FromIterator"
  tags: [rust, results, iterators, rustlings]
  tests: |
    assert_eq!(result_with_list(), Ok(vec![1, 11, 1426, 3]));
    assert_eq!(
        list_of_results(),
        vec![Ok(1), Ok(11), Ok(1426), Ok(3)]
    );

- instruction: |
    Write `parse_then_sqrt(s: &str) -> Result<f64, Box<dyn std::error::Error>>`:
    parse `s` as f64 with `?`; if it's negative return the error "negative input";
    otherwise return its square root.
    Example: "16" -> Ok(4.0); "x" -> Err; "-1" -> Err.
  starter: |
    fn parse_then_sqrt(s: &str) -> Result<f64, Box<dyn std::error::Error>> {

    }
  solution: |
    fn parse_then_sqrt(s: &str) -> Result<f64, Box<dyn std::error::Error>> {
        let n: f64 = s.parse()?;
        if n < 0.0 {
            return Err("negative input".into());
        }
        Ok(n.sqrt())
    }
  notes: |
    `Box<dyn Error>` is a trait object holding ANY error type, so `?` can mix
    different errors in one function: the parse error converts via `From`, and a
    `&str` becomes a boxed error with `.into()`. Great for app code where you don't
    need a precise error enum.
  source: "Rust Book §9.2 / §12 (Box<dyn Error>)"
  tags: [rust, results, errors]
  tests: |
    assert_eq!(parse_then_sqrt("16").unwrap(), 4.0);
    assert!(parse_then_sqrt("x").is_err());
    assert!(parse_then_sqrt("-1").is_err());

- instruction: |
    Write `flip(r: Result<Option<i32>, String>) -> Option<Result<i32, String>>`
    using `transpose`.
  starter: |
    fn flip(r: Result<Option<i32>, String>) -> Option<Result<i32, String>> {

    }
  solution: |
    fn flip(r: Result<Option<i32>, String>) -> Option<Result<i32, String>> {
        r.transpose()
    }
  notes: |
    `transpose()` swaps `Result<Option<T>, E>` and `Option<Result<T, E>>` —
    handy after a fallible step that may also be absent (e.g. parsing an
    optional field), so you can use `?` inside an `Option`-returning function.
  source: "std Result::transpose / Option::transpose"
  tags: [rust, results, option, transpose]
  tests: |
    assert_eq!(flip(Ok(Some(3))), Some(Ok(3)));
    assert_eq!(flip(Ok(None)), None);
    assert_eq!(flip(Err("e".to_string())), Some(Err("e".to_string())));

- instruction: |
    Write `first_available(primary: Option<i32>, compute_fallback: impl Fn() ->
    Option<i32>) -> Option<i32>`: return `primary` if present, otherwise call
    `compute_fallback`. Use `or_else` so the fallback only runs when needed.
  starter: |
    fn first_available(primary: Option<i32>, compute_fallback: impl Fn() -> Option<i32>) -> Option<i32> {

    }
  solution: |
    fn first_available(primary: Option<i32>, compute_fallback: impl Fn() -> Option<i32>) -> Option<i32> {
        primary.or_else(compute_fallback)
    }
  notes: |
    `or_else(f)` is the lazy sibling of `or(other)`: `f` runs only when
    `primary` is `None`. Prefer it whenever computing the fallback is
    expensive or has side effects — the test below proves it's skipped when
    `primary` is already `Some`.
  source: "std Option::or_else"
  tags: [rust, results, option, or_else]
  tests: |
    use std::cell::Cell;
    let calls = Cell::new(0);
    let fallback = || { calls.set(calls.get() + 1); Some(9) };
    assert_eq!(first_available(Some(1), fallback), Some(1));
    assert_eq!(calls.get(), 0);
    assert_eq!(first_available(None, fallback), Some(9));
    assert_eq!(calls.get(), 1);

- instruction: |
    Write `pair(a: Option<i32>, b: Option<&str>) -> Option<(i32, String)>`
    combining both into a tuple only if BOTH are present, using `zip`.
  starter: |
    fn pair(a: Option<i32>, b: Option<&str>) -> Option<(i32, String)> {

    }
  solution: |
    fn pair(a: Option<i32>, b: Option<&str>) -> Option<(i32, String)> {
        a.zip(b).map(|(n, s)| (n, s.to_string()))
    }
  notes: |
    `Option::zip` combines two Options into `Option<(A, B)>` — `Some` only
    when both are `Some`, else `None`. Chain `.map` to reshape the pair
    afterward.
  source: "std Option::zip"
  tags: [rust, results, option, zip]
  tests: |
    assert_eq!(pair(Some(1), Some("a")), Some((1, "a".to_string())));
    assert_eq!(pair(None, Some("a")), None);
    assert_eq!(pair(Some(1), None), None);

