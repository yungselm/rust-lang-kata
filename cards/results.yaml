- instruction: |
    Write `len_or_zero(opt: Option<&str>) -> usize` using `map_or` (default 0).
  starter: |
    fn len_or_zero(opt: Option<&str>) -> usize {

    }
  solution: |
    fn len_or_zero(opt: Option<&str>) -> usize {
        opt.map_or(0, |s| s.len())
    }
