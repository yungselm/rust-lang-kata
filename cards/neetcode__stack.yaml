# NeetCode 150 — Stack. Original prompts; idiomatic, clippy-clean
# Rust; example tests run by `python check_cards.py`.
- instruction: |
    Valid Parentheses. Write `is_valid(s: &str) -> bool`: true if every opening
    bracket among '(', '[', '{' is closed by the matching kind in the correct
    order, with nothing left open.
    Example: "([{}])" -> true; "(]" -> false.
  starter: |
    fn is_valid(s: &str) -> bool {

    }
  solution: |
    fn is_valid(s: &str) -> bool {
        let mut stack = Vec::new();
        for c in s.chars() {
            match c {
                '(' => stack.push(')'),
                '[' => stack.push(']'),
                '{' => stack.push('}'),
                _ => {
                    if stack.pop() != Some(c) {
                        return false;
                    }
                }
            }
        }
        stack.is_empty()
    }
  notes: |
    Push the expected closer when you see an opener; on a closer it must equal the
    top of the stack. An empty stack at the end means everything matched.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Each opener must be closed by its match in <b>reverse order</b> — exactly stack (last-in-first-out) behaviour. Push the expected closer on an opener; every closer must equal the top.</p>
      <div class="vz-flow"><span class="vz-step">opener → push its closer</span><span class="vz-arr">→</span><span class="vz-step">closer → must equal top</span><span class="vz-arr">→</span><span class="vz-step win">empty at end → valid</span></div>
    </div>
    ===
    2-4 | Stack of expected closing brackets.
    ===
    5-8 | On an opener, push the closer we expect.
    ===
    9-14 | On a closer, it must match the top of the stack.
    ===
    15-16 | Valid iff nothing is left open.
  source: "NeetCode 150 · Stack"
  tags: [rust, neetcode, stack]
  tests: |
    assert!(is_valid("([{}])"));
    assert!(is_valid("()[]{}"));
    assert!(!is_valid("(]"));
    assert!(!is_valid("("));
    assert!(!is_valid(")"));

- instruction: |
    Min Stack. Design `MinStack` supporting `new`, `push(i32)`, `pop`,
    `top() -> i32`, and `get_min() -> i32` (minimum currently on the stack), each
    running in O(1).
    Example: push 2, push 1 -> get_min 1; pop -> get_min 2.
  starter: |
    struct MinStack {

    }

    impl MinStack {
        fn new() -> Self {

        }

        fn push(&mut self, val: i32) {

        }

        fn pop(&mut self) {

        }

        fn top(&self) -> i32 {

        }

        fn get_min(&self) -> i32 {

        }
    }
  solution: |
    struct MinStack {
        stack: Vec<i32>,
        mins: Vec<i32>,
    }

    impl MinStack {
        fn new() -> Self {
            MinStack {
                stack: Vec::new(),
                mins: Vec::new(),
            }
        }

        fn push(&mut self, val: i32) {
            let m = match self.mins.last() {
                Some(&cur) => cur.min(val),
                None => val,
            };
            self.stack.push(val);
            self.mins.push(m);
        }

        fn pop(&mut self) {
            self.stack.pop();
            self.mins.pop();
        }

        fn top(&self) -> i32 {
            *self.stack.last().unwrap()
        }

        fn get_min(&self) -> i32 {
            *self.mins.last().unwrap()
        }
    }
  notes: |
    Keep a parallel stack whose top is always the running minimum: on each push,
    store min(new value, previous min).
    Time O(1) per operation, Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Carry the running minimum <b>alongside</b> the data: a parallel stack whose top is min(new value, previous min), so get_min is O(1).</p>
      <div class="vz-flow"><span class="vz-step">push the value</span><span class="vz-arr">→</span><span class="vz-step">also push min(value, prev min)</span><span class="vz-arr">→</span><span class="vz-step win">get_min = top of mins</span></div>
    </div>
    ===
    14 | push: store the value and the running minimum together.
    ===
    15-22 | That minimum is min(new value, previous min).
    ===
    23-31 | pop: remove from both the value and min stacks.
    ===
    32-35 | get_min / top: just peek the relevant stack -- all O(1).
  source: "NeetCode 150 · Stack"
  tags: [rust, neetcode, stack]
  tests: |
    let mut s = MinStack::new();
    s.push(2);
    s.push(1);
    s.push(3);
    assert_eq!(s.get_min(), 1);
    assert_eq!(s.top(), 3);
    s.pop();
    assert_eq!(s.get_min(), 1);
    s.pop();
    assert_eq!(s.get_min(), 2);
    assert_eq!(s.top(), 2);

- instruction: |
    Evaluate Reverse Polish Notation. Write `eval_rpn(tokens: &[&str]) -> i32`:
    evaluate the postfix expression; tokens are integers or one of "+", "-", "*",
    "/" (integer division truncating toward zero).
    Example: ["2", "1", "+", "3", "*"] -> 9.
  starter: |
    fn eval_rpn(tokens: &[&str]) -> i32 {

    }
  solution: |
    fn eval_rpn(tokens: &[&str]) -> i32 {
        let mut stack: Vec<i32> = Vec::new();
        for &tok in tokens {
            match tok {
                "+" | "-" | "*" | "/" => {
                    let b = stack.pop().unwrap();
                    let a = stack.pop().unwrap();
                    stack.push(match tok {
                        "+" => a + b,
                        "-" => a - b,
                        "*" => a * b,
                        _ => a / b,
                    });
                }
                _ => stack.push(tok.parse().unwrap()),
            }
        }
        stack.pop().unwrap()
    }
  notes: |
    Push numbers; on an operator pop the two operands (the second popped is the
    left-hand side) and push the result. Rust's `/` already truncates toward zero.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Postfix evaluates with a <b>stack</b>: push numbers, and on an operator pop the two operands (second popped is the left side), apply it, and push the result.</p>
      <div class="vz-flow"><span class="vz-step">number → push</span><span class="vz-arr">→</span><span class="vz-step">operator → pop two</span><span class="vz-arr">→</span><span class="vz-step">apply, push result</span><span class="vz-arr">→</span><span class="vz-step win">final value = answer</span></div>
    </div>
    ===
    2-5 | A stack of operands.
    ===
    6-7 | On an operator, pop the two operands (b is the right-hand side).
    ===
    8-14 | Apply the operator and push the result.
    ===
    15-17 | A plain number is just pushed.
    ===
    18-19 | The final value on the stack is the answer.
  source: "NeetCode 150 · Stack"
  tags: [rust, neetcode, stack]
  tests: |
    assert_eq!(eval_rpn(&["2", "1", "+", "3", "*"]), 9);
    assert_eq!(eval_rpn(&["4", "13", "5", "/", "+"]), 6);
    assert_eq!(
        eval_rpn(&["10", "6", "9", "3", "+", "-11", "*", "/", "*", "17", "+", "5", "+"]),
        22
    );

- instruction: |
    Generate Parentheses. Write `generate_parenthesis(n: usize) -> Vec<String>`:
    all distinct strings of `n` pairs of well-formed parentheses (any order).
    Example: n = 2 -> ["(())", "()()"].
  starter: |
    fn generate_parenthesis(n: usize) -> Vec<String> {

    }
  solution: |
    fn generate_parenthesis(n: usize) -> Vec<String> {
        let mut res = Vec::new();
        let mut cur = String::new();
        backtrack(n, 0, 0, &mut cur, &mut res);
        res
    }

    fn backtrack(n: usize, open: usize, close: usize, cur: &mut String, res: &mut Vec<String>) {
        if cur.len() == 2 * n {
            res.push(cur.clone());
            return;
        }
        if open < n {
            cur.push('(');
            backtrack(n, open + 1, close, cur, res);
            cur.pop();
        }
        if close < open {
            cur.push(')');
            backtrack(n, open, close + 1, cur, res);
            cur.pop();
        }
    }
  notes: |
    Backtracking: add '(' while opens remain, add ')' only while closes trail
    opens (keeping the prefix valid). The count is the nth Catalan number.
    Time O(4^n / sqrt(n)), Space O(4^n / sqrt(n)).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Build strings by choosing '(' while <b>opens remain</b> and ')' only while <b>closes trail opens</b> — that keeps every prefix valid. Backtrack over the two choices.</p>
      <div class="vz-flow"><span class="vz-step">add &#x27;(&#x27; if opens &lt; n</span><span class="vz-arr">→</span><span class="vz-step">add &#x27;)&#x27; if closes &lt; opens</span><span class="vz-arr">→</span><span class="vz-step">full length → record</span><span class="vz-arr">→</span><span class="vz-step win">backtrack</span></div>
    </div>
    ===
    4-8 | Build strings recursively, starting empty.
    ===
    9-12 | A full-length string is one valid combination.
    ===
    13-17 | Add '(' while opens remain.
    ===
    18-23 | Add ')' only while closes trail opens (keeps it valid).
  source: "NeetCode 150 · Stack"
  tags: [rust, neetcode, stack]
  tests: |
    let mut got = generate_parenthesis(3);
    got.sort();
    let mut want = vec![
        "((()))".to_string(),
        "(()())".to_string(),
        "(())()".to_string(),
        "()(())".to_string(),
        "()()()".to_string(),
    ];
    want.sort();
    assert_eq!(got, want);
    assert_eq!(generate_parenthesis(1), vec!["()".to_string()]);

- instruction: |
    Daily Temperatures. Write `daily_temperatures(temps: &[i32]) -> Vec<i32>` where
    output[i] is the number of days until a warmer temperature than temps[i], or 0
    if none.
    Example: [73, 74, 75, 71, 69, 72, 76, 73] -> [1, 1, 4, 2, 1, 1, 0, 0].
  starter: |
    fn daily_temperatures(temps: &[i32]) -> Vec<i32> {

    }
  solution: |
    fn daily_temperatures(temps: &[i32]) -> Vec<i32> {
        let mut res = vec![0; temps.len()];
        let mut stack: Vec<usize> = Vec::new();
        for (i, &t) in temps.iter().enumerate() {
            while let Some(&j) = stack.last() {
                if temps[j] < t {
                    stack.pop();
                    res[j] = (i - j) as i32;
                } else {
                    break;
                }
            }
            stack.push(i);
        }
        res
    }
  notes: |
    A monotonic stack of indices with decreasing temperatures: when today is
    warmer, pop and record the day gap. Each index is pushed/popped once.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Keep a stack of days still <b>waiting for a warmer one</b> (decreasing temps). When today is warmer, pop each waiting day and record how many days it waited.</p>
      <div class="vz-flow"><span class="vz-step">stack of cooler days</span><span class="vz-arr">→</span><span class="vz-step">today warmer? pop &amp; record gap</span><span class="vz-arr">→</span><span class="vz-step win">push today</span></div>
    </div>
    ===
    3 | Stack of days still waiting for a warmer one (decreasing temps).
    ===
    4-5 | Scan each day.
    ===
    6-12 | Today is warmer -> pop waiting days and record how long they waited.
    ===
    13-14 | Today now waits too.
    ===
    15-16 | Days-to-warmer for each day.
  source: "NeetCode 150 · Stack"
  tags: [rust, neetcode, stack]
  tests: |
    assert_eq!(
        daily_temperatures(&[73, 74, 75, 71, 69, 72, 76, 73]),
        vec![1, 1, 4, 2, 1, 1, 0, 0]
    );
    assert_eq!(daily_temperatures(&[30, 40, 50, 60]), vec![1, 1, 1, 0]);
    assert_eq!(daily_temperatures(&[30, 60, 90]), vec![1, 1, 0]);

- instruction: |
    Car Fleet. `target` is the destination; car i starts at position[i] going at
    speed[i] (all positions distinct). A faster car catching a slower one forms a
    fleet moving at the slower speed. Write
    `car_fleet(target: i32, position: &[i32], speed: &[i32]) -> i32`: the number of
    fleets arriving.
    Example: target 12, position [10,8,0,5,3], speed [2,4,1,1,3] -> 3.
  starter: |
    fn car_fleet(target: i32, position: &[i32], speed: &[i32]) -> i32 {

    }
  solution: |
    fn car_fleet(target: i32, position: &[i32], speed: &[i32]) -> i32 {
        let mut cars: Vec<(i32, i32)> =
            position.iter().copied().zip(speed.iter().copied()).collect();
        cars.sort_by_key(|&(p, _)| std::cmp::Reverse(p));
        let mut fleets = 0;
        let mut slowest = f64::NEG_INFINITY;
        for (p, s) in cars {
            let time = (target - p) as f64 / s as f64;
            if time > slowest {
                fleets += 1;
                slowest = time;
            }
        }
        fleets
    }
  notes: |
    Sort cars from closest-to-target back. Process in that order: a car whose
    arrival time exceeds the current fleet leader's starts a new fleet; otherwise
    it catches up and merges.
    Time O(n log n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Sort cars from <b>nearest the target backwards</b>. A car that would arrive later than the fleet ahead of it starts a new fleet; otherwise it catches up and merges.</p>
      <div class="vz-flow"><span class="vz-step">sort by position, nearest first</span><span class="vz-arr">→</span><span class="vz-step">compute each arrival time</span><span class="vz-arr">→</span><span class="vz-step">later than leader → new fleet</span><span class="vz-arr">→</span><span class="vz-step win">else merge</span></div>
    </div>
    ===
    4-7 | Sort cars from nearest the target backwards.
    ===
    8 | Compute each car's arrival time.
    ===
    9 | Arrives later than the fleet ahead -> new fleet; else it merges.
    ===
    10-15 | Number of fleets.
  source: "NeetCode 150 · Stack"
  tags: [rust, neetcode, stack]
  tests: |
    assert_eq!(car_fleet(12, &[10, 8, 0, 5, 3], &[2, 4, 1, 1, 3]), 3);
    assert_eq!(car_fleet(10, &[3], &[3]), 1);
    assert_eq!(car_fleet(100, &[0, 2, 4], &[4, 2, 1]), 1);

- instruction: |
    Largest Rectangle in Histogram. Given bar heights of equal width 1, write
    `largest_rectangle_area(heights: &[i32]) -> i32`: the area of the largest
    rectangle that fits entirely under the bars.
    Example: [2, 1, 5, 6, 2, 3] -> 10 (the 5 and 6 bars: width 2 x height 5).
  starter: |
    fn largest_rectangle_area(heights: &[i32]) -> i32 {

    }
  solution: |
    fn largest_rectangle_area(heights: &[i32]) -> i32 {
        let mut stack: Vec<(usize, i32)> = Vec::new();
        let mut best = 0;
        for (i, &h) in heights.iter().enumerate() {
            let mut start = i;
            while let Some(&(idx, height)) = stack.last() {
                if height > h {
                    stack.pop();
                    best = best.max(height * (i - idx) as i32);
                    start = idx;
                } else {
                    break;
                }
            }
            stack.push((start, h));
        }
        let n = heights.len();
        for (idx, height) in stack {
            best = best.max(height * (n - idx) as i32);
        }
        best
    }
  notes: |
    Monotonic increasing stack of (start index, height). When a shorter bar
    arrives, pop taller bars and close their rectangles, extending the new bar's
    start back to the popped position. Leftovers reach the end.
    Time O(n), Space O(n).
  walkthrough: |
    @idea
    <div class="wt-idea-box">
      <div class="vz-lab">Core idea</div>
      <p>Each bar's rectangle extends until a <b>shorter bar</b> stops it. A monotonic (increasing) stack closes a bar's rectangle the moment a shorter bar appears, stretching the new bar's start back to where it could begin.</p>
      <div class="vz-flow"><span class="vz-step">increasing stack of bars</span><span class="vz-arr">→</span><span class="vz-step">shorter bar → pop &amp; close rectangle</span><span class="vz-arr">→</span><span class="vz-step">extend start back</span><span class="vz-arr">→</span><span class="vz-step win">track max area</span></div>
    </div>
    ===
    2-5 | Increasing stack of (start index, height).
    ===
    6-9 | A shorter bar arrives -> pop taller bars and close their rectangles.
    ===
    10-17 | Extend the new bar's start back to where the popped bar began.
    ===
    18 | Bars left on the stack reach the end.
    ===
    19-22 | Largest rectangle area.
  source: "NeetCode 150 · Stack"
  tags: [rust, neetcode, stack]
  tests: |
    assert_eq!(largest_rectangle_area(&[2, 1, 5, 6, 2, 3]), 10);
    assert_eq!(largest_rectangle_area(&[2, 4]), 4);
    assert_eq!(largest_rectangle_area(&[2, 1, 2]), 3);
    assert_eq!(largest_rectangle_area(&[5]), 5);
